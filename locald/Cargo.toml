[package]
name = "lemma-locald"
version = "0.1.0"
description = "Durable local control plane for Lemma Desktop and lemma-stack"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
getrandom = "0.3"
interprocess = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
