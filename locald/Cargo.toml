[package]
name = "lemma-locald"
version = "0.1.0"
description = "Durable local control plane for Lemma Desktop and lemma-stack"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
interprocess = "2.4"
keyring = "4.1.5"
lemma-runtime-manager = { path = "../local-runtime/manager" }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
