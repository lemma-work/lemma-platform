[project]
name = "lemma-stack"
version = "0.7.0"
description = "Installer and management tool for a fully-local Lemma stack"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "typer>=0.27.1",
    "rich>=13.9.4",
    "tomlkit>=0.15.1",
    "packaging>=26.3",
]

[project.scripts]
lemma-stack = "lemma_stack.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lemma_stack*"]

[tool.setuptools.package-data]
lemma_stack = ["data/**"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "install_experience: Docker-based cross-platform install tests (slow, need Docker for some)",
]
