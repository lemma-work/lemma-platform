[project]
name = "agentbox"
version = "0.7.0"
description = "Provider-neutral sandbox fabric for Lemma workspaces and functions"
requires-python = ">=3.14,<3.15"
# What is left of this package ships inside the sandbox images: two HTTP
# runtimes, the domain types and the wire contracts. The manager's own
# dependencies -- its database (alembic, sqlalchemy, aiosqlite, psycopg), its
# provider SDKs and its telemetry exporters -- went with the manager. Keeping
# them would have pulled a manager-sized dependency tree into every sandbox and
# into any backend installing the `local` extra.
dependencies = [
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.42.0",
    "pydantic>=2.11.0",
    "uvicorn[standard]>=0.42.0",
]

[project.optional-dependencies]
# For `templates/e2b/build_templates.py`, which builds the E2B sandbox
# templates. Opt-in, so it never reaches a sandbox image or the backend's
# `local` extra -- both of which ask for this package without extras.
e2b = [
    "e2b==2.34.0",
]

[dependency-groups]
dev = [
    "agentbox-client",
    "lemma-sdk",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.0,<0.16.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentbox*"]

[tool.uv.sources]
agentbox-client = { path = "../agentbox-client", editable = true }
lemma-sdk = { path = "../lemma-python", editable = true }
