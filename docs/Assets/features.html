<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--card:#fbfaf7;--line:#e7e3da;--ink:#1b1a17;--p:#5a3fd4;--t:#e6e0fb}
.dark{--card:#151a21;--line:#2a313b;--ink:#e9edf2;--p:#a796f7;--t:#2c2550}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:150px;overflow:hidden;background:transparent}
body{font-family:Inter,sans-serif;font-weight:500;color:var(--ink);padding:8px;-webkit-font-smoothing:antialiased}
.row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;height:100%}
.t{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
svg{width:44px;height:44px}
.s{fill:none;stroke:var(--p);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.f{fill:var(--t)}
span{font-size:17px;letter-spacing:-.01em}
