[project]
name = "lemma-connectors"
version = "0.7.1"
description = "OpenAPI-native native connector packages for Lemma"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "attrs>=25.3.0",
    "httpx>=0.28.1",
    "json-schema-to-pydantic>=0.4.11",
    "pydantic>=2.11.9",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    # The floor is a security bound, not a preference: eleven advisories sat
    # against 0.56.1 -- code injection via unescaped input and arbitrary local
    # file read among them -- and 0.64.0 is the highest first-patched version
    # across them. Below this the generator is exploitable by a hostile spec.
    "datamodel-code-generator>=0.64.0",
    "openapi-python-client>=0.29.0",
]

# Ruff, scoped. The generated OpenAPI clients under */generated/** carry many
# pre-existing findings that are not worth chasing -- the Slack client alone
# reports 75 undefined-name errors from its `Unset`/`UNSET` sentinel pattern --
# but the hand-written code around them was going unlinted as a result. That is
# how `LazyToolMap.get_tool` came to raise a name it never imported: every
# lookup miss produced a NameError instead of ToolNotFoundError, and no gate
# looked. Excluding the generated trees makes the rest enforceable.
[tool.ruff]
extend-exclude = ["src/lemma_connectors/*/generated/**"]

# Written down rather than inherited. Ruff's default selection is not stable
# across releases -- 0.16 widened it, and four projects here that had never
# named a rule set silently acquired hundreds of them, failing a lint gate on a
# dependency bump that touched no code. These four codes are what the default
# has meant for this project all along; changing what is enforced is a separate
# decision from upgrading the linter.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemma_connectors"]
