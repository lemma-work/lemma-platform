[pytest]
# Pytest configuration for lemma-backend project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths - where pytest should look for tests
# app/tests holds the cross-cutting guards (version policy, health, telemetry).
# It was omitted here, so those tests were collected by nobody: the version
# compatibility guard silently stopped running and the API/SDK versions drifted
# apart unnoticed.
# sandbox_runtime is the code that ships inside the sandbox images. It is
# collected here because it moved into this project from a package with its own
# CI job; without this line those 43 tests would simply stop running and
# nothing would say so.
testpaths = app/modules app/core app/tests sandbox_runtime

# Markers for categorizing tests
markers =
    unit: Unit tests for service layer
    e2e: End-to-end API tests
    integration: Integration tests that require external services (DB, SuperTokens, etc.)
    slow: Tests that take a long time to run
    worker: Tests that require the real streaq worker
    approval_worker: Approval tests that must use the real streaq worker instead of the inline test adapter
    workspace: Tests that require a docker workspace runtime image
    indexing: E2E tests that need the Kreuzberg document-extraction container (real indexing/search); split out of test-e2e-fast
    provider: Tests that require real third-party provider credentials or APIs
    surface_live: Optional live agent-surface provider smoke tests; gated by LEMMA_RUN_SURFACE_LIVE_E2E=1
    human: Tests needing a human in the loop (e.g. live OAuth consent); opt-in only, never in CI
    local_cli: Tests that require locally built or installed agent CLI binaries; each dedicated lane supplies its binaries
    agent_host_browser: Full chat UI against the real backend and Agent Host, requiring frontend dependencies and Playwright
    local_guest: Tests that require Lemma Desktop's managed runtime VM to be running
    local_host: Tests that require something built or running on this host that the unit lane does not provide (a reachable Docker daemon, a cargo-built bridge binary); they can only skip in that lane
    desktop_e2e: Real end-to-end journeys against a running Lemma Desktop install (apps, functions, pod files, WKWebView sessions); gated by LEMMA_DESKTOP_E2E=1
    real_llm: Tests that require the real model (skipped in mock e2e mode)
    real_sandbox: Tests that require the real Docker sandbox (skipped in fake e2e mode)
    fast_workspace: Deterministic agent journeys that use the real sandbox but belong in the fast coverage shard
    protected: Tests requiring protected infrastructure or secrets; never run in the required hermetic PR suite
    connection_scope: Runtime proof that a flow holds no pooled connection across non-database work; run as a required CI gate

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Output options
addopts =
    # Show verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Show warnings
    -W default
    # NOTE: output capture is intentionally left ON (no -s). The e2e suites emit
    # very chatty structlog/httpx logs; capturing them keeps passing runs clean
    # and only surfaces logs for failing tests. Pass `-s` on the CLI to debug.
    # Enable strict markers (must be defined above)
    --strict-markers
    # Show duration of slowest tests
    --durations=10
    # Avoid module-name collisions across module-local conftest packages (e.g. tests/e2e)
    --import-mode=importlib
    # Coverage options (if pytest-cov is installed)
    # --cov=domains
    # --cov-report=html
    # --cov-report=term-missing

# Minimum Python version required
minversion = 3.12

# Test collection patterns
norecursedirs = 
    .git
    .venv
    venv
    env
    __pycache__
    *.egg-info
    .pytest_cache
    node_modules
    migrations
    archived
    deprecated
    exp

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (requires pytest-timeout). E2E tests spawn containers, real
# workers, and SSE streams; a hard per-test cap prevents the suite from hanging
# forever when a background process leaks or a stream never terminates.
timeout = 300

# Pytest asyncio configuration
[pytest_asyncio]
# Automatically detect async tests
asyncio_mode = auto
