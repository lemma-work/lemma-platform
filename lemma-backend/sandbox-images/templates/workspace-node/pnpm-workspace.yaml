# undici arrives transitively through jsdom. 7.28.0 carries
# GHSA-4cwx-7wf7-3272 (cross-user information disclosure via degenerate
# private cache directives), fixed in 7.29.0, and jsdom has not moved yet.
# 7.30.1 closes the later advisories against 7.29.x.
overrides:
  undici: "^7.30.1"

allowBuilds:
  agent-browser: true

engineStrict: true
strictDepBuilds: true
