# Load-test stack for the lemma-backend.
#
# Runs all required infrastructure services plus the API and worker as
# separate services (matching prod topology) with hard resource limits
# that simulate a 2 CPU / 2 GB RAM production server.
#
# Usage (see also `make load-test` in lemma-backend/Makefile):
#
#   # 1. Build the images (from repo root):
#   docker build -t lemma-backend:load-test -f lemma-backend/Dockerfile .
#   make -C lemma-backend sandbox-images
#
#   # 2. Bring up infrastructure + API + worker:
#   docker compose -f load_tests/docker-compose.load-test.yml up -d
#
#   # 3. Provision test data (requires uv / Python on the host):
#   uv run python load_tests/setup.py
#
#   # 4. Start the DB connection monitor (in a separate terminal):
#   uv run python load_tests/db_monitor.py --interval 5
#
#   # 5. Run k6 (reads creds from the generated .env.load_test):
#   docker run --rm --network host \
#     --env-file load_tests/.env.load_test \
#     -v ./load_tests:/scripts \
#     grafana/k6:latest run /scripts/ws_concurrent.js
#
#   # 6. During/after the run, check memory & CPU:
#   docker stats lemma-load-api lemma-load-worker --no-stream
#
#   # 7. Tear down when finished:
#   docker compose -f load_tests/docker-compose.load-test.yml down -v

services:

  db:
    image: docker.io/pgvector/pgvector:0.8.3-pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lemma
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - load_test_net

  redis:
    image: docker.io/redis:7.4-alpine
    networks:
      - load_test_net
    depends_on:
      db:
        condition: service_healthy

  supertokens:
    image: docker.io/supertokens/supertokens-postgresql:11.4.5
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://postgres:postgres@db:5432/supertokens
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - load_test_net

  # ── API service (matches prod: separate pod) ──────────────────────────────
  api:
    image: ${LEMMA_IMAGE:-lemma-backend:load-test}
    container_name: lemma-load-api
    command: ["uvicorn", "app.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lemma
      DATASTORE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lemma_datastore
      REDIS_URL: redis://redis:6379
      SUPERTOKENS_CORE_URL: http://supertokens:3567
      ENVIRONMENT: local
      # The synthetic load-test identity uses a domain that neither exists in
      # DNS nor is meant to receive mail, so both signup email gates are turned
      # off for this throwaway stack only.
      AUTH_EMAIL_DELIVERABILITY_CHECKS_ENABLED: "false"
      AUTH_DISPOSABLE_EMAIL_DOMAINS_ENABLED: "false"
      # The journey profile self-provisions a user per VU from one host IP,
      # which trips the 60/min/IP auth ceiling immediately and leaves the
      # run measuring nothing but 429s. Off for the harness only.
      # Ships off by default (#364). Production has no pooler in front of
      # Postgres, so session-scoped LISTEN survives — on here so the load
      # profile exercises the path production would run.
      OUTBOX_LISTEN_ENABLED: "true"
      # The harness drives the app directly; keep the document available so
      # a profile run can be pointed at a schema when debugging.
      API_DOCS_ENABLED: "true"
      AUTH_ABUSE_PROTECTION_ENABLED: "false"
      # A freshly signed-up user carries st-ev=false, and creating an org
      # requires a verified email — so the self-provisioning journey could
      # never get past its first call. No mail server here to verify with.
      AUTH_EMAIL_VERIFICATION_REQUIRED: "false"
      LOCAL_OBJECT_STORAGE_ROOT: /home/appuser/.local/object-storage
      LOCAL_FILE_STORAGE_ROOT: /home/appuser/.local/files
      REDIS_STREAM_POLLING_INTERVAL_MS: 200
      DB_POOL_SIZE: "10"
      WORKER_CONCURRENCY: "20"
      # Mock LLM: deterministic in-process pydantic-ai FunctionModel — no real
      # model or API key. The journey scripts each response via
      # conversation.metadata.mock_llm_script (text deltas + a write_todos call).
      # Placeholder key so default runtime-profile resolution succeeds; the mock
      # short-circuits model construction before it is ever used.
      E2E_LLM_MODE: "mock"
      # Emulate real LLM I/O latency so the worker is I/O-bound like prod (an
      # instant mock makes runs CPU-bound and saturates one core). ~2 turns/run.
      E2E_MOCK_LLM_LATENCY_MS: "1500"
      LEMMA_OPENAI_API_KEY: "EMPTY"
      API_URL: "http://api:8000"
      FUNCTION_RUNTIME_GATEWAY_URL: "http://api:8000"
      E2E_SANDBOX_MODE: "docker"
      # Sandboxes are provisioned in-process against the mounted Docker socket;
      # there is no separate manager service to point at any more.
      WORKSPACE_PROVIDER: "docker"
      WORKSPACE_RUNTIME_CREDENTIAL_KEY: "load-test-runtime-credential-key"
      WORKSPACE_DOCKER_SOCKET_PATH: "/var/run/docker.sock"
      WORKSPACE_DOCKER_PRIVATE_NETWORK: "lemma-load-test-net"
      WORKSPACE_DOCKER_ALLOW_MUTABLE_IMAGES: "true"
      WORKSPACE_ADD_HOST_GATEWAY: "false"
      WORKSPACE_IMAGE: ${WORKSPACE_IMAGE:-lemma-workspace:dev}
      FUNCTION_IMAGE: ${FUNCTION_IMAGE:-lemma-function:dev}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - load_test_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ── Worker service (matches prod: separate pod) ───────────────────────────
  worker:
    image: ${LEMMA_IMAGE:-lemma-backend:load-test}
    container_name: lemma-load-worker
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lemma
      DATASTORE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lemma_datastore
      REDIS_URL: redis://redis:6379
      SUPERTOKENS_CORE_URL: http://supertokens:3567
      ENVIRONMENT: local
      # The synthetic load-test identity uses a domain that neither exists in
      # DNS nor is meant to receive mail, so both signup email gates are turned
      # off for this throwaway stack only.
      AUTH_EMAIL_DELIVERABILITY_CHECKS_ENABLED: "false"
      AUTH_DISPOSABLE_EMAIL_DOMAINS_ENABLED: "false"
      # The journey profile self-provisions a user per VU from one host IP,
      # which trips the 60/min/IP auth ceiling immediately and leaves the
      # run measuring nothing but 429s. Off for the harness only.
      # Ships off by default (#364). Production has no pooler in front of
      # Postgres, so session-scoped LISTEN survives — on here so the load
      # profile exercises the path production would run.
      OUTBOX_LISTEN_ENABLED: "true"
      # The harness drives the app directly; keep the document available so
      # a profile run can be pointed at a schema when debugging.
      API_DOCS_ENABLED: "true"
      AUTH_ABUSE_PROTECTION_ENABLED: "false"
      # A freshly signed-up user carries st-ev=false, and creating an org
      # requires a verified email — so the self-provisioning journey could
      # never get past its first call. No mail server here to verify with.
      AUTH_EMAIL_VERIFICATION_REQUIRED: "false"
      LOCAL_OBJECT_STORAGE_ROOT: /home/appuser/.local/object-storage
      LOCAL_FILE_STORAGE_ROOT: /home/appuser/.local/files
      REDIS_STREAM_POLLING_INTERVAL_MS: 200
      DB_POOL_SIZE: "10"
      WORKER_CONCURRENCY: "20"
      # Mock LLM (see api service above): the worker runs the real agent harness
      # but with the deterministic FunctionModel instead of a real provider.
      E2E_LLM_MODE: "mock"
      # Emulate real LLM I/O latency so the worker is I/O-bound like prod (an
      # instant mock makes runs CPU-bound and saturates one core). ~2 turns/run.
      E2E_MOCK_LLM_LATENCY_MS: "1500"
      LEMMA_OPENAI_API_KEY: "EMPTY"
      API_URL: "http://api:8000"
      FUNCTION_RUNTIME_GATEWAY_URL: "http://api:8000"
      E2E_SANDBOX_MODE: "docker"
      # Sandboxes are provisioned in-process against the mounted Docker socket;
      # there is no separate manager service to point at any more.
      WORKSPACE_PROVIDER: "docker"
      WORKSPACE_RUNTIME_CREDENTIAL_KEY: "load-test-runtime-credential-key"
      WORKSPACE_DOCKER_SOCKET_PATH: "/var/run/docker.sock"
      WORKSPACE_DOCKER_PRIVATE_NETWORK: "lemma-load-test-net"
      WORKSPACE_DOCKER_ALLOW_MUTABLE_IMAGES: "true"
      WORKSPACE_ADD_HOST_GATEWAY: "false"
      WORKSPACE_IMAGE: ${WORKSPACE_IMAGE:-lemma-workspace:dev}
      FUNCTION_IMAGE: ${FUNCTION_IMAGE:-lemma-function:dev}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - load_test_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

networks:
  load_test_net:
    name: lemma-load-test-net
    driver: bridge
