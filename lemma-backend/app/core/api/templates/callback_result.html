<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  :root {
    --bg: #f7f6f1;
    --card: #fffdf8;
    --border: #e4e0d7;
    --tile-bg: #fffdf8;
    --tile-border: #e8e4dc;
    --ink: #24211d;
    --muted: #6f6a62;
    --faint: #9a948a;
    --accent: #ff8200;
    --danger: #b3402f;
    --btn-bg: #24211d;
    --btn-ink: #fffdf8;
    --shadow: 0 1px 2px rgba(36,33,29,.05), 0 12px 32px rgba(36,33,29,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --card: #201f1c;
      --border: #33312c;
      /* Brand marks are drawn for light backgrounds, so the tile stays light
         even in dark mode; only Lemma's own mark follows the theme. */
      --tile-bg: #f7f6f1;
      --tile-border: #3a3831;
      --ink: #f2efe8;
      --muted: #a49e94;
      --faint: #7c766d;
      --danger: #e4785f;
      --btn-bg: #f2efe8;
      --btn-ink: #201f1c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 32px 28px 26px;
  }
  .lockup { display: flex; align-items: center; margin-bottom: 24px; }
  .tile {
    position: relative;
    width: 44px; height: 44px; border-radius: 11px; flex: none;
    border: 1px solid var(--tile-border);
    background: var(--tile-bg);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .tile--lemma { background: var(--card); }
  /* Sits on top of the monogram; removing it on error uncovers the fallback. */
  .tile img {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 24px; height: 24px; object-fit: contain; background: var(--tile-bg);
  }
  .tile svg { display: block; }
  .monogram { font-size: 13px; font-weight: 500; color: #24211d; letter-spacing: .02em; }
  /* The tile keeps a light background in both themes, so these stay fixed. */
  .glyph { color: #8a847b; }
  .link { flex: none; width: 34px; height: 1px; background: var(--tile-border); position: relative; }
  .link::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: var(--accent);
  }
  .link--broken { background: none; border-top: 1px dashed var(--tile-border); }
  .link--broken::after { background: var(--danger); }
  h1 { margin: 0; font-size: 21px; line-height: 1.3; font-weight: 500; letter-spacing: -.011em; }
  .body { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .body strong { font-weight: 500; color: var(--ink); }
  /* Quiet by default: without an opener we can't know whether Lemma is running
     in the desktop app or a browser tab, and a loud button would push desktop
     users into opening a second copy on the web. */
  .action {
    display: block; margin-top: 22px;
    font: inherit; font-size: 13px; font-weight: 500;
    text-align: center; text-decoration: underline;
    text-underline-offset: 3px; text-decoration-thickness: 1px;
    color: var(--muted); cursor: pointer;
  }
  .action:hover { color: var(--ink); }
  /* Applied once we know an opener exists, so closing this tab reveals whichever
     Lemma opened it — desktop or browser, without guessing. */
  .action--button {
    margin-top: 24px; width: 100%;
    font-size: 14px; text-decoration: none;
    padding: 11px 16px; border-radius: 10px; border: 1px solid transparent;
    background: var(--btn-bg); color: var(--btn-ink);
  }
  .action--button:hover { color: var(--btn-ink); opacity: .9; }
  .micro { margin: 12px 0 0; font-size: 12px; line-height: 1.5; color: var(--faint); text-align: center; }
  .micro[hidden] { display: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="lockup">
      <div class="tile">$icon</div>
      <div class="$link_class"></div>
      <div class="tile tile--lemma">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <rect x="3" y="12" width="3.6" height="7" rx="1.4" fill="currentColor"/>
          <rect x="9.2" y="8" width="3.6" height="11" rx="1.4" fill="currentColor"/>
          <rect x="15.4" y="3" width="3.6" height="16" rx="1.4" fill="currentColor"/>
        </svg>
      </div>
    </div>

    <h1>$title</h1>
    $body

    <a class="action" id="action" href="$action_href">Open Lemma in your browser</a>
    <p class="micro" id="micro">You can close this tab and go back to Lemma.</p>
  </main>

  <script>
    // The connect flow opens this page in a new tab. When an opener is there,
    // closing this tab reveals whichever Lemma opened it — the desktop app or a
    // browser tab — so we never have to guess which one to link to. Without an
    // opener the server-rendered link stands as-is: window.close() is a no-op on
    // tabs a script did not open.
    if (window.opener) {
      var action = document.getElementById('action');
      action.textContent = 'Close this tab';
      action.href = '#';
      action.className = 'action action--button';
      action.addEventListener('click', function (event) {
        event.preventDefault();
        window.close();
      });
      document.getElementById('micro').hidden = true;
    }
  </script>
</body>
</html>
