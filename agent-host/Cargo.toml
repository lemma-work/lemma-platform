[package]
name = "lemma-agent-host"
version = "0.1.0"
description = "Durable local bridge between Lemma and ACP-compatible coding agents"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/lemma-work/lemma-platform"
readme = "README.md"
keywords = ["agents", "acp", "lemma", "codex", "claude"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "lemma_agent_host"
path = "src/lib.rs"

[[bin]]
name = "lemma-agent-host"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "=2.0.0"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "native-tls", "system-proxy"] }
rusqlite = { version = "0.38", features = ["bundled", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
semver = "1"

[dev-dependencies]
assert_cmd = "2"
axum = "0.8"
predicates = "3"
tempfile = "3"
tower = "0.5"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_raw_string_hashes = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
