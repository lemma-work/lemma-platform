<!-- Lemma finding widget v1. Lead with the judgement; the distribution supports it.
     Replace every uppercase placeholder before display. -->
<style>
/* The page supplies the --lemma-widget-* tokens, the --w-* shorthands and
   the shared .w classes (.w-card, .w-state, .w-ask, .w-num, .w-tip). */

  /* ── this view ─────────────────────────────────────────────── */
  .wf__lede { font-size: 26px; line-height: 1.18; }
  .wf__lede b { font-weight: 500; font-family: var(--w-mono); font-variant-numeric: tabular-nums; }
  .wf__sub { margin: 7px 0 0; font-size: 14.5px; color: var(--w-ink-2); }
  /* One ruled bar rather than five cards: a share is a length, and five equal
     boxes say every number matters the same, which is never why you asked. */
  .wf__bar { display: flex; gap: 2px; height: 9px; margin: 21px 0 12px; }
  .wf__bar i { display: block; min-width: 3px; border-radius: 2px; }
  .wf__bar i:first-child { border-radius: 99px 2px 2px 99px; }
  .wf__bar i:last-child { border-radius: 2px 99px 99px 2px; }
  .wf__keys { display: flex; flex-wrap: wrap; gap: 5px 20px; margin: 0; padding: 0; list-style: none; }
  .wf__keys li { display: flex; align-items: baseline; gap: 7px; font-size: 13.5px; color: var(--w-ink-2); }
  .wf__keys s { width: 7px; height: 7px; flex: none; border-radius: 2px; transform: translateY(-1px); }
  .wf__keys em { font: 500 14px/1 var(--w-mono); font-style: normal; font-variant-numeric: tabular-nums; color: var(--w-ink); }
  .wf__note { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--w-line-2); font-size: 14px; color: var(--w-ink-2); }
  .wf__note b { font: 500 13px/1 var(--w-mono); color: var(--w-bad); }
  @media (max-width: 420px) { .wf__lede { font-size: 22px; } }
</style>

<section class="w" data-lemma-widget-version="1">
  <div id="wf-state" class="w-state">Loading…</div>
  <div id="wf-card" class="w-card" hidden>
    <p class="w-kicker">__WIDGET_SCOPE__</p>
    <h2 class="wf__lede"><b id="wf-figure">—</b> <span id="wf-claim">__FOCUS_CLAIM__</span></h2>
    <p id="wf-share" class="wf__sub"></p>
    <div id="wf-bar" class="wf__bar" role="img" aria-labelledby="wf-keys"></div>
    <ul id="wf-keys" class="wf__keys"></ul>
    <p class="wf__note"><b>__FOCUS_DELTA__</b><span>__FOCUS_NOTE__</span></p>
  </div>
</section>

<script>
  (function () {
    var stateEl = document.getElementById("wf-state");
    var cardEl = document.getElementById("wf-card");

    function fail(message) {
      stateEl.hidden = false; stateEl.dataset.kind = "error";
      stateEl.textContent = message || "Unable to load this view."; cardEl.hidden = true;
    }
    // Not an error. The widget is a cross-site iframe and the browser SDK
    // authenticates by cookie, which some browsers and local HTTP setups
    // withhold — the person is usually signed in, so this must not shout.
    function notice(message) {
      stateEl.hidden = false; delete stateEl.dataset.kind;
      stateEl.textContent = message; cardEl.hidden = true;
    }
    function num(value) { return new Intl.NumberFormat().format(Number(value) || 0); }
    function text(el, value) { document.getElementById(el).textContent = value; }

    // Status owns a colour. A view where "done" and "blocked" are the same
    // accent pill has told you nothing it could not have told you in prose.
    // Anything unrecognised falls to the categorical ramp rather than guessing.
    var MEANING = {
      ok: /^(done|closed|resolved|complete|completed|shipped|passed|active|healthy)$/i,
      bad: /^(blocked|failed|error|rejected|cancelled|canceled|overdue|down)$/i,
      warn: /^(waiting|pending|review|in.?review|paused|stalled|at.?risk|queued)$/i,
      info: /^(open|new|todo|to.?do|backlog|draft|in.?progress|running)$/i
    };
    function colour(key, index) {
      for (var name in MEANING) if (MEANING[name].test(String(key))) return "var(--w-" + name + ")";
      return "var(--w-chart-" + ((index % 5) + 1) + ")";
    }

    function render(groups, truncated) {
      if (!groups.length) { notice("No __EMPTY_LABEL__ yet."); return; }

      // Only a complete group list sums to a real total. When the row cap cut
      // the groups short this is a floor, and the line below says so rather
      // than printing a number that is simply false.
      var total = groups.reduce(function (running, row) { return running + (Number(row.group_count) || 0); }, 0);
      var focus = groups.filter(function (row) { return String(row.group_key) === "__FOCUS_VALUE__"; })[0];
      var count = focus ? Number(focus.group_count) || 0 : 0;

      text("wf-figure", num(count));
      document.getElementById("wf-share").textContent =
        (total ? (Math.round((count / total) * 1000) / 10) + "% of " : "") +
        num(total) + " __EMPTY_LABEL__" + (truncated ? " across the groups shown" : "");

      document.getElementById("wf-bar").innerHTML = groups.map(function (row, index) {
        return '<i style="flex:' + (Number(row.group_count) || 0) + ';background:' + colour(row.group_key, index) + '"></i>';
      }).join("");

      document.getElementById("wf-keys").innerHTML = groups.slice(0, 6).map(function (row, index) {
        var label = row.group_key == null ? "Unspecified" : String(row.group_key);
        var safe = document.createElement("span");
        safe.textContent = label;
        return '<li><s style="background:' + colour(row.group_key, index) + '"></s>' +
          '<em>' + num(row.group_count) + "</em>" + safe.innerHTML + "</li>";
      }).join("");

      cardEl.hidden = false; stateEl.hidden = true;
    }

    async function boot() {
      try {
        var client = await lemma.client();
        // Grouped in SQL rather than counted over a page of records:
        // `records.list` serves at most one capped page, so counting what came
        // back would report a slice of the table as if it were the whole of it.
        var response = await client.datastore.query(
          "select __GROUP_FIELD__ as group_key, count(*) as group_count" +
          " from __TABLE_NAME__ group by __GROUP_FIELD__ order by group_count desc"
        );
        render((response && response.items) || [], !!(response && response.truncated));
      } catch (error) {
        fail(error && error.message ? error.message : "Unable to load live pod data.");
      }
    }

    boot();
  })();
</script>
