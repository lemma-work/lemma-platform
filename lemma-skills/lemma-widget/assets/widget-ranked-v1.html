<!-- Lemma ranked widget v1. Magnitude across categories, as horizontal bars:
     the labels read left-to-right instead of being rotated 45° under a column.
     Replace every uppercase placeholder. -->
<style>
/* The page supplies the --lemma-widget-* tokens, the --w-* shorthands and
   the shared .w classes (.w-card, .w-state, .w-ask, .w-num, .w-tip). */

  /* ── this view ─────────────────────────────────────────────── */
  .wk { position: relative; }
  .wk__head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 3px; }
  .wk__head h2 { font-size: 19px; }
  .wk__sub { margin: 0 0 16px; font-size: 13.5px; color: var(--w-ink-2); }
  .wk__rows { display: grid; gap: 9px; }
  .wk__row { display: grid; grid-template-columns: minmax(70px, 22%) 1fr auto; align-items: center; gap: 12px; }
  /* Text never wears the data colour: the bar carries identity, the label is ink. */
  .wk__name { overflow: hidden; font-size: 13.5px; color: var(--w-ink-2); text-overflow: ellipsis; white-space: nowrap; }
  /* Blockified explicitly: a bar is a span, and width and height do not
     apply to an inline box — which renders the whole chart as a list of
     numbers with no bars and no error anywhere. */
  .wk__track { display: block; position: relative; height: 18px; }
  /* Capped thickness, square at the baseline, rounded at the data end — the
     end is where the value is, so it is the end that gets the corner. */
  .wk__bar { display: block; height: 100%; max-height: 18px; border-radius: 0 4px 4px 0; background: var(--w-chart-1); transition: width .25s ease; }
  /* The tail is not a category, so it does not take a categorical hue —
     it takes ink. Giving "Other" slot five says the leftovers are a series. */
  .wk__row[data-rest] .wk__bar { background: var(--w-ink-3); opacity: .38; }
  .wk__value { font: 500 13px/1 var(--w-mono); font-variant-numeric: tabular-nums; color: var(--w-ink); }
  .wk__share { font: 400 11.5px/1 var(--w-mono); color: var(--w-ink-3); }
  .wk__foot { margin: 16px 0 0; padding-top: 13px; border-top: 1px solid var(--w-line-2); font-size: 13px; color: var(--w-ink-3); }
  @media (max-width: 420px) { .wk__row { grid-template-columns: minmax(58px, 34%) 1fr auto; } .wk__share { display: none; } }
</style>

<section class="w wk" data-lemma-widget-version="1">
  <div id="wk-state" class="w-state">Loading…</div>
  <div id="wk-card" class="w-card" hidden>
    <div class="wk__head"><h2>__WIDGET_TITLE__</h2><span id="wk-total" class="wk__share"></span></div>
    <p id="wk-sub" class="wk__sub"></p>
    <div id="wk-rows" class="wk__rows"></div>
    <div id="wk-table" class="w-sr"></div>
    <p id="wk-foot" class="wk__foot" hidden></p>
  </div>
  <div id="wk-tip" class="w-tip"></div>
</section>

<script>
  (function () {
    var TOP = 6;
    var stateEl = document.getElementById("wk-state");
    var cardEl = document.getElementById("wk-card");
    var rowsEl = document.getElementById("wk-rows");
    var tip = document.getElementById("wk-tip");

    function fail(m) { stateEl.hidden = false; stateEl.dataset.kind = "error"; stateEl.textContent = m || "Unable to load."; cardEl.hidden = true; }
    function notice(m) { stateEl.hidden = false; delete stateEl.dataset.kind; stateEl.textContent = m; cardEl.hidden = true; }
    function num(v) { return new Intl.NumberFormat().format(Number(v) || 0); }
    function esc(v) { var n = document.createElement("span"); n.textContent = v == null ? "" : v; return n.innerHTML; }

    function render(groups, truncated) {
      if (!groups.length) { notice("No __EMPTY_LABEL__ yet."); return; }

      var total = groups.reduce(function (a, r) { return a + (Number(r.group_count) || 0); }, 0);
      var shown = groups.slice(0, TOP);
      // A ninth series is never a ninth colour. What does not fit folds into
      // one rest-bar, which keeps the shares honest without inventing hues.
      var rest = groups.slice(TOP).reduce(function (a, r) { return a + (Number(r.group_count) || 0); }, 0);
      if (rest > 0) shown = shown.concat([{ group_key: "Other (" + (groups.length - TOP) + ")", group_count: rest, rest: true }]);
      var top = Math.max.apply(null, shown.map(function (r) { return Number(r.group_count) || 0; }));

      rowsEl.innerHTML = shown.map(function (row) {
        var count = Number(row.group_count) || 0;
        var share = total ? Math.round((count / total) * 1000) / 10 : 0;
        return '<div class="wk__row"' + (row.rest ? " data-rest" : "") + ' data-name="' + esc(row.group_key) + '" data-count="' + count + '" data-share="' + share + '">' +
          '<span class="wk__name">' + esc(row.group_key == null ? "Unspecified" : row.group_key) + "</span>" +
          '<span class="wk__track"><span class="wk__bar" style="width:' + (top ? (count / top) * 100 : 0) + '%"></span></span>' +
          '<span class="wk__value">' + num(count) + ' <span class="wk__share">' + share + "%</span></span></div>";
      }).join("");

      document.getElementById("wk-total").textContent = num(total) + " total";
      document.getElementById("wk-sub").textContent =
        shown.length && !shown[0].rest
          ? shown[0].group_key + " leads with " + Math.round((Number(shown[0].group_count) / total) * 100) + "% of all __EMPTY_LABEL__."
          : num(groups.length) + " groups.";

      document.getElementById("wk-table").innerHTML = "<table><caption>__WIDGET_TITLE__</caption><tbody>" +
        groups.map(function (r) { return "<tr><th scope='row'>" + esc(r.group_key) + "</th><td>" + num(r.group_count) + "</td></tr>"; }).join("") +
        "</tbody></table>";

      if (truncated) {
        var foot = document.getElementById("wk-foot");
        foot.textContent = "The row cap cut this short, so the total is a floor rather than the whole table.";
        foot.hidden = false;
      }

      rowsEl.addEventListener("mousemove", function (event) {
        var row = event.target.closest(".wk__row"); if (!row) { tip.removeAttribute("data-show"); return; }
        var box = rowsEl.getBoundingClientRect();
        tip.innerHTML = esc(row.dataset.name) + " · <b>" + num(row.dataset.count) + "</b> · " + row.dataset.share + "%";
        tip.setAttribute("data-show", "");
        tip.style.left = Math.round(event.clientX - box.left + 12) + "px";
        tip.style.top = Math.round(event.clientY - box.top - 34) + "px";
      });
      rowsEl.addEventListener("mouseleave", function () { tip.removeAttribute("data-show"); });

      cardEl.hidden = false; stateEl.hidden = true;
    }

    async function boot() {
      try {
        var client = await lemma.client();
        var response = await client.datastore.query(
          "select __GROUP_FIELD__ as group_key, count(*) as group_count" +
          " from __TABLE_NAME__ group by __GROUP_FIELD__ order by group_count desc"
        );
        render((response && response.items) || [], !!(response && response.truncated));
      } catch (error) { fail(error && error.message); }
    }

    boot();
  })();
</script>
