<!-- Lemma table widget v1. A table that narrows in place and offers the next
     question. Replace every uppercase placeholder. -->
<style>
/* The page supplies the --lemma-widget-* tokens, the --w-* shorthands and
   the shared .w classes (.w-card, .w-state, .w-ask, .w-num, .w-tip). */

  /* ── this view ─────────────────────────────────────────────── */
  .wt__head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .wt__head h2 { font-size: 19px; }
  .wt__hint { font-size: 13px; color: var(--w-ink-3); white-space: nowrap; }
  .wt__chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .wt__chip { padding: 4px 11px; border: 1px solid var(--w-line-2); border-radius: 999px; background: transparent; color: var(--w-ink-2); font: 400 12.5px/1.2 var(--w-ui); cursor: pointer; }
  .wt__chip[aria-pressed="true"] { background: var(--w-accent-soft); border-color: var(--w-accent-line); color: var(--w-accent); }
  /* Hairlines, not boxes. Twelve bordered pills is twelve things competing to
     be looked at; ruled rows in one card is a table you can read down. */
  .wt__table { width: 100%; margin-top: 15px; border-collapse: collapse; }
  .wt__table th { padding: 0 0 9px; border: 0; font: 400 10.5px/1 var(--w-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--w-ink-3); text-align: left; }
  .wt__table td { padding: 11px 0; border-top: 1px solid var(--w-line-2); vertical-align: baseline; }
  .wt__table th.r, .wt__table td.r { text-align: right; }
  .wt__title { display: block; max-width: 40ch; overflow: hidden; font-size: 14.5px; text-overflow: ellipsis; white-space: nowrap; }
  .wt__sub { display: block; margin-top: 2px; font-size: 12.5px; color: var(--w-ink-3); }
  .wt__age { font: 400 13px/1 var(--w-mono); font-variant-numeric: tabular-nums; color: var(--w-ink-2); }
  .wt__status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--w-ink-2); white-space: nowrap; }
  .wt__status s { width: 6px; height: 6px; flex: none; border-radius: 999px; }
  .wt__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-top: 16px; }
  .wt__count { font-size: 13px; color: var(--w-ink-3); }
  .wt__count b { font: 500 13px/1 var(--w-mono); font-variant-numeric: tabular-nums; color: var(--w-ink-2); }
  @media (max-width: 460px) { .wt__sub, .wt__hint { display: none; } .wt__title { max-width: 22ch; } }
</style>

<section class="w" data-lemma-widget-version="1">
  <header class="wt__head">
    <h2>__WIDGET_TITLE__</h2>
    <span class="wt__hint">oldest first</span>
  </header>
  <div id="wt-chips" class="wt__chips"></div>
  <div id="wt-state" class="w-state" style="margin-top:15px">Loading…</div>
  <table id="wt-table" class="wt__table" hidden>
    <thead><tr><th>__WIDGET_NOUN__</th><th class="r">Age</th><th class="r">__STATUS_FIELD__</th></tr></thead>
    <tbody id="wt-rows"></tbody>
  </table>
  <div class="wt__foot">
    <span id="wt-count" class="wt__count"></span>
    <button id="wt-ask" class="w-ask" hidden></button>
  </div>
</section>

<script>
  (function () {
    var ROWS = 12;
    var stateEl = document.getElementById("wt-state");
    var tableEl = document.getElementById("wt-table");
    var rowsEl = document.getElementById("wt-rows");
    var chipsEl = document.getElementById("wt-chips");
    var countEl = document.getElementById("wt-count");
    var askEl = document.getElementById("wt-ask");
    var client = null;
    var groups = [];
    var active = null;

    function fail(message) {
      stateEl.hidden = false; stateEl.dataset.kind = "error";
      stateEl.textContent = message || "Unable to load."; tableEl.hidden = true;
    }
    // Separate from `fail` for its wording, not its styling: the widget is a
    // cross-site iframe and the browser SDK authenticates by cookie, which some
    // browsers withhold. The person is usually signed in — do not say otherwise.
    function notice(message) {
      stateEl.hidden = false; delete stateEl.dataset.kind;
      stateEl.textContent = message; tableEl.hidden = true;
    }
    function num(value) { return new Intl.NumberFormat().format(Number(value) || 0); }
    function esc(value) { var n = document.createElement("span"); n.textContent = value == null ? "" : value; return n.innerHTML; }
    // A value read out of the data and put back into SQL. Doubling the quote is
    // the whole of it, and leaving it out is how a title with an apostrophe
    // becomes a syntax error in front of the person who asked.
    function sql(value) { return String(value).replace(/'/g, "''"); }

    var MEANING = {
      ok: /^(done|closed|resolved|complete|completed|shipped|passed|active|healthy)$/i,
      bad: /^(blocked|failed|error|rejected|cancelled|canceled|overdue|down)$/i,
      warn: /^(waiting|pending|review|in.?review|paused|stalled|at.?risk|queued)$/i,
      info: /^(open|new|todo|to.?do|backlog|draft|in.?progress|running)$/i
    };
    function colour(key, index) {
      for (var name in MEANING) if (MEANING[name].test(String(key))) return "var(--w-" + name + ")";
      return "var(--w-chart-" + ((index % 5) + 1) + ")";
    }

    // A figure with no direction is trivia. Days are what a person actually
    // compares, so the raw timestamp never reaches the column.
    function age(value) {
      var when = value ? new Date(value) : null;
      if (!when || isNaN(when.getTime())) return "";
      var days = Math.floor((Date.now() - when.getTime()) / 86400000);
      if (days < 1) return "today";
      if (days < 365) return days + "d";
      return Math.floor(days / 365) + "y";
    }

    function total() {
      return groups.reduce(function (running, row) { return running + (Number(row.group_count) || 0); }, 0);
    }

    function drawChips() {
      chipsEl.innerHTML = "";
      [{ group_key: null, group_count: total() }].concat(groups).forEach(function (row, index) {
        var chip = document.createElement("button");
        chip.className = "wt__chip";
        chip.type = "button";
        chip.setAttribute("aria-pressed", String(row.group_key === active));
        chip.textContent = (row.group_key == null ? "All" : String(row.group_key)) + "  " + num(row.group_count);
        chip.onclick = function () { active = row.group_key; drawChips(); load(); };
        chipsEl.appendChild(chip);
        if (index === 0) chip.style.order = "-1";
      });
    }

    function drawRows(rows, matched) {
      if (!rows.length) { notice("Nothing here" + (active ? " in " + active + "." : " yet.")); countEl.textContent = ""; return; }
      rowsEl.innerHTML = rows.map(function (row, index) {
        var status = row.__STATUS_FIELD__;
        return "<tr><td><span class='wt__title'>" + esc(row.__TITLE_FIELD__ || "Untitled") + "</span>" +
          "<span class='wt__sub'>" + esc(row.__SUBTITLE_FIELD__) + "</span></td>" +
          "<td class='r'><span class='wt__age'>" + esc(age(row.__DATE_FIELD__)) + "</span></td>" +
          "<td class='r'><span class='wt__status'><s style='background:" + colour(status, index) + "'></s>" +
          esc(status) + "</span></td></tr>";
      }).join("");
      tableEl.hidden = false; stateEl.hidden = true;

      // `datastore.query`'s `total` counts rows RETURNED, not rows matched, so
      // the honest denominator is the group count — which came from a COUNT(*)
      // over the whole table — and never the length of this page.
      countEl.innerHTML = "Showing <b>" + num(rows.length) + "</b> of <b>" + num(matched) + "</b>" +
        (active ? " " + esc(active) : "") + " · <b>" + num(total()) + "</b> in the table";
    }

    function offer() {
      // Checked before the button is drawn, not inside it: an app opened from a
      // share link has no conversation anywhere near it, and a button that
      // quietly does nothing is worse than one that was never there.
      lemma.canCompose().then(function (ok) {
        if (!ok) return;
        askEl.textContent = "__COMPOSE_LABEL__";
        askEl.hidden = false;
        // Written as the person's own words, because it lands in their composer
        // for them to send, edit or ignore — it is never sent from here.
        askEl.onclick = function () { lemma.compose("__COMPOSE_TEXT__"); };
      });
    }

    async function load() {
      try {
        var where = active == null ? "" : " where __STATUS_FIELD__ = '" + sql(active) + "'";
        var response = await client.datastore.query(
          "select __TITLE_FIELD__, __SUBTITLE_FIELD__, __STATUS_FIELD__, __DATE_FIELD__" +
          " from __TABLE_NAME__" + where +
          " order by __DATE_FIELD__ asc limit " + ROWS
        );
        var matched = active == null
          ? total()
          : (groups.filter(function (row) { return String(row.group_key) === String(active); })[0] || {}).group_count || 0;
        drawRows((response && response.items) || [], matched);
      } catch (error) { fail(error && error.message); }
    }

    async function boot() {
      try {
        client = await lemma.client();
          notice("This view can't load pod data in this browser."); return;
        }
        var counts = await client.datastore.query(
          "select __STATUS_FIELD__ as group_key, count(*) as group_count" +
          " from __TABLE_NAME__ group by __STATUS_FIELD__ order by group_count desc"
        );
        groups = (counts && counts.items) || [];
        active = "__DEFAULT_FILTER__" || null;
        drawChips();
        offer();
        await load();
      } catch (error) { fail(error && error.message); }
    }

    boot();
  })();
</script>
