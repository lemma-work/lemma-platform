<!--
widget: gmail/email-thread
description: One Gmail thread with the newest message open, a reply you can edit and send, and archive, star and mark-read.
connector: gmail
kind: http
operations: send_message, threads_modify
data: { thread_id, subject, labels?, reply_to?, draft?, messages: [{ from: { name, email }, to?, date, text, message_id? }] }
version: 1
-->
<div id="mail"></div>
<script type="application/json" data-lemma-sample>
{
  "thread_id": "18f2a6c1d9e0b7a4",
  "subject": "Pilot pricing for the Q4 rollout",
  "labels": ["INBOX", "UNREAD"],
  "draft": "Hi Priya,\n\nThanks, that works. The 40-seat pilot at $29 a seat, starting Monday 14 October. I'll send the order form over today.\n\nBest,\nSam",
  "messages": [
    { "from": { "name": "Sam Rivera", "email": "sam@northwind.io" }, "date": "2026-09-29T09:12:00Z", "text": "Hi Priya, could you share pilot pricing for about 40 seats? We'd like to start in October." },
    { "from": { "name": "Priya Nair", "email": "priya@contoso.com" }, "to": ["sam@northwind.io"], "date": "2026-10-01T16:40:00Z", "message_id": "<CAF1x2@mail.contoso.com>", "text": "Hi Sam,\n\nFor a 40-seat pilot we can do $29 a seat for the first three months, then the standard rate. We can start any Monday in October.\n\nPriya" }
  ]
}
</script>
<script>
(function () {
  var d = lemma.data, el = document.getElementById("mail"), e = lemma.esc;
  if (!d || !d.messages || !d.messages.length) { el.innerHTML = '<p class="lw-quiet">No thread to show.</p>'; return; }
  var msgs = d.messages, last = msgs[msgs.length - 1], labels = d.labels || [];
  var who = function (p) { return p ? (p.name || p.email) : "Unknown"; };
  var to = d.reply_to || (last.from && last.from.email);
  var unread = labels.indexOf("UNREAD") >= 0;

  var earlier = msgs.slice(0, -1).map(function (m, i) {
    return '<button class="lw-item" type="button" data-open="' + i + '">' + lemma.avatar(who(m.from), "s") +
      '<span class="lw-grow">' + e(who(m.from)) + ' <span class="lw-quiet">— ' + e((m.text || "").replace(/\s+/g, " ")) + "</span></span>" +
      '<span class="lw-end">' + lemma.when(m.date, { ago: true }) + "</span></button>" +
      '<div class="lw-sec" hidden data-full="' + i + '"><div class="lw-body">' + e(m.text || "") + "</div></div>";
  }).join("");

  el.innerHTML =
    '<div class="lw-card">' +
      '<div class="lw-sec" data-say>' +
        '<div class="lw-top">' + lemma.icon("mail") + "<span>Gmail</span><span>·</span><span>" + msgs.length + (msgs.length === 1 ? " message" : " messages") + "</span>" +
          (unread ? '<span class="lw-pill" data-kind="accent"><span class="lw-led"></span>Unread</span>' : "") +
          '<span class="lw-spacer"></span><span class="lw-bar">' +
            '<button class="lw-btn" data-icon id="archive" title="Archive" aria-label="Archive">' + lemma.icon("archive") + "</button>" +
            '<button class="lw-btn" data-icon id="star" title="Star" aria-label="Star">' + lemma.icon("star") + "</button>" +
            (unread ? '<button class="lw-btn" data-icon id="read" title="Mark as read" aria-label="Mark as read">' + lemma.icon("read") + "</button>" : "") +
          "</span></div>" +
        '<h2 class="lw-title">' + e(d.subject || "(no subject)") + "</h2>" +
      "</div>" +
      (earlier ? '<div class="lw-rows">' + earlier + "</div>" : "") +
      '<div class="lw-sec">' +
        '<div class="lw-bar" style="gap:10px;flex-wrap:nowrap">' + lemma.avatar(who(last.from), "l") +
          '<div style="min-width:0;flex:1"><div>' + e(who(last.from)) + '</div><div class="lw-quiet" style="font-size:12.5px">' +
          e((last.from && last.from.email) || "") + (last.to && last.to.length ? " · to " + e(last.to.join(", ")) : "") + "</div></div>" +
          '<span class="lw-quiet" style="font-size:12px;white-space:nowrap">' + lemma.when(last.date) + "</span></div>" +
        '<div class="lw-body" style="margin-top:14px">' + e(last.text || "") + "</div>" +
      "</div>" +
      '<div class="lw-sec">' +
        '<div class="lw-compose"><div class="lw-to">' + lemma.icon("reply") + "<span>Reply to " + e(who(last.from)) + "</span></div>" +
          '<textarea id="reply" rows="4" placeholder="Write a reply"></textarea>' +
          '<div class="lw-bar"><span class="lw-quiet" style="font-size:12px;padding-left:6px">Sends from your Gmail</span><span class="lw-spacer"></span>' +
            '<button class="lw-btn" data-tone="primary" id="send">' + lemma.icon("send") + '<span>Send</span><span class="lw-kbd">⌘↵</span></button></div>' +
        "</div>" +
      "</div>" +
    "</div>";

  el.querySelectorAll("[data-open]").forEach(function (row) {
    row.addEventListener("click", function () {
      var full = el.querySelector('[data-full="' + row.dataset.open + '"]');
      full.hidden = !full.hidden;
    });
  });

  var reply = document.getElementById("reply");
  reply.value = d.draft || "";
  reply.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) { event.preventDefault(); document.getElementById("send").click(); }
  });
  var subject = /^re:/i.test(d.subject || "") ? d.subject : "Re: " + (d.subject || "");
  var modify = function (body) { return lemma.act("gmail", "threads_modify", { id: d.thread_id, userId: "me", body: body }, { kind: "http" }); };

  lemma.button("send", {
    does: "send this reply to " + to,
    confirm: function () { return reply.value.trim() ? "Send to " + to + "?" : ""; },
    yes: "Send now",
    run: function () {
      if (!reply.value.trim()) throw new Error("Write the reply first.");
      var payload = { to: to, subject: subject, text: reply.value, thread_id: d.thread_id, userId: "me" };
      if (last.message_id) payload.in_reply_to = last.message_id;
      return lemma.act("gmail", "send_message", payload, { kind: "http" });
    },
    done: "Sent to " + to + "."
  });
  lemma.button("archive", { does: "archive the thread", run: function () { return modify({ removeLabelIds: ["INBOX"] }); }, done: "Archived." });
  lemma.button("star", { does: "star the thread", run: function () { return modify({ addLabelIds: ["STARRED"] }); }, done: function () { document.getElementById("star").dataset.on = ""; return "Starred."; } });
  if (unread) lemma.button("read", { does: "mark the thread read", run: function () { return modify({ removeLabelIds: ["UNREAD"] }); }, done: "Marked as read." });
})();
</script>
