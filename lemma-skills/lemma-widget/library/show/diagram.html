<!--
widget: show/diagram
description: A Mermaid diagram -- flowchart, sequence, timeline, mindmap, gantt, state, class or ER -- with a title and a caption, themed to the page.
connector: none
kind: view
operations: none
data: { title?, caption?, mermaid }
version: 1
-->
<script type="application/json" data-lemma-sample>
{
  "title": "Offsite plan",
  "caption": "From shortlist to booking",
  "mermaid": "flowchart LR\n  A[Shortlist venues] --> B{Within budget?}\n  B -- yes --> C[Hold dates]\n  B -- no --> A\n  C --> D[Book travel]"
}
</script>
<style>
  .sd__title { margin: 0; font-size: 19px; line-height: 1.25; }
  .sd__caption { margin: 4px 0 0; font-size: 13.5px; color: var(--w-ink-2, #555); }
  .sd__body { margin-top: 12px; }
  .sd__body svg { max-width: 100%; height: auto; }
</style>
<section class="w" data-lemma-widget-version="1">
  <div class="w-card">
    <h2 class="sd__title" id="sd-title"></h2>
    <p class="sd__caption" id="sd-caption" hidden></p>
    <div class="sd__body" id="sd-body"></div>
  </div>
</section>
<script type="module">
  const d = lemma.data || {};
  document.getElementById("sd-title").textContent = d.title || "";
  if (d.caption) Object.assign(document.getElementById("sd-caption"), { textContent: d.caption, hidden: false });
  const ink = getComputedStyle(document.documentElement).getPropertyValue("--w-ink").trim().replace("#", "");
  const dark = /^[0-9a-f]{6}$/i.test(ink) && parseInt(ink.slice(0, 2), 16) > 160;
  try {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs");
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral", securityLevel: "strict", fontFamily: "inherit" });
    await mermaid.parse(d.mermaid || "");
    const { svg } = await mermaid.render("sd-diagram", d.mermaid || "");
    document.getElementById("sd-body").innerHTML = svg;
  } catch (error) {
    lemma.fail((error && (error.message || error.str)) || "The diagram could not be drawn.", "sd-body");
  }
</script>
