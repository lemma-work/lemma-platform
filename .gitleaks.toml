title = "lemma-platform gitleaks config"

# Keep the full default detection ruleset; this file only adds a repo-specific
# allowlist entry on top of it.
[extend]
useDefault = true

[[allowlists]]
description = '''
GitHub's own official REST API OpenAPI description (fetched on demand by
lemma-backend/scripts/generate_github_static_operations.py, no longer
committed -- see lemma-backend/.gitignore) was briefly committed and is still
present in this branch's git history. It is a vendor doc full of
realistic-looking example secret values (fake access_token/client_secret/
webhook_secret strings used purely to illustrate schema shape), not real
leaked credentials. Path-allowlisted rather than purged from history.
'''
paths = [
  '''lemma-backend/lemma-connectors/openapi_specs/github\.json''',
]

[[allowlists]]
description = '''
Svix's own published signature-verification vector, which Resend's inbound
webhook signing is built on. The secret, message id, timestamp, payload and
expected signature are all printed in Svix's public documentation; the pair
below is that vector and a one-character mutation of it used as the negative
control, so a verifier that accepts everything fails the test.

Allowlisted by exact value rather than by path: any other high-entropy string
in the same test file is still a finding, and this vector is public knowledge
in every repository that verifies a Svix-signed webhook.
'''
regexes = [
  '''whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaS[wx]''',
]

[[allowlists]]
description = '''
A fabricated Resend signing secret the scenario stack was booted with. It was
never a credential -- the string decodes to "scenarios-resend-signing-secret"
and no Resend account has ever held it -- but it was written as a literal, which
is indistinguishable from the real thing to a reader and to this scanner. The
literal is gone: `harness/stack.py` now builds the value, so nothing shaped like
a credential is committed.

Allowlisted because the commit that introduced it is still in this branch's
history and gitleaks scans commits, not the working tree. Exact value, in the
style of the Svix entry above, so any other high-entropy string in that file is
still a finding.
'''
regexes = [
  '''whsec_c2NlbmFyaW9zLXJlc2VuZC1zaWduaW5nLXNlY3JldA==''',
]

[[allowlists]]
description = '''
A fabricated Resend signing secret in the surfaces e2e test. It decodes to
"resend-e2e-signing-secret" and no Resend account has ever held it; the test
needs a value of production shape so the verifier under test is exercised
rather than short-circuited.

By exact value, in the style of the two entries above, so any other
high-entropy string in that file is still a finding.
'''
regexes = [
  '''whsec_cmVzZW5kLWUyZS1zaWduaW5nLXNlY3JldA==''',
]

[[allowlists]]
description = '''
The fabricated Figma file key used throughout the figma connector skill's
worked examples. `file_key` is a public identifier -- it appears in the URL of
every Figma file -- and this particular one is invented, but eighteen mixed-case
alphanumerics next to a quoted key is exactly what `generic-api-key` is built to
notice.

By exact value rather than by path: the skill files describe credential-bearing
operations, and a real token pasted into one of them must still be caught.
'''
regexes = [
  '''D2e3F4g5H6i7J8k9L0''',
]

[[allowlists]]
description = '''
Atlassian's own API documentation, copied verbatim into the docstrings of the
generated Jira client. Every Jira attachment operation carries the same worked
example, `curl ... -u 'email@example.com:<api_token>'`, and `<api_token>` is the
literal placeholder Atlassian prints -- there is no credential here, only the
word for one.

Matched on the placeholder pair, so a real token substituted into the same
docstring shape is still a finding.
'''
regexes = [
  '''email@example\.com:<api_token>''',
]

[[rules]]
id = "minisign-secret-key"
description = '''
A minisign secret key, which is what signs desktop updates.

The public half is committed on purpose -- it is in `desktop/tauri.conf.json`
and is compiled into every shipped app. The private half must never be: anyone
holding it can produce an update that every installed Lemma accepts and
installs, which is arbitrary code execution on every user's machine under our
own signature.

Matched on the header the format always carries, in both plain and base64 form,
because the file is handled base64-encoded in CI.
'''
regex = '''untrusted comment: (minisign encrypted secret key|rsign encrypted secret key)'''
keywords = ["untrusted comment"]

[[rules]]
id = "minisign-secret-key-base64"
description = '''
The same key, base64-encoded, which is the shape CI passes it in.

Two things about this pattern are deliberate.

`{1}` breaks the literal without changing what it matches. Spelled out in full,
this file would match its own rule -- gitleaks scans every file, including this
one -- and a scanner whose first finding is its own configuration is a scanner
people learn to ignore.

It matches only the `rsign` header, which is what `tauri signer generate`
produces and therefore the only secret key CI ever handles. The `minisign`
header cannot be matched this way: base64 of "untrusted comment: minisign " is a
prefix of the *public* key too, which is committed on purpose in
`desktop/tauri.conf.json`. Matching it would flag that on every scan. The
plaintext rule above still covers a minisign-format secret key.
'''
regex = '''dW50cnVzdGVkIGNvbW1lbnQ6IHJ{1}zaWduIG'''
keywords = ["dW50cnVzdGVkIGNvbW1lbnQ6"]

[[allowlists]]
description = '''
Slack's own published example signing secret, from the worked example in their
"Verifying requests from Slack" documentation. It was briefly used as the key in
`test_webhook_signatures.py` -- where the value is arbitrary, because that test
compares two implementations against each other -- and is no longer in the tree:
it now reads `a-slack-signing-secret`, which no scanner or person will mistake
for a credential.

It survives only in this branch's history, and gitleaks scans the commits a pull
request introduces rather than its result, so removing it from the tree does not
clear the finding. Allowlisted by exact value rather than by path, so the entry
cannot quietly cover a real secret in the same file. `main` is squash-merged, so
the value never reaches its history at all.
'''
regexes = [
  '''8f742231b10e8888abcd99yyyzzz85a5''',
]
