title = "lemma-platform gitleaks config"

# Keep the full default detection ruleset; this file only adds a repo-specific
# allowlist entry on top of it.
[extend]
useDefault = true

[[allowlists]]
description = '''
GitHub's own official REST API OpenAPI description (fetched on demand by
lemma-backend/scripts/generate_github_static_operations.py, no longer
committed -- see lemma-backend/.gitignore) was briefly committed and is still
present in this branch's git history. It is a vendor doc full of
realistic-looking example secret values (fake access_token/client_secret/
webhook_secret strings used purely to illustrate schema shape), not real
leaked credentials. Path-allowlisted rather than purged from history.
'''
paths = [
  '''lemma-backend/lemma-connectors/openapi_specs/github\.json''',
]

[[allowlists]]
description = '''
Svix's own published signature-verification vector, which Resend's inbound
webhook signing is built on. The secret, message id, timestamp, payload and
expected signature are all printed in Svix's public documentation; the pair
below is that vector and a one-character mutation of it used as the negative
control, so a verifier that accepts everything fails the test.

Allowlisted by exact value rather than by path: any other high-entropy string
in the same test file is still a finding, and this vector is public knowledge
in every repository that verifies a Svix-signed webhook.
'''
regexes = [
  '''whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaS[wx]''',
]

[[allowlists]]
description = '''
A fabricated Resend signing secret the scenario stack was booted with. It was
never a credential -- the string decodes to "scenarios-resend-signing-secret"
and no Resend account has ever held it -- but it was written as a literal, which
is indistinguishable from the real thing to a reader and to this scanner. The
literal is gone: `harness/stack.py` now builds the value, so nothing shaped like
a credential is committed.

Allowlisted because the commit that introduced it is still in this branch's
history and gitleaks scans commits, not the working tree. Exact value, in the
style of the Svix entry above, so any other high-entropy string in that file is
still a finding.
'''
regexes = [
  '''whsec_c2NlbmFyaW9zLXJlc2VuZC1zaWduaW5nLXNlY3JldA==''',
]
