services:
  db:
    image: docker.io/pgvector/pgvector:0.8.3-pg18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "127.0.0.1::5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -h localhost"]
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  supertokens:
    image: docker.io/supertokens/supertokens-postgresql:11.4.5
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://test:test@db:5432/supertokens
    ports:
      - "127.0.0.1::3567"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e \"GET /hello HTTP/1.1\\r\\nhost: 127.0.0.1:3567\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep Hello'"]
      interval: 3s
      timeout: 5s
      retries: 40
