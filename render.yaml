# Deploy Lemma on Render.
#
# Render reads this file from the repository root — it cannot live under
# deploy/, which is why it is here. See deploy/README.md for what this costs and
# what it cannot do.
#
# READ THIS FIRST: Render gives a container no Docker socket, so Lemma cannot
# provision agent sandboxes on the platform itself. Agents, functions and
# workflows are all sandbox work, so a Render deployment needs E2B — set
# E2B_API_KEY in the dashboard after the first deploy. Without it the product
# runs but its agents cannot.
#
# A VM with the compose stack (deploy/cloud-init/lemma.yaml) needs no E2B
# account and no per-service billing. Prefer it unless you specifically want a
# managed platform.

previewsEnabled: false

# The API and the worker must agree on these, and a YAML anchor cannot make them:
# `generateValue: true` is evaluated per service, so an anchor shared between two
# services produces two different keys. SECRET_ENCRYPTION_KEY decides whether the
# worker can read what the API encrypted, and WORKSPACE_RUNTIME_CREDENTIAL_KEY
# decides whether a sandbox token minted by one is accepted by the other — so two
# values means a deployment that looks healthy and fails at the first connector
# credential and the first sandbox. An environment group is generated once and
# injected into both.
envVarGroups:
  - name: lemma-secrets
    envVars:
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: WORKSPACE_RUNTIME_CREDENTIAL_KEY
        generateValue: true

databases:
  # Two Postgres instances, because Lemma keeps pod data in its own database
  # rather than another schema of the platform one. SuperTokens shares the
  # first, in its own schema.
  - name: lemma-postgres
    databaseName: lemma
    user: lemma
    plan: basic-256mb
    postgresMajorVersion: "17"

  - name: lemma-datastore
    databaseName: lemma_datastore
    user: lemma
    plan: basic-256mb
    postgresMajorVersion: "17"

# Pinned to a release, not `latest`: a restart that silently pulls a different
# image can leave the API, the worker and the migration job on three different
# builds of Lemma. Bump these together when you upgrade, and check the release
# notes first. The current releases are listed at
# https://github.com/lemma-work/lemma-platform/releases
services:
  - type: keyvalue
    name: lemma-redis
    plan: starter
    ipAllowList: []

  # SuperTokens: private, reachable only from the other services here.
  - type: pserv
    name: lemma-supertokens
    runtime: image
    plan: starter
    image:
      url: docker.io/supertokens/supertokens-postgresql:11.4.5
    envVars:
      - key: POSTGRESQL_CONNECTION_URI
        fromDatabase: {name: lemma-postgres, property: connectionString}
      - key: POSTGRESQL_TABLE_SCHEMA
        value: supertokens

  - type: web
    name: lemma-api
    runtime: image
    plan: standard
    image:
      url: ghcr.io/lemma-work/lemma-backend:v0.7.2
    healthCheckPath: /health/ready
    # Migrations before the new instance serves. On compose this is a separate
    # one-shot container so a failure stops the deploy; Render's equivalent is
    # this hook, which fails the deploy the same way.
    preDeployCommand: alembic upgrade head
    envVars: &backend_env
      - fromGroup: lemma-secrets
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LEMMA_RELEASE_SHA
        sync: false
      - key: DATABASE_URL
        fromDatabase: {name: lemma-postgres, property: connectionString}
      - key: DATASTORE_DATABASE_URL
        fromDatabase: {name: lemma-datastore, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: lemma-redis, property: connectionString}
      # A literal, not `fromService: {property: hostport}` — that yields
      # `host:port` with no scheme, and it is passed straight to
      # SupertokensConfig(connection_uri=...), which cannot connect without one.
      # Render has no string interpolation in this file, so the scheme is written
      # here. Private services are reachable at their own name on their port.
      - key: SUPERTOKENS_CORE_URL
        value: http://lemma-supertokens:3567
      # Sandboxes are rented: there is no Docker socket here to run them on.
      - key: WORKSPACE_PROVIDER
        value: e2b
      - key: E2B_API_KEY
        sync: false
      # Must be unique to this deployment. Two deployments sharing an E2B
      # account and a namespace each destroy the other's live sandboxes.
      - key: E2B_METADATA_NAMESPACE
        sync: false
      # Set these to your Render URLs after the first deploy — Render assigns
      # the hostnames, and Lemma never infers its own.
      - key: API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AUTH_FRONTEND_URL
        sync: false
      # Pod apps are served at <slug>.<APP_BASE_DOMAIN> and need a wildcard
      # custom domain on this service. Render's assigned onrender.com hostname
      # cannot carry one, so pod apps need a domain you own.
      - key: APP_BASE_DOMAIN
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: LEMMA_DEFAULT_MODEL_TYPE
        value: openai_compat
      - key: LEMMA_OPENAI_API_KEY
        sync: false
      - key: LEMMA_OPENAI_DEFAULT_MODEL
        sync: false

  - type: worker
    name: lemma-worker
    runtime: image
    plan: standard
    image:
      url: ghcr.io/lemma-work/lemma-backend:v0.7.2
    dockerCommand: python -m app.worker
    envVars: *backend_env

  - type: web
    name: lemma-frontend
    runtime: image
    plan: starter
    image:
      url: ghcr.io/lemma-work/lemma-frontend:v0.7.2
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SESSION_TOKEN_DOMAIN
        sync: false
