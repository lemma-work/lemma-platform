net.ipv4.ip_forward=1
# Frames switched between two sandboxes on nerdctl0 pass through iptables, so
# guestd's rule refusing sandbox-to-sandbox connections applies to them
# (sandbox_firewall.rs). br_netfilter is loaded by modules-load.d first;
# guestd also sets these, because WSL reads neither file.
net.bridge.bridge-nf-call-iptables=1
net.bridge.bridge-nf-call-ip6tables=1
# Nothing in this guest uses IPv6, and a link-local address on the sandbox
# bridge is a route around every IPv4 rule. guestd's ip6tables rules drop IPv6
# from the bridge on every platform; this takes the addresses away as well on
# the VZ guest, which -- unlike WSL -- has this kernel to itself.
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1
