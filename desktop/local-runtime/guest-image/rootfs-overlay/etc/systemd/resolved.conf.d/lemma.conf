# The guest's name servers, in the order they matter.
#
# First, the host DNS relay: guestd's `host_dns` on 127.0.0.2, which hands
# each query to the Mac's own resolver over vsock. It resolves whatever the Mac
# resolves, split DNS and local DNS proxies (Cloudflare WARP, Tailscale,
# Zscaler, corporate VPNs) included.
#
# Second, the vmnet gateway, which DHCP still supplies on the link
# (20-lemma.network). resolved asks both and takes the first good answer, so
# when the relay is missing, slow or answers SERVFAIL, the guest resolves
# exactly as it did before the relay existed.
#
# No public resolver, here or as a fallback: one would bypass the split DNS
# and the DNS policy the relay exists to respect.
#
# Inert on WSL: systemd does not run there, and Windows writes resolv.conf.
[Resolve]
DNS=127.0.0.2
FallbackDNS=
