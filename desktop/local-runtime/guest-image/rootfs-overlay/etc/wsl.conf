[boot]
systemd=false

[automount]
# WSL reads /etc/fstab on every start, and the first line there is a virtiofs
# share that only the VZ guest has. It cannot mount, so WSL printed
# "Processing /etc/fstab with mount -a failed." on the tail of every single
# wsl.exe invocation -- including into logs/wsl.log, which on Windows is one of
# the only diagnostics there is.
#
# The other line, the tmpfs for /tmp, is mounted by lemma-runtime-init instead:
# that is the WSL entry point, and WSL has no systemd to do it.
mountFsTab = false

[network]
generateHosts=true
generateResolvConf=true

[user]
default=root
