# The agent module against a real model.
#
# `workflow_dispatch` only -- no schedule, and above all no `pull_request`. The
# repository is public, so a fork must never be able to reach the credential
# this reads; that is the same reason `scenarios-live.yml` gives, and it is the
# constraint that decides the trigger.
#
# It exists because until now the `real_llm` tests ran in no lane at all. The PR
# lane uses the deterministic model, and the weekly protected lane sets
# E2E_REAL=1 together with E2E_LLM_MODE=mock -- which conftest reads first, so
# they skipped there too.
#
# The results deliberately do NOT feed `e2e-union.json`. A coverage floor has to
# be reproducible from a pull request, and a number that moved because somebody
# spent money on a manual run is not.
name: Backend real-LLM E2E

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Model to run against (blank uses the deployment default)"
        required: false
        type: string
      selection:
        description: "pytest -k selection (blank runs the whole agent module)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  real-llm:
    name: Agent module, real model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Reused rather than newly created, so the credential lives in exactly one
    # place and one approval list governs every job that can read it.
    environment: backend-protected-e2e
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Run the agent suite against the real model
        run: >-
          uv run pytest
          -m "e2e and not slow and not workspace and not local_cli and not indexing"
          app/modules/agent
          ${{ inputs.selection && format('-k "{0}"', inputs.selection) || '' }}
          --junitxml=real-llm-e2e.xml
          -o timeout=300
        env:
          E2E_LLM_MODE: "real"
          LEMMA_OPENAI_API_KEY: ${{ secrets.LEMMA_OPENAI_API_KEY }}
          LEMMA_OPENAI_BASE_URL: ${{ secrets.LEMMA_OPENAI_BASE_URL }}
          LEMMA_DEFAULT_MODEL: ${{ inputs.model_name }}
      - name: Publish commit-linked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-real-llm-e2e-${{ github.sha }}
          path: lemma-backend/real-llm-e2e.xml
          if-no-files-found: error
          retention-days: 14
