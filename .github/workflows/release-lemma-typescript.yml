name: Release Lemma TypeScript SDK

on:
  # The tag, not the release. A release created by a workflow runs as the
  # default GITHUB_TOKEN, and GitHub will not start a new workflow run from an
  # event that token raised -- so `release: published` fires only when a person
  # cuts the release by hand. v0.7.1 was cut by a person and this ran; v0.7.2
  # was cut by release-local-images.yml and this never ran at all, which is why
  # npm sat a release behind for ten days with nothing saying so.
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 1.2.3 or v1.2.3"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: release-lemma-typescript-${{ github.event.release.tag_name || inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lemma-typescript

    steps:
      # Build the tag, not whatever the default branch happens to be. Without a
      # ref a workflow_dispatch checks out main and the version input only
      # rewrites the version string, so a dispatch run after an unrelated merge
      # would publish a different tree under this release's name -- and a
      # package version cannot be re-cut once it is on an index.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.version || github.ref }}

      # The same two steps open every package release (see docs/versioning.md,
      # "Publishing"): name the version, and stop here -- successfully -- when
      # the registry already has it, so re-running a release is a no-op rather
      # than a failure or a second upload.
      - name: Resolve the release version
        id: release
        working-directory: .
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
        run: python3 scripts/release_registry.py version "$RELEASE_VERSION"

      - name: Check whether lemma-sdk is already on npm
        id: registry
        working-directory: .
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/release_registry.py published npm lemma-sdk "$VERSION"

      # The protected backend suite is not a gate on this artifact. It exercises
      # the real Docker runtime, the document processors and the Rust agent
      # host; none of the three is in the package published here, and the job
      # already builds and tests exactly what it uploads. The desktop release
      # keeps the gate, which is what it was written for.

      - name: Setup Node.js
        if: steps.registry.outputs.published == 'false'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: lemma-typescript/package-lock.json

      - name: Use npm with trusted publishing support
        if: steps.registry.outputs.published == 'false'
        run: npm install --global npm@11.18.0

      # The run that publishes the package is the run that checks it. CI's path
      # filter skips "TypeScript SDK checks" whenever the release commit did not
      # touch lemma-typescript -- a backend-only release commit is the common
      # case -- and CI is green anyway, because "CI passed" treats a skipped
      # suite as passing. Before `npm version` below: the SDK_VERSION check and
      # the committed-bundle diff read the tree as committed.
      - name: Verify TypeScript SDK
        if: steps.registry.outputs.published == 'false'
        uses: ./.github/actions/verify-typescript-sdk

      # See the note in release-lemma-python.yml: consistency is enforced at
      # release time, in one place, instead of per-PR version bumps. It covers
      # every component, where the src/version.ts check below sees only this one
      # — that check stays as the last word before `npm version` rewrites
      # package.json out from under it.
      - name: Check version consistency across components
        if: steps.registry.outputs.published == 'false'
        working-directory: .
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/check_version_consistency.py --expect "$VERSION"

      - name: Set package version from release tag
        if: steps.registry.outputs.published == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

          source_version="$(node -e 'const fs=require("fs"); const m=fs.readFileSync("src/version.ts","utf8").match(/SDK_VERSION = "([^"]+)"/); if (!m) process.exit(1); process.stdout.write(m[1])')"
          if [[ "${source_version}" != "${VERSION}" ]]; then
            echo "src/version.ts SDK_VERSION (${source_version}) must match release version ${VERSION}. Commit the release version before publishing." >&2
            exit 1
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published == 'false'
        run: npm ci

      - name: Build package
        if: steps.registry.outputs.published == 'false'
        run: npm run build

      # Unit tests ran in "Verify TypeScript SDK" above, against the same
      # sources -- vitest runs src, not dist, and `npm version` touches nothing
      # it reads.
      - name: Verify registry blocks
        if: steps.registry.outputs.published == 'false'
        run: npm run registry:check

      - name: Pack package
        if: steps.registry.outputs.published == 'false'
        run: npm pack --dry-run

      - name: Publish package
        if: steps.registry.outputs.published == 'false'
        run: npm publish

      # A publish that returned 0 is not a version anybody can install until the
      # registry serves it. Fail here, on this run, rather than leave the release
      # tracker to discover it.
      - name: Confirm lemma-sdk is installable from npm
        if: steps.registry.outputs.published == 'false'
        working-directory: .
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/release_registry.py wait npm lemma-sdk "$VERSION" --timeout-seconds 600
