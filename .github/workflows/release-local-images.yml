name: Release Local Stack Images

# Builds the backend, frontend, and the workspace/function sandbox images. It
# also assembles the native host packs and private guest runtimes consumed by
# Lemma Desktop. Published runs
# attach them to the GitHub release; branch-test runs retain them in Actions.
# lemma-stack resolves:
#   stable  -> releases/latest/download/lemma-local.json
#   <X.Y.Z> -> releases/download/v<X.Y.Z>/lemma-local.json
#
# Multi-arch is built on NATIVE runners (amd64 on ubuntu-latest, arm64 on
# ubuntu-24.04-arm) and merged into a manifest list. Building arm64 natively
# instead of under QEMU emulation cuts the frontend build from ~20 min to a
# few minutes (an emulated Next.js build is pathologically slow).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Uses tag v<version>."
        required: true
        type: string
      publish:
        description: "Publish/repair the GitHub Release. Disable for a branch test artifact."
        required: true
        default: true
        type: boolean
      share:
        description: "With publish off: sign, notarize and attach the test DMG to a public prerelease so testers can install it."
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-local-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protected-e2e-gate:
    name: Require fresh backend protected E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Verify branch-test Desktop version
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          requested = os.environ["VERSION"].removeprefix("v")
          desktop = json.loads(Path("desktop/tauri.conf.json").read_text())["version"]
          if requested != desktop:
              raise SystemExit(
                  f"branch-test runtime {requested} does not match Desktop {desktop}"
              )
          PY
      - name: Verify protected evidence
        uses: ./.github/actions/require-backend-protected-e2e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.sha }}

  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: protected-e2e-gate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: lemma-backend
            context: .
            dockerfile: lemma-backend/Dockerfile
          - name: lemma-frontend
            context: .
            dockerfile: lemma-frontend/Dockerfile
          - name: lemma-workspace
            context: .
            dockerfile: lemma-backend/sandbox-images/Dockerfile.workspace
          - name: lemma-function
            context: .
            dockerfile: lemma-backend/sandbox-images/Dockerfile.function
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          # Push by digest only; the merge job assembles the tagged manifest list.
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          # Per-(image, arch) cache scope so the two arch builds never clobber
          # each other's cache. Layer reuse keys on the Dockerfile COPY order:
          # npm ci / uv sync layers stay cached until package-lock / uv.lock changes.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image:
          - lemma-backend
          - lemma-frontend
          - lemma-workspace
          - lemma-function
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ inputs.version }}"
          fi
          version="${version#v}"
          if [[ "${PUBLISH}" == "true" ]]; then
            image_tag="v${version}"
          else
            image_tag="test-${GITHUB_SHA:0:12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}--*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          tags=(
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.image_tag }}
          )
          if [[ "${PUBLISH}" == "true" ]]; then
            tags+=(-t ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest)
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            $(printf '${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Record merged digest
        id: digest
        shell: bash
        working-directory: /tmp/digests
        run: |
          mkdir -p digests-out
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.image_tag }}" \
          NAME="${{ matrix.image }}" \
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          ref = os.environ["IMAGE"]
          manifest = json.loads(subprocess.check_output(
              ["docker", "buildx", "imagetools", "inspect", ref, "--raw"],
              text=True,
          ))
          platforms = {
              f"{item['platform']['os']}/{item['platform']['architecture']}": item["digest"]
              for item in manifest.get("manifests", [])
              if item.get("platform", {}).get("os") and item.get("platform", {}).get("architecture")
          }
          required = {"linux/amd64", "linux/arm64"}
          if not required.issubset(platforms):
              raise SystemExit(f"{ref} is missing release platforms: {required - platforms.keys()}")
          digest = subprocess.check_output(
              [
                  "docker", "buildx", "imagetools", "inspect", ref,
                  "--format", "{{json .Manifest.Digest}}",
              ],
              text=True,
          ).strip().strip('"')
          entry = {"name": os.environ["NAME"], "digest": digest, "platforms": platforms}
          Path(f"digests-out/{os.environ['NAME']}.json").write_text(
              json.dumps(entry, indent=2) + "\n"
          )
          PY

      - name: Upload merged digest
        uses: actions/upload-artifact@v4
        with:
          name: merged-digest-${{ matrix.image }}
          path: /tmp/digests/digests-out/${{ matrix.image }}.json
          retention-days: 1

  infra-digests:
    name: Pin third-party infrastructure images
    runs-on: ubuntu-latest
    needs: protected-e2e-gate
    env:
      POSTGRES_IMAGE: docker.io/pgvector/pgvector:0.8.3-pg16
      REDIS_IMAGE: docker.io/redis:7.4-alpine
      SUPERTOKENS_IMAGE: docker.io/supertokens/supertokens-postgresql:11.4.5
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve immutable manifest digests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          refs = {
              "postgres": os.environ["POSTGRES_IMAGE"],
              "redis": os.environ["REDIS_IMAGE"],
              "supertokens": os.environ["SUPERTOKENS_IMAGE"],
          }
          pinned = {}
          for name, ref in refs.items():
              manifest = json.loads(subprocess.check_output(
                  ["docker", "buildx", "imagetools", "inspect", ref, "--raw"],
                  text=True,
              ))
              platforms = {
                  f"{item['platform']['os']}/{item['platform']['architecture']}": item["digest"]
                  for item in manifest.get("manifests", [])
                  if item.get("platform", {}).get("os") and item.get("platform", {}).get("architecture")
              }
              required = {"linux/amd64", "linux/arm64"}
              if not required.issubset(platforms):
                  raise SystemExit(f"{ref} is missing release platforms: {required - platforms.keys()}")
              digest = subprocess.check_output(
                  [
                      "docker", "buildx", "imagetools", "inspect", ref,
                      "--format", "{{json .Manifest.Digest}}",
                  ],
                  text=True,
              ).strip().strip('"')
              if not digest.startswith("sha256:"):
                  raise SystemExit(f"could not resolve digest for {ref}: {digest}")
              pinned[name] = {"ref": ref, "digest": digest, "platforms": platforms}
          Path("infra-digests.json").write_text(json.dumps(pinned, indent=2) + "\n")
          PY

      - name: Upload infrastructure digests
        uses: actions/upload-artifact@v4
        with:
          name: infra-digests
          path: infra-digests.json
          if-no-files-found: error
          retention-days: 1

  guest-runtimes:
    name: Build managed guest runtime (${{ matrix.target }})
    needs: protected-e2e-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: ubuntu-24.04-arm
          - target: windows-x86_64
            runner: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install ARM64 kernel unpacker
        if: matrix.target == 'macos-aarch64'
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Build guest control daemon
        run: cargo build --manifest-path desktop/Cargo.toml -p lemma-guestd --release

      - name: Assemble private guest artifact
        shell: bash
        run: |
          bash scripts/build_local_guest_runtime.sh \
            --target "${{ matrix.target }}" \
            --guestd desktop/target/release/lemma-guestd \
            --output "guest-runtime-out/lemma-guest-runtime-${{ matrix.target }}.zip"

      - name: Upload managed guest runtime
        uses: actions/upload-artifact@v4
        with:
          name: guest-runtime-${{ matrix.target }}
          path: |
            guest-runtime-out/lemma-guest-runtime-${{ matrix.target }}.zip
            guest-runtime-out/lemma-guest-runtime-${{ matrix.target }}.zip.json
          if-no-files-found: error
          retention-days: 1

  host-packs:
    name: Build native host pack (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [merge, infra-digests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ inputs.version }}"
          fi
          version="${version#v}"
          if [[ "${PUBLISH}" == "true" ]]; then
            image_tag="v${version}"
          else
            image_tag="test-${GITHUB_SHA:0:12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Import Windows host-pack signing certificate
        if: >-
          matrix.target == 'x86_64-pc-windows-msvc' &&
          (github.event_name == 'push' || inputs.publish)
        id: windows-signing
        uses: ./.github/actions/setup-windows-signing
        with:
          certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          certificate-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          timestamp-url: ${{ secrets.WINDOWS_TIMESTAMP_URL }}

      - name: Download merged image digests
        uses: actions/download-artifact@v8
        with:
          pattern: merged-digest-*
          path: digests
          merge-multiple: true

      - name: Download infrastructure digests
        uses: actions/download-artifact@v8
        with:
          name: infra-digests
          path: digests

      - name: Generate pack release input
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          image_tag = os.environ["IMAGE_TAG"]
          prefix = os.environ["PREFIX"]
          platform = {
              "aarch64-apple-darwin": "linux/arm64",
              "x86_64-pc-windows-msvc": "linux/amd64",
          }[os.environ["TARGET"]]
          digests = {}
          for path in Path("digests").glob("*.json"):
              entry = json.loads(path.read_text())
              if "name" in entry:
                  digests[entry["name"]] = entry

          def image(name):
              return {
                  "ref": f"{prefix}/{name}:{image_tag}",
                  "digest": digests[name]["platforms"][platform],
              }

          infra = json.loads(Path("digests/infra-digests.json").read_text())
          for entry in infra.values():
              entry["digest"] = entry["platforms"][platform]
              entry.pop("platforms", None)

          release = {
              "schema_version": 1,
              "version": version,
              "min_admin_version": "0.1.0",
              "images": {
                  "backend": image("lemma-backend"),
                  "frontend": image("lemma-frontend"),
                  "workspace": image("lemma-workspace"),
                  "function": image("lemma-function"),
                  # Same refs under the pre-rename keys. A lemma-stack or locald
                  # already installed on someone's machine looks these up by name
                  # and raises if they are missing, and publishing a manifest
                  # cannot upgrade a client that has not run yet. Drop them once
                  # no released client reads them.
              },
              "infra": infra,
          }
          Path("host-release.json").write_text(json.dumps(release, indent=2) + "\n")
          PY

      - name: Build relocatable backend and frontend pack
        shell: bash
        run: |
          mkdir -p host-pack-out
          python scripts/build_local_host_pack.py \
            --output host-pack-out/local-runtime \
            --release-manifest host-release.json

      - name: Sign downloadable Windows host runtime
        if: >-
          matrix.target == 'x86_64-pc-windows-msvc' &&
          (github.event_name == 'push' || inputs.publish)
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            -ErrorAction Stop |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "Windows SDK signtool.exe was not found" }
          foreach ($path in @(
            "host-pack-out/local-runtime/backend/python/python.exe",
            "host-pack-out/local-runtime/frontend/node/node.exe"
          )) {
            if (-not (Test-Path $path)) { throw "Host runtime executable is missing: $path" }
            & $signTool.FullName sign `
              /sha1 $env:CERTIFICATE_THUMBPRINT `
              /fd SHA256 `
              /tr $env:WINDOWS_TIMESTAMP_URL `
              /td SHA256 `
              $path
            if ($LASTEXITCODE -ne 0) { throw "Could not sign host runtime executable: $path" }
            if ((Get-AuthenticodeSignature $path).Status -ne "Valid") {
              throw "Host runtime signature verification failed: $path"
            }
          }

      - name: Archive native host pack
        shell: bash
        run: |
          python scripts/build_local_host_pack.py \
            --output host-pack-out/local-runtime \
            --release-manifest host-release.json \
            --archive "host-pack-out/lemma-host-pack-${{ matrix.target }}.zip" \
            --archive-existing

      - name: Upload host pack
        uses: actions/upload-artifact@v4
        with:
          name: host-pack-${{ matrix.target }}
          path: |
            host-pack-out/lemma-host-pack-${{ matrix.target }}.zip
            host-pack-out/lemma-host-pack-${{ matrix.target }}.zip.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove Windows host-pack signing certificate
        if: always() && matrix.target == 'x86_64-pc-windows-msvc' && steps.windows-signing.outcome == 'success'
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_THUMBPRINT)) {
            Remove-Item `
              "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" `
              -Force `
              -ErrorAction SilentlyContinue
          }

  manifest:
    name: Publish release manifest
    runs-on: ubuntu-latest
    needs: [merge, infra-digests, guest-runtimes, host-packs]
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ inputs.version }}"
          fi
          version="${version#v}"
          if [[ "${PUBLISH}" == "true" ]]; then
            image_tag="v${version}"
          else
            image_tag="test-${GITHUB_SHA:0:12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Download merged digests
        uses: actions/download-artifact@v8
        with:
          pattern: merged-digest-*
          path: digests
          merge-multiple: true

      - name: Download native host packs
        uses: actions/download-artifact@v8
        with:
          pattern: host-pack-*
          path: host-packs
          merge-multiple: true

      - name: Download infrastructure digests
        uses: actions/download-artifact@v8
        with:
          name: infra-digests
          path: digests

      - name: Download managed guest runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: guest-runtime-*
          path: guest-runtimes
          merge-multiple: true

      - name: Generate lemma-local.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["VERSION"]
          image_tag = os.environ["IMAGE_TAG"]
          prefix = os.environ["PREFIX"]
          repository = os.environ["REPOSITORY"]
          digests = {}
          for path in Path("digests").glob("*.json"):
              entry = json.loads(path.read_text())
              if "name" in entry:
                  digests[entry["name"]] = entry["digest"]

          def image(name: str) -> dict:
              return {"ref": f"{prefix}/{name}:{image_tag}", "digest": digests[name]}

          host_packs = {}
          for path in sorted(Path("host-packs").glob("lemma-host-pack-*.zip")):
              target = path.stem.removeprefix("lemma-host-pack-")
              platform, architecture = {
                  "aarch64-apple-darwin": ("macos", "aarch64"),
                  "x86_64-pc-windows-msvc": ("windows", "x86_64"),
              }[target]
              import hashlib
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              metadata = json.loads(path.with_suffix(path.suffix + ".json").read_text())
              if metadata["sha256"] != digest or metadata["size"] != path.stat().st_size:
                  raise SystemExit(f"{path.name} metadata mismatch")
              host_packs[target] = {
                  "url": (
                      f"https://github.com/{repository}/releases/download/"
                      f"v{version}/{path.name}"
                  ),
                  "sha256": digest,
                  "size": path.stat().st_size,
                  "expanded_size": metadata["expanded_size"],
                  "format": "zip",
                  "platform": platform,
                  "architecture": architecture,
                  "runtime_version": version,
              }

          guest_runtimes = {}
          for path in sorted(Path("guest-runtimes").glob("lemma-guest-runtime-*.zip")):
              target = path.stem.removeprefix("lemma-guest-runtime-")
              platform, architecture = {
                  "macos-aarch64": ("linux", "aarch64"),
                  "windows-x86_64": ("linux", "x86_64"),
              }[target]
              import hashlib
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              metadata = json.loads(path.with_suffix(path.suffix + ".json").read_text())
              if metadata["sha256"] != digest or metadata["size"] != path.stat().st_size:
                  raise SystemExit(f"{path.name} metadata mismatch")
              guest_runtimes[target] = {
                  "url": (
                      f"https://github.com/{repository}/releases/download/"
                      f"v{version}/{path.name}"
                  ),
                  "sha256": digest,
                  "size": path.stat().st_size,
                  "expanded_size": metadata["expanded_size"],
                  "format": "zip",
                  "platform": platform,
                  "architecture": architecture,
                  "runtime_version": version,
              }

          manifest = {
              # Additive schema-1 field: older lemma-stack clients ignore
              # host_packs and continue to consume the same release safely.
              "schema_version": 1,
              "version": version,
              "released_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "min_admin_version": "0.1.0",
              "images": {
                  "backend": image("lemma-backend"),
                  "frontend": image("lemma-frontend"),
                  "workspace": image("lemma-workspace"),
                  "function": image("lemma-function"),
                  # Same refs under the pre-rename keys, for clients already
                  # installed when this ships. See the note in the host-release
                  # manifest above; drop both together.
              },
              # Keep schema-1 compatibility for older lemma-stack clients:
              # public infra entries remain strings, now pinned to the
              # multi-platform index digest. Native host packs separately use
              # the exact per-platform child digest resolved above.
              "infra": {
                  name: f"{entry['ref']}@{entry['digest']}"
                  for name, entry in json.loads(
                      Path("digests/infra-digests.json").read_text()
                  ).items()
              },
              "host_packs": host_packs,
              "guest_runtimes": guest_runtimes,
          }
          Path("lemma-local.json").write_text(json.dumps(manifest, indent=2) + "\n")
          for host_target, guest_target in (
              ("aarch64-apple-darwin", "macos-aarch64"),
              ("x86_64-pc-windows-msvc", "windows-x86_64"),
          ):
              if host_target not in host_packs or guest_target not in guest_runtimes:
                  continue
              compressed = host_packs[host_target]["size"] + guest_runtimes[guest_target]["size"]
              expanded = (
                  host_packs[host_target]["expanded_size"]
                  + guest_runtimes[guest_target]["expanded_size"]
              )
              if compressed > 750 * 1024 * 1024:
                  raise SystemExit(f"{host_target} compressed runtime exceeds 750 MiB")
              if expanded > 2250 * 1024 * 1024:
                  raise SystemExit(f"{host_target} expanded runtime exceeds 2.25 GiB")
              print(json.dumps({
                  "target": host_target,
                  "compressed_bytes": compressed,
                  "expanded_bytes": expanded,
                  "host_breakdown": json.loads(
                      next(Path("host-packs").glob(f"lemma-host-pack-{host_target}.zip.json")).read_text()
                  ).get("breakdown", {}),
                  "guest_breakdown": json.loads(
                      next(Path("guest-runtimes").glob(f"lemma-guest-runtime-{guest_target}.zip.json")).read_text()
                  ).get("breakdown", {}),
                  "oci_images": manifest["infra"] | {
                      name: manifest["images"][name]
                      for name in ("workspace", "function")
                  },
              }, indent=2))
          print(json.dumps(manifest, indent=2))
          PY

      - name: Attach manifest to release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            lemma-local.json
            host-packs/lemma-host-pack-*.zip
            guest-runtimes/lemma-guest-runtime-*.zip
          # Only generate release notes on a real tag push; workflow_dispatch
          # re-runs are used to repair an existing release (backfill the
          # lemma-local.json asset) and must not overwrite the release body.
          generate_release_notes: ${{ github.event_name == 'push' }}

      - name: Upload branch-test runtime bundle
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: lemma-local-test-${{ github.sha }}
          path: |
            lemma-local.json
            host-packs/lemma-host-pack-*.zip
            guest-runtimes/lemma-guest-runtime-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload branch-test manifest for Desktop packaging
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: lemma-local-test-manifest-${{ github.sha }}
          path: lemma-local.json
          if-no-files-found: error
          retention-days: 1

  macos-test-desktop:
    name: Package self-contained macOS test app
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    runs-on: macos-14
    needs: manifest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-test-cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-test-cargo-${{ runner.os }}-

      - name: Download macOS native host pack
        uses: actions/download-artifact@v8
        with:
          name: host-pack-aarch64-apple-darwin
          path: desktop/runtime/download

      - name: Download macOS managed guest runtime
        uses: actions/download-artifact@v8
        with:
          name: guest-runtime-macos-aarch64
          path: desktop/runtime/download

      - name: Download exact branch-test manifest
        uses: actions/download-artifact@v8
        with:
          name: lemma-local-test-manifest-${{ github.sha }}
          path: desktop/runtime/download

      # One staging engine for CI and for `make desktop-dmg`, so a locally
      # built test DMG and this one are produced by the same code.
      - name: Verify and stage compressed PR test runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_desktop_test_runtime.py \
            --artifacts-dir desktop/runtime/download \
            --mode bundled \
            --expect-version "${{ inputs.version }}" \
            --host-target aarch64-apple-darwin \
            --guest-target macos-aarch64 \
            --stage-dir desktop/runtime/bundled \
            --output desktop/runtime/bundled/lemma-local.json

      - name: Bake splash concepts
        run: node desktop/scripts/extract-concepts.mjs

      - name: Verify baked splash concepts are committed
        run: git diff --exit-code desktop/ui/concepts.gen.json

      - name: Build native local sidecars
        run: desktop/scripts/build-sidecar.sh

      - name: Run Desktop tests
        working-directory: desktop
        run: cargo test --locked

      # A shared build has to open on machines that did not produce it, and an
      # ad-hoc signature does not: Gatekeeper refuses it outright. Import the
      # Developer ID identity so the helper, the app and the DMG all carry one
      # Apple will accept, and so notarization below has something to staple to.
      - name: Import Apple signing certificate
        id: apple-signing
        if: inputs.share
        uses: ./.github/actions/setup-apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign virtualization helper with test entitlement
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.apple-signing.outputs.signing-identity }}
        run: |
          set -euo pipefail
          helper="desktop/binaries/lemma-vz-aarch64-apple-darwin"
          # "-" is ad-hoc, which is fine for a build only its author installs.
          codesign --force --options runtime \
            --entitlements desktop/entitlements.plist \
            --sign "${SIGNING_IDENTITY:--}" \
            "${helper}"
          codesign --verify --strict --verbose=2 "${helper}"
          codesign -d --entitlements :- "${helper}" 2>&1 \
            | grep -F "com.apple.security.virtualization"

      - name: Read the pinned Tauri CLI
        run: |
          echo "TAURI_CLI=@tauri-apps/cli@$(tr -d '[:space:]' < desktop/scripts/tauri-cli-version.txt)" >> "$GITHUB_ENV"

      - name: Build compressed macOS PR test DMG
        working-directory: desktop
        env:
          # "-" is ad-hoc: fine for a build only its author installs, refused by
          # Gatekeeper anywhere else. A shared build gets the real identity, and
          # the Apple credentials beside it are what make the bundler notarize
          # and staple as part of the same step.
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-signing.outputs.signing-identity || '-' }}
          APPLE_ID: ${{ inputs.share && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.share && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.share && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          npx -y "$TAURI_CLI" build --config tauri.dist.conf.json

      # Proving it here means a tester never discovers it at their end, where
      # the only symptom is a dialog telling them the app is damaged.
      - name: Verify the shared build is notarized
        if: inputs.share
        shell: bash
        run: |
          set -euo pipefail
          app="desktop/target/release/bundle/macos/Lemma.app"
          codesign --verify --deep --strict --verbose=2 "${app}"
          xcrun stapler validate "${app}"
          xcrun stapler validate desktop/target/release/bundle/dmg/Lemma_*_aarch64.dmg

      - name: Verify compressed PR test application
        shell: bash
        run: |
          set -euo pipefail
          app="desktop/target/release/bundle/macos/Lemma.app"
          test -x "${app}/Contents/MacOS/lemma-locald"
          test -x "${app}/Contents/MacOS/lemma-runtime"
          test -x "${app}/Contents/Resources/lemma-vz"
          test -f "${app}/Contents/Resources/lemma-local.json"
          test -f "${app}/Contents/Resources/host-runtime.zip"
          test -f "${app}/Contents/Resources/guest-runtime.zip"
          test ! -e "${app}/Contents/Resources/local-runtime"
          test ! -e "${app}/Contents/Resources/managed-runtime"
          app_bytes="$(du -sk "${app}" | awk '{print $1 * 1024}')"
          test "${app_bytes}" -le "$((850 * 1024 * 1024))"
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign -d --entitlements :- \
            "${app}/Contents/Resources/lemma-vz" 2>&1 \
            | grep -F "com.apple.security.virtualization"
          test "$(jq -r .version "${app}/Contents/Resources/lemma-local.json")" = \
            "$(jq -r .version desktop/tauri.conf.json)"

      - name: Upload compressed macOS PR test DMG
        uses: actions/upload-artifact@v4
        with:
          name: lemma-desktop-macos-pr-test-${{ github.sha }}
          path: desktop/target/release/bundle/dmg/Lemma_*_aarch64.dmg
          if-no-files-found: error
          retention-days: 14

      # A workflow artifact needs a GitHub account and repo access to download,
      # which is the wrong shape for handing a build to testers. A prerelease is
      # a plain public URL, and prereleases never become "Latest", so the real
      # release channel is untouched. release-desktop.yml ignores these tags.
      - name: Share the DMG as a public prerelease
        if: inputs.share
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          short="${SHA:0:8}"
          tag="desktop-nightly-${short}"
          dmg="$(ls desktop/target/release/bundle/dmg/Lemma_*_aarch64.dmg)"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --prerelease \
              --target "${SHA}" \
              --title "Lemma Desktop nightly — ${REF_NAME} ${short}" \
              --notes "$(cat <<NOTES
          Self-contained macOS build of \`${REF_NAME}\` at ${short}, signed with
          Developer ID and notarized, so it opens without a Gatekeeper warning.

          Apple silicon, macOS 14+. Download the DMG, drag Lemma to Applications,
          open it, and choose **Local → Install local services**.

          Not an official release: it is built on demand from a branch and carries
          no upgrade or support guarantees.
          NOTES
          )"
          fi
          gh release upload "${tag}" "${dmg}" --clobber
          url="$(gh release view "${tag}" --json assets --jq '.assets[] | select(.name | endswith(".dmg")) | .url')"
          {
            echo "### Lemma Desktop nightly"
            echo
            echo "[Download the DMG](${url})"
          } >> "${GITHUB_STEP_SUMMARY}"

  # The Windows half of the pair. One `publish: false` dispatch now yields both
  # an installable macOS DMG and an installable Windows installer, cut from the
  # same host packs, guest runtimes, and manifest.
  windows-test-desktop:
    name: Package self-contained Windows test app
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    runs-on: windows-latest
    needs: manifest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-test-cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-test-cargo-${{ runner.os }}-

      - name: Download Windows native host pack
        uses: actions/download-artifact@v8
        with:
          name: host-pack-x86_64-pc-windows-msvc
          path: desktop/runtime/download

      - name: Download Windows managed guest runtime
        uses: actions/download-artifact@v8
        with:
          name: guest-runtime-windows-x86_64
          path: desktop/runtime/download

      - name: Download exact branch-test manifest
        uses: actions/download-artifact@v8
        with:
          name: lemma-local-test-manifest-${{ github.sha }}
          path: desktop/runtime/download

      # The same staging engine the macOS job and `desktop.ps1 exe` use.
      - name: Verify and stage compressed PR test runtime
        run: |
          python scripts/prepare_desktop_test_runtime.py `
            --artifacts-dir desktop/runtime/download `
            --mode bundled `
            --expect-version "${{ inputs.version }}" `
            --host-target x86_64-pc-windows-msvc `
            --guest-target windows-x86_64 `
            --stage-dir desktop/runtime/bundled `
            --output desktop/runtime/bundled/lemma-local.json
          if ($LASTEXITCODE -ne 0) { throw "Staging the bundled runtime failed" }

      - name: Bake splash concepts
        run: node desktop/scripts/extract-concepts.mjs

      - name: Verify baked splash concepts are committed
        run: git diff --exit-code desktop/ui/concepts.gen.json

      - name: Build Windows sidecars
        run: desktop/scripts/build-sidecar.ps1

      - name: Run Desktop tests
        working-directory: desktop
        run: cargo test -p lemma-desktop --locked

      - name: Read the pinned Tauri CLI
        run: |
          $v = (Get-Content desktop/scripts/tauri-cli-version.txt).Trim()
          "TAURI_CLI=@tauri-apps/cli@$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build compressed Windows PR test installer
        working-directory: desktop
        run: |
          npx -y $env:TAURI_CLI build --config tauri.dist.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Bundled NSIS build failed" }

      # A publish:false host pack is unsigned end to end, so there is no
      # Authenticode to verify. NSIS is an LZMA self-extractor, so unlike the
      # macOS .app the payload cannot be walked with Expand-Archive either -
      # 7-Zip understands the container and ships on windows-latest, which makes
      # it the only way to prove the runtime archives actually got inside.
      - name: Verify compressed PR test installer
        run: |
          $ErrorActionPreference = "Stop"
          $payload = @(
            "desktop/target/release/lemma-desktop.exe",
            "desktop/binaries/lemma-locald-x86_64-pc-windows-msvc.exe",
            "desktop/binaries/lemma-agent-host-x86_64-pc-windows-msvc.exe",
            "desktop/binaries/lemma-runtime-x86_64-pc-windows-msvc.exe",
            "desktop/runtime/bundled/lemma-local.json",
            "desktop/runtime/bundled/host-runtime.zip",
            "desktop/runtime/bundled/guest-runtime.zip"
          )
          $bytes = ($payload | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Bundled payload is missing: $_" }
            (Get-Item $_).Length
          } | Measure-Object -Sum).Sum
          # The same hard gate the bundled macOS app is held to. On Windows the
          # installed application only exists post-install, so the staged
          # payload is the honest analogue of `du -sk Lemma.app`.
          if ($bytes -gt 850MB) {
            throw "Bundled application payload is $bytes bytes; the limit is 850 MiB"
          }

          $installers = @(Get-ChildItem desktop/target/release/bundle/nsis/Lemma_*-setup.exe `
            -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one bundled NSIS installer, found $($installers.Count)"
          }
          $installer = $installers[0]

          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
            $listing = & $sevenZip l $installer.FullName | Out-String
            foreach ($entry in @("lemma-desktop.exe", "lemma-locald", "lemma-runtime",
                                 "lemma-local.json", "host-runtime.zip", "guest-runtime.zip")) {
              if ($listing -notmatch [regex]::Escape($entry)) {
                throw "NSIS installer does not contain $entry"
              }
            }
            Write-Host "installer contents verified with 7-Zip"
          } else {
            # Do not fail the build over a missing inspector: the payload check
            # above already proves what went in. Say so, so a silently weaker
            # gate is visible in the log.
            Write-Warning "7-Zip not found; skipped inspecting the installer contents"
          }

          $manifest = Get-Content desktop/runtime/bundled/lemma-local.json | ConvertFrom-Json
          $conf = Get-Content desktop/tauri.conf.json | ConvertFrom-Json
          if ($manifest.version -ne $conf.version) {
            throw "The bundled runtime manifest and Desktop disagree on the version"
          }
          Write-Host "installer verified: $($installer.Name) ($($installer.Length) bytes)"

      - name: Upload compressed Windows PR test installer
        uses: actions/upload-artifact@v4
        with:
          name: lemma-desktop-windows-pr-test-${{ github.sha }}
          path: desktop/target/release/bundle/nsis/Lemma_*-setup.exe
          if-no-files-found: error
          retention-days: 14
