name: Release Local Stack Images

# Builds the backend, frontend, and the workspace/function sandbox images. It
# also assembles the native host packs and private guest runtimes consumed by
# Lemma Desktop. Published runs
# attach them to the GitHub release; branch-test runs retain them in Actions.
# lemma-stack resolves:
#   stable  -> releases/latest/download/lemma-local.json
#   <X.Y.Z> -> releases/download/v<X.Y.Z>/lemma-local.json
#
# Multi-arch is built on NATIVE runners (amd64 on ubuntu-latest, arm64 on
# ubuntu-24.04-arm) and merged into a manifest list. Building arm64 natively
# instead of under QEMU emulation cuts the frontend build from ~20 min to a
# few minutes (an emulated Next.js build is pathologically slow).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Uses tag v<version>."
        required: true
        type: string
      publish:
        description: "Publish/repair the GitHub Release. Disable for a branch test artifact."
        required: true
        default: true
        type: boolean
      share:
        description: "With publish off: publish the runtime to a nightly prerelease and attach a signed, notarized online DMG anyone can install."
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-local-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protected-e2e-gate:
    name: Require fresh backend protected E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Verify branch-test Desktop version
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          requested = os.environ["VERSION"].removeprefix("v")
          desktop = json.loads(Path("desktop/tauri.conf.json").read_text())["version"]
          if requested != desktop:
              raise SystemExit(
                  f"branch-test runtime {requested} does not match Desktop {desktop}"
              )
          PY
      # Release evidence gates a release. A branch test build is explicitly not
      # one: it is how a commit gets tried *before* it is release-qualified, and
      # protected E2E is not a required check on main, so demanding a successful
      # run for the exact SHA would block nearly every one of these. The version
      # check above still runs either way.
      - name: Verify protected evidence
        if: github.event_name == 'push' || inputs.publish
        uses: ./.github/actions/require-backend-protected-e2e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.sha }}

  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: protected-e2e-gate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: lemma-backend
            context: .
            dockerfile: lemma-backend/Dockerfile
          - name: lemma-frontend
            context: .
            dockerfile: lemma-frontend/Dockerfile
          - name: lemma-workspace
            context: .
            dockerfile: lemma-backend/sandbox-images/Dockerfile.workspace
          - name: lemma-function
            context: .
            dockerfile: lemma-backend/sandbox-images/Dockerfile.function
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          # Push by digest only; the merge job assembles the tagged manifest list.
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          # Per-(image, arch) cache scope so the two arch builds never clobber
          # each other's cache. Layer reuse keys on the Dockerfile COPY order:
          # npm ci / uv sync layers stay cached until package-lock / uv.lock changes.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image:
          - lemma-backend
          - lemma-frontend
          - lemma-workspace
          - lemma-function
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ inputs.version }}"
          fi
          version="${version#v}"
          if [[ "${PUBLISH}" == "true" ]]; then
            image_tag="v${version}"
          else
            image_tag="test-${GITHUB_SHA:0:12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}--*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          tags=(
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.image_tag }}
          )
          if [[ "${PUBLISH}" == "true" ]]; then
            tags+=(-t ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest)
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            $(printf '${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Record merged digest
        id: digest
        shell: bash
        working-directory: /tmp/digests
        run: |
          mkdir -p digests-out
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.image_tag }}" \
          NAME="${{ matrix.image }}" \
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          ref = os.environ["IMAGE"]
          manifest = json.loads(subprocess.check_output(
              ["docker", "buildx", "imagetools", "inspect", ref, "--raw"],
              text=True,
          ))
          platforms = {
              f"{item['platform']['os']}/{item['platform']['architecture']}": item["digest"]
              for item in manifest.get("manifests", [])
              if item.get("platform", {}).get("os") and item.get("platform", {}).get("architecture")
          }
          required = {"linux/amd64", "linux/arm64"}
          if not required.issubset(platforms):
              raise SystemExit(f"{ref} is missing release platforms: {required - platforms.keys()}")
          digest = subprocess.check_output(
              [
                  "docker", "buildx", "imagetools", "inspect", ref,
                  "--format", "{{json .Manifest.Digest}}",
              ],
              text=True,
          ).strip().strip('"')
          entry = {"name": os.environ["NAME"], "digest": digest, "platforms": platforms}
          Path(f"digests-out/{os.environ['NAME']}.json").write_text(
              json.dumps(entry, indent=2) + "\n"
          )
          PY

      - name: Upload merged digest
        uses: actions/upload-artifact@v4
        with:
          name: merged-digest-${{ matrix.image }}
          path: /tmp/digests/digests-out/${{ matrix.image }}.json
          retention-days: 1

  infra-digests:
    name: Pin third-party infrastructure images
    runs-on: ubuntu-latest
    needs: protected-e2e-gate
    env:
      POSTGRES_IMAGE: docker.io/pgvector/pgvector:0.8.3-pg16
      REDIS_IMAGE: docker.io/redis:7.4-alpine
      SUPERTOKENS_IMAGE: docker.io/supertokens/supertokens-postgresql:11.4.5
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve immutable manifest digests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          refs = {
              "postgres": os.environ["POSTGRES_IMAGE"],
              "redis": os.environ["REDIS_IMAGE"],
              "supertokens": os.environ["SUPERTOKENS_IMAGE"],
          }
          pinned = {}
          for name, ref in refs.items():
              manifest = json.loads(subprocess.check_output(
                  ["docker", "buildx", "imagetools", "inspect", ref, "--raw"],
                  text=True,
              ))
              platforms = {
                  f"{item['platform']['os']}/{item['platform']['architecture']}": item["digest"]
                  for item in manifest.get("manifests", [])
                  if item.get("platform", {}).get("os") and item.get("platform", {}).get("architecture")
              }
              required = {"linux/amd64", "linux/arm64"}
              if not required.issubset(platforms):
                  raise SystemExit(f"{ref} is missing release platforms: {required - platforms.keys()}")
              digest = subprocess.check_output(
                  [
                      "docker", "buildx", "imagetools", "inspect", ref,
                      "--format", "{{json .Manifest.Digest}}",
                  ],
                  text=True,
              ).strip().strip('"')
              if not digest.startswith("sha256:"):
                  raise SystemExit(f"could not resolve digest for {ref}: {digest}")
              pinned[name] = {"ref": ref, "digest": digest, "platforms": platforms}
          Path("infra-digests.json").write_text(json.dumps(pinned, indent=2) + "\n")
          PY

      - name: Upload infrastructure digests
        uses: actions/upload-artifact@v4
        with:
          name: infra-digests
          path: infra-digests.json
          if-no-files-found: error
          retention-days: 1

  guest-runtimes:
    name: Build managed guest runtime (${{ matrix.target }})
    needs: protected-e2e-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: ubuntu-24.04-arm
          - target: windows-x86_64
            runner: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install ARM64 kernel unpacker
        if: matrix.target == 'macos-aarch64'
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Build guest control daemon
        run: cargo build --manifest-path desktop/Cargo.toml -p lemma-guestd --release

      - name: Assemble private guest artifact
        shell: bash
        run: |
          bash scripts/build_local_guest_runtime.sh \
            --target "${{ matrix.target }}" \
            --guestd desktop/target/release/lemma-guestd \
            --output "guest-runtime-out/lemma-guest-runtime-${{ matrix.target }}.zip"

      - name: Upload managed guest runtime
        uses: actions/upload-artifact@v4
        with:
          name: guest-runtime-${{ matrix.target }}
          path: |
            guest-runtime-out/lemma-guest-runtime-${{ matrix.target }}.zip
            guest-runtime-out/lemma-guest-runtime-${{ matrix.target }}.zip.json
          if-no-files-found: error
          retention-days: 1

  host-packs:
    name: Build native host pack (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [merge, infra-digests]
    # Windows signing is best-effort. macOS is the platform this project ships:
    # the Windows installer is built and kept for whoever is testing it, and is
    # deliberately never attached to a release, because attaching it is what
    # makes it an offer of support. Hard-failing the Windows pack when no
    # certificate is configured therefore blocks the release of the platform we
    # *do* ship on the one we do not — which is exactly what happened on the
    # v0.7.0 tag, the first time this path ran with `publish` true.
    #
    # `secrets` cannot be read from a step `if`, so the availability test is
    # resolved once here, where the job `env` can see it, and compared as a
    # string below.
    env:
      WINDOWS_SIGNING_AVAILABLE: >-
        ${{ secrets.WINDOWS_CERTIFICATE != ''
        && secrets.WINDOWS_CERTIFICATE_PASSWORD != ''
        && secrets.WINDOWS_TIMESTAMP_URL != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ inputs.version }}"
          fi
          version="${version#v}"
          if [[ "${PUBLISH}" == "true" ]]; then
            image_tag="v${version}"
          else
            image_tag="test-${GITHUB_SHA:0:12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Report unsigned Windows host pack
        if: >-
          matrix.target == 'x86_64-pc-windows-msvc' &&
          (github.event_name == 'push' || inputs.publish) &&
          env.WINDOWS_SIGNING_AVAILABLE != 'true'
        shell: bash
        run: |
          echo "::warning title=Windows host pack is unsigned::\
          WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD and \
          WINDOWS_TIMESTAMP_URL are not all configured, so this host pack is \
          published unsigned. macOS is unaffected. Set the three secrets to \
          restore signing."

      - name: Import Windows host-pack signing certificate
        if: >-
          matrix.target == 'x86_64-pc-windows-msvc' &&
          (github.event_name == 'push' || inputs.publish) &&
          env.WINDOWS_SIGNING_AVAILABLE == 'true'
        id: windows-signing
        uses: ./.github/actions/setup-windows-signing
        with:
          certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          certificate-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          timestamp-url: ${{ secrets.WINDOWS_TIMESTAMP_URL }}

      - name: Download merged image digests
        uses: actions/download-artifact@v8
        with:
          pattern: merged-digest-*
          path: digests
          merge-multiple: true

      - name: Download infrastructure digests
        uses: actions/download-artifact@v8
        with:
          name: infra-digests
          path: digests

      - name: Generate pack release input
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          image_tag = os.environ["IMAGE_TAG"]
          prefix = os.environ["PREFIX"]
          platform = {
              "aarch64-apple-darwin": "linux/arm64",
              "x86_64-pc-windows-msvc": "linux/amd64",
          }[os.environ["TARGET"]]
          digests = {}
          for path in Path("digests").glob("*.json"):
              entry = json.loads(path.read_text())
              if "name" in entry:
                  digests[entry["name"]] = entry

          def image(name):
              return {
                  "ref": f"{prefix}/{name}:{image_tag}",
                  "digest": digests[name]["platforms"][platform],
              }

          infra = json.loads(Path("digests/infra-digests.json").read_text())
          for entry in infra.values():
              entry["digest"] = entry["platforms"][platform]
              entry.pop("platforms", None)

          release = {
              "schema_version": 1,
              "version": version,
              "min_admin_version": "0.1.0",
              "images": {
                  "backend": image("lemma-backend"),
                  "frontend": image("lemma-frontend"),
                  "workspace": image("lemma-workspace"),
                  "function": image("lemma-function"),
                  # Same refs under the pre-rename keys. A lemma-stack or locald
                  # already installed on someone's machine looks these up by name
                  # and raises if they are missing, and publishing a manifest
                  # cannot upgrade a client that has not run yet. Drop them once
                  # no released client reads them.
              },
              "infra": infra,
          }
          Path("host-release.json").write_text(json.dumps(release, indent=2) + "\n")
          PY

      - name: Build relocatable backend and frontend pack
        shell: bash
        run: |
          mkdir -p host-pack-out
          python scripts/build_local_host_pack.py \
            --output host-pack-out/local-runtime \
            --release-manifest host-release.json

      - name: Sign downloadable Windows host runtime
        if: >-
          matrix.target == 'x86_64-pc-windows-msvc' &&
          (github.event_name == 'push' || inputs.publish) &&
          env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            -ErrorAction Stop |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "Windows SDK signtool.exe was not found" }
          foreach ($path in @(
            "host-pack-out/local-runtime/backend/python/python.exe",
            "host-pack-out/local-runtime/frontend/node/node.exe"
          )) {
            if (-not (Test-Path $path)) { throw "Host runtime executable is missing: $path" }
            & $signTool.FullName sign `
              /sha1 $env:CERTIFICATE_THUMBPRINT `
              /fd SHA256 `
              /tr $env:WINDOWS_TIMESTAMP_URL `
              /td SHA256 `
              $path
            if ($LASTEXITCODE -ne 0) { throw "Could not sign host runtime executable: $path" }
            if ((Get-AuthenticodeSignature $path).Status -ne "Valid") {
              throw "Host runtime signature verification failed: $path"
            }
          }

      - name: Archive native host pack
        shell: bash
        run: |
          python scripts/build_local_host_pack.py \
            --output host-pack-out/local-runtime \
            --release-manifest host-release.json \
            --archive "host-pack-out/lemma-host-pack-${{ matrix.target }}.zip" \
            --archive-existing

      - name: Upload host pack
        uses: actions/upload-artifact@v4
        with:
          name: host-pack-${{ matrix.target }}
          path: |
            host-pack-out/lemma-host-pack-${{ matrix.target }}.zip
            host-pack-out/lemma-host-pack-${{ matrix.target }}.zip.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove Windows host-pack signing certificate
        if: always() && matrix.target == 'x86_64-pc-windows-msvc' && steps.windows-signing.outcome == 'success'
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_THUMBPRINT)) {
            Remove-Item `
              "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" `
              -Force `
              -ErrorAction SilentlyContinue
          }

  manifest:
    name: Publish release manifest
    runs-on: ubuntu-latest
    needs: [merge, infra-digests, guest-runtimes, host-packs]
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ inputs.version }}"
          fi
          version="${version#v}"
          if [[ "${PUBLISH}" == "true" ]]; then
            image_tag="v${version}"
          else
            image_tag="test-${GITHUB_SHA:0:12}"
          fi
          # Where the runtime assets will live, and therefore what the manifest
          # has to point at. A shared build publishes to its own prerelease so
          # it never touches the version-tag release channel.
          if [[ "${PUBLISH}" == "true" ]]; then
            release_tag="v${version}"
          else
            release_tag="desktop-nightly-${GITHUB_SHA:0:8}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Download merged digests
        uses: actions/download-artifact@v8
        with:
          pattern: merged-digest-*
          path: digests
          merge-multiple: true

      - name: Download native host packs
        uses: actions/download-artifact@v8
        with:
          pattern: host-pack-*
          path: host-packs
          merge-multiple: true

      - name: Download infrastructure digests
        uses: actions/download-artifact@v8
        with:
          name: infra-digests
          path: digests

      - name: Download managed guest runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: guest-runtime-*
          path: guest-runtimes
          merge-multiple: true

      - name: Generate lemma-local.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["VERSION"]
          image_tag = os.environ["IMAGE_TAG"]
          prefix = os.environ["PREFIX"]
          repository = os.environ["REPOSITORY"]
          release_tag = os.environ["RELEASE_TAG"]
          digests = {}
          for path in Path("digests").glob("*.json"):
              entry = json.loads(path.read_text())
              if "name" in entry:
                  digests[entry["name"]] = entry["digest"]

          def image(name: str) -> dict:
              return {"ref": f"{prefix}/{name}:{image_tag}", "digest": digests[name]}

          host_packs = {}
          for path in sorted(Path("host-packs").glob("lemma-host-pack-*.zip")):
              target = path.stem.removeprefix("lemma-host-pack-")
              platform, architecture = {
                  "aarch64-apple-darwin": ("macos", "aarch64"),
                  "x86_64-pc-windows-msvc": ("windows", "x86_64"),
              }[target]
              import hashlib
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              metadata = json.loads(path.with_suffix(path.suffix + ".json").read_text())
              if metadata["sha256"] != digest or metadata["size"] != path.stat().st_size:
                  raise SystemExit(f"{path.name} metadata mismatch")
              host_packs[target] = {
                  "url": (
                      f"https://github.com/{repository}/releases/download/"
                      f"{release_tag}/{path.name}"
                  ),
                  "sha256": digest,
                  "size": path.stat().st_size,
                  "expanded_size": metadata["expanded_size"],
                  "format": "zip",
                  "platform": platform,
                  "architecture": architecture,
                  "runtime_version": version,
              }

          guest_runtimes = {}
          for path in sorted(Path("guest-runtimes").glob("lemma-guest-runtime-*.zip")):
              target = path.stem.removeprefix("lemma-guest-runtime-")
              platform, architecture = {
                  "macos-aarch64": ("linux", "aarch64"),
                  "windows-x86_64": ("linux", "x86_64"),
              }[target]
              import hashlib
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              metadata = json.loads(path.with_suffix(path.suffix + ".json").read_text())
              if metadata["sha256"] != digest or metadata["size"] != path.stat().st_size:
                  raise SystemExit(f"{path.name} metadata mismatch")
              guest_runtimes[target] = {
                  "url": (
                      f"https://github.com/{repository}/releases/download/"
                      f"{release_tag}/{path.name}"
                  ),
                  "sha256": digest,
                  "size": path.stat().st_size,
                  "expanded_size": metadata["expanded_size"],
                  "format": "zip",
                  "platform": platform,
                  "architecture": architecture,
                  "runtime_version": version,
              }

          manifest = {
              # Additive schema-1 field: older lemma-stack clients ignore
              # host_packs and continue to consume the same release safely.
              "schema_version": 1,
              "version": version,
              "released_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "min_admin_version": "0.1.0",
              "images": {
                  "backend": image("lemma-backend"),
                  "frontend": image("lemma-frontend"),
                  "workspace": image("lemma-workspace"),
                  "function": image("lemma-function"),
                  # Same refs under the pre-rename keys, for clients already
                  # installed when this ships. See the note in the host-release
                  # manifest above; drop both together.
              },
              # Keep schema-1 compatibility for older lemma-stack clients:
              # public infra entries remain strings, now pinned to the
              # multi-platform index digest. Native host packs separately use
              # the exact per-platform child digest resolved above.
              "infra": {
                  name: f"{entry['ref']}@{entry['digest']}"
                  for name, entry in json.loads(
                      Path("digests/infra-digests.json").read_text()
                  ).items()
              },
              "host_packs": host_packs,
              "guest_runtimes": guest_runtimes,
          }
          Path("lemma-local.json").write_text(json.dumps(manifest, indent=2) + "\n")
          for host_target, guest_target in (
              ("aarch64-apple-darwin", "macos-aarch64"),
              ("x86_64-pc-windows-msvc", "windows-x86_64"),
          ):
              if host_target not in host_packs or guest_target not in guest_runtimes:
                  continue
              compressed = host_packs[host_target]["size"] + guest_runtimes[guest_target]["size"]
              expanded = (
                  host_packs[host_target]["expanded_size"]
                  + guest_runtimes[guest_target]["expanded_size"]
              )
              if compressed > 750 * 1024 * 1024:
                  raise SystemExit(f"{host_target} compressed runtime exceeds 750 MiB")
              if expanded > 2250 * 1024 * 1024:
                  raise SystemExit(f"{host_target} expanded runtime exceeds 2.25 GiB")
              print(json.dumps({
                  "target": host_target,
                  "compressed_bytes": compressed,
                  "expanded_bytes": expanded,
                  "host_breakdown": json.loads(
                      next(Path("host-packs").glob(f"lemma-host-pack-{host_target}.zip.json")).read_text()
                  ).get("breakdown", {}),
                  "guest_breakdown": json.loads(
                      next(Path("guest-runtimes").glob(f"lemma-guest-runtime-{guest_target}.zip.json")).read_text()
                  ).get("breakdown", {}),
                  "oci_images": manifest["infra"] | {
                      name: manifest["images"][name]
                      for name in ("workspace", "function")
                  },
              }, indent=2))
          print(json.dumps(manifest, indent=2))
          PY

      - name: Attach manifest to release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            lemma-local.json
            host-packs/lemma-host-pack-*.zip
            guest-runtimes/lemma-guest-runtime-*.zip
          # Only generate release notes on a real tag push; workflow_dispatch
          # re-runs are used to repair an existing release (backfill the
          # lemma-local.json asset) and must not overwrite the release body.
          generate_release_notes: ${{ github.event_name == 'push' }}

      # The manifest a shared build ships points at this prerelease, so the
      # assets have to be here before the DMG that references them is built.
      # A prerelease never becomes "Latest", so the version-tag release channel
      # is untouched.
      - name: Publish runtime assets to the nightly prerelease
        if: inputs.share && !inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job only downloads artifacts -- it never checks the repo out --
          # so gh has no git remote to infer the repository from and refuses to
          # run. Name it explicitly rather than checking out a whole tree to
          # satisfy a CLI.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.release_tag }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --prerelease \
              --target "${SHA}" \
              --title "Lemma Desktop nightly — ${REF_NAME} ${SHA:0:8}" \
              --notes "Built on demand from \`${REF_NAME}\` at ${SHA:0:8}. Apple silicon, macOS 14+.

          Download the DMG below, drag Lemma to Applications, open it, and choose **Local → Install local services**. The runtime downloads from this prerelease on first launch.

          Not an official release: no upgrade path and no support guarantees."
          fi
          gh release upload "${TAG}" \
            lemma-local.json \
            host-packs/lemma-host-pack-*.zip \
            guest-runtimes/lemma-guest-runtime-*.zip \
            --clobber

      - name: Upload branch-test runtime bundle
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: lemma-local-test-${{ github.sha }}
          path: |
            lemma-local.json
            host-packs/lemma-host-pack-*.zip
            guest-runtimes/lemma-guest-runtime-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload branch-test manifest for Desktop packaging
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: lemma-local-test-manifest-${{ github.sha }}
          path: lemma-local.json
          if-no-files-found: error
          retention-days: 1

  # The shared build is the *online* app: the same small, signed, notarized DMG
  # a real release ships, pointed at the nightly prerelease instead of a version
  # tag. It has to be the online one -- Apple's notary service unpacks
  # host-runtime.zip and rejects everything inside it, because a bundled CPython
  # and node_modules are not Developer ID signed and never will be. So a
  # self-contained DMG cannot be notarized, and an un-notarized DMG is refused by
  # Gatekeeper on any machine that did not build it.
  #
  # Self-contained builds are a local tool now (`make desktop-dmg`), fed by the
  # runtime artifacts this workflow already uploads. CI does not package them:
  # half a gigabyte per run, for something nobody can hand to a tester anyway.
  share-desktop-dmg:
    name: Publish signed nightly macOS DMG
    if: github.event_name == 'workflow_dispatch' && inputs.share && !inputs.publish
    runs-on: macos-14
    needs: manifest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo and desktop target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-share-cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-share-cargo-${{ runner.os }}-

      - name: Resolve nightly tag
        id: tag
        shell: bash
        run: echo "release_tag=desktop-nightly-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Require notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${APPLE_ID}" || -z "${APPLE_PASSWORD}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "::error::APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are required to share a build." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        id: apple-signing
        uses: ./.github/actions/setup-apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # The same verification the release build does: the app trusts this
      # manifest to fetch its runtime, so the digests it names are checked
      # against the bytes actually published before anything is built.
      - name: Download and verify the published runtime manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.release_tag }}
          TARGET: aarch64-apple-darwin
          GUEST_TARGET: macos-aarch64
        run: |
          set -euo pipefail
          mkdir -p desktop/runtime/download
          gh release download "${TAG}" \
            --pattern lemma-local.json \
            --pattern "lemma-host-pack-${TARGET}.zip" \
            --pattern "lemma-guest-runtime-${GUEST_TARGET}.zip" \
            --dir desktop/runtime/download \
            --clobber
          python3 - <<'VERIFY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("desktop/runtime/download")
          manifest = json.loads((root / "lemma-local.json").read_text())
          for kind, key, name in (
              ("host_packs", os.environ["TARGET"], "lemma-host-pack-{}.zip"),
              ("guest_runtimes", os.environ["GUEST_TARGET"], "lemma-guest-runtime-{}.zip"),
          ):
              archive = root / name.format(key)
              expected = manifest[kind][key]
              if hashlib.sha256(archive.read_bytes()).hexdigest() != expected["sha256"]:
                  raise SystemExit(f"{archive.name} digest mismatch")
              if archive.stat().st_size != expected["size"]:
                  raise SystemExit(f"{archive.name} size mismatch")
              if not expected["url"].endswith(f"/{archive.name}"):
                  raise SystemExit(f"{archive.name} URL does not name the asset")
          VERIFY
          cp desktop/runtime/download/lemma-local.json desktop/runtime/lemma-local.json

      - name: Bake splash concepts
        run: node desktop/scripts/extract-concepts.mjs

      - name: Verify baked splash concepts are committed
        run: git diff --exit-code desktop/ui/concepts.gen.json

      - name: Build native local sidecars
        run: desktop/scripts/build-sidecar.sh

      - name: Sign virtualization helper with its entitlement
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-signing.outputs.signing-identity }}
        run: |
          set -euo pipefail
          helper="desktop/binaries/lemma-vz-aarch64-apple-darwin"
          codesign --force --timestamp --options runtime \
            --entitlements desktop/entitlements.plist \
            --sign "${APPLE_SIGNING_IDENTITY}" \
            "${helper}"
          codesign --verify --strict --verbose=2 "${helper}"
          codesign -d --entitlements :- "${helper}" 2>&1 \
            | grep -F "com.apple.security.virtualization"

      - name: Read the pinned Tauri CLI
        run: |
          echo "TAURI_CLI=@tauri-apps/cli@$(tr -d '[:space:]' < desktop/scripts/tauri-cli-version.txt)" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the online DMG
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-signing.outputs.signing-identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npx -y "$TAURI_CLI" build --config tauri.online.conf.json
          mkdir -p target/release/release-artifacts
          dmg=(target/release/bundle/dmg/Lemma_*_aarch64.dmg)
          [[ "${#dmg[@]}" == 1 ]]
          mv "${dmg[0]}" \
            "target/release/release-artifacts/Lemma-nightly-${SHA:0:8}_aarch64.dmg"


      # Tauri notarizes and staples the .app, then builds the DMG from it and
      # only *signs* the DMG -- it never submits the DMG itself. An unstapled
      # DMG still passes Gatekeeper while Apple is reachable, because the app
      # inside carries its own ticket, but it fails closed on a machine that is
      # offline or behind a filtering proxy. Submitting the disk image too costs
      # seconds (everything inside it is already notarized) and makes the
      # download self-contained.
      - name: Notarize and staple the disk image
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Named, not globbed: the cargo target directory is cached
          # between runs, so a previous run's DMG is still sitting there
          # and `ls *.dmg` handed notarytool two paths.
          dmg="desktop/target/release/release-artifacts/Lemma-nightly-${GITHUB_SHA:0:8}_aarch64.dmg"
          xcrun notarytool submit "${dmg}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${dmg}"

      # Proved here so a tester never meets it as "Lemma is damaged".
      - name: Verify signature and notarization
        shell: bash
        run: |
          set -euo pipefail
          app="desktop/target/release/bundle/macos/Lemma.app"
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign -dvvv "${app}" 2>&1 | grep -F "Identifier=work.lemma.desktop"
          xcrun stapler validate "${app}"
          xcrun stapler validate \
            "desktop/target/release/release-artifacts/Lemma-nightly-${GITHUB_SHA:0:8}_aarch64.dmg"

      - name: Attach the DMG to the nightly prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          dmg="desktop/target/release/release-artifacts/Lemma-nightly-${GITHUB_SHA:0:8}_aarch64.dmg"
          gh release upload "${TAG}" "${dmg}" --clobber
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "${dmg}")"
          {
            echo "### Lemma Desktop nightly"
            echo
            echo "[Download the DMG](${url})"
          } >> "${GITHUB_STEP_SUMMARY}"

      # The nightly channel is a rolling window, not an archive. Every shared
      # build used to leave its prerelease behind for good: by 0.7.0 twelve had
      # accumulated, so most of the releases page was throwaway builds and the
      # newest real release had been pushed fifth from the top. Nothing reads a
      # nightly tag except the DMG built in the same run, and its own notes say
      # there is no upgrade path, so keeping them all bought nothing.
      #
      # Pruning here rather than beside the release's creation is deliberate.
      # By this point the new nightly is complete -- runtime assets and a
      # notarized, stapled DMG -- so the window never closes over older builds
      # in favour of one that turned out to be unusable.
      - name: Prune superseded nightly prereleases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "3"
        run: |
          # No -e: this is housekeeping running after the DMG is already
          # published. A GitHub API hiccup here must not report the nightly as
          # failed, so failures warn and the step still succeeds.
          set -uo pipefail
          # `if !` rather than a bare assignment: with pipefail a failed
          # listing yields an empty string, which is indistinguishable from
          # "there is nothing to prune" -- and reporting a broken API as a tidy
          # release page is how this quietly stops working.
          if ! stale="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq '.[]
                    | select(.prerelease and (.tag_name | startswith("desktop-nightly-")))
                    | [.created_at, .tag_name]
                    | @tsv' \
              | sort -r \
              | tail -n "+$((KEEP + 1))" \
              | cut -f2
          )"; then
            echo "::warning title=Could not list nightly prereleases::Nothing was pruned."
            exit 0
          fi
          if [[ -z "${stale}" ]]; then
            echo "Nothing to prune: ${KEEP} or fewer nightly prereleases exist."
            exit 0
          fi
          while read -r tag; do
            [[ -n "${tag}" ]] || continue
            # Re-checked rather than trusted, because the next line deletes a
            # release *and its tag*. A version tag reaching this loop would
            # destroy a real release, so a surprise here stops the step instead
            # of proceeding on the assumption that the filter above held.
            if [[ "${tag}" != desktop-nightly-* ]]; then
              echo "::error title=Refusing to delete a non-nightly release::${tag}"
              exit 1
            fi
            if gh release delete "${tag}" --cleanup-tag --yes; then
              echo "Pruned ${tag}"
            else
              echo "::warning title=Could not prune a nightly prerelease::${tag}"
            fi
          done <<< "${stale}"

      - name: Remove temporary signing keychain
        if: always() && steps.apple-signing.outcome == 'success'
        run: security delete-keychain "${{ steps.apple-signing.outputs.keychain-path }}"

  # Same run, same manifest, the other platform -- and deliberately a lesser
  # citizen than the macOS job above. Windows is not supported yet; the point of
  # this is to find out whether it runs at all, which nobody could do before,
  # because there was no way to get an installable Windows build.
  #
  # It looked like there was. CI's "Windows desktop build check" bundles an NSIS
  # installer on every desktop change -- but it uploads nothing, and it builds
  # against the committed placeholder manifest whose URLs are unresolvable by
  # design, so even a kept copy would refuse to install a runtime and say so.
  # That job proves the bundler runs. It cannot produce something installable.
  #
  # Nothing here is load-bearing: the job cannot fail the nightly, its output is
  # an artifact rather than a release asset, and it is unsigned. Each of those is
  # a decision to keep Windows out of the supported surface until it has been
  # tested end to end, not an oversight to tidy up later. Authenticode signing
  # already exists in release-desktop.yml for the day that changes.
  share-desktop-exe:
    name: Build nightly Windows installer
    if: github.event_name == 'workflow_dispatch' && inputs.share && !inputs.publish
    runs-on: windows-latest
    needs: manifest
    # Windows is not a supported platform yet, so it does not get a vote on
    # whether a nightly succeeded. A build that cannot produce an installer must
    # leave the macOS one -- the build people actually install -- green and
    # attached, and say so in the run rather than in the run's status.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo and desktop target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-share-cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-share-cargo-${{ runner.os }}-

      - name: Resolve nightly tag
        id: tag
        shell: bash
        run: echo "release_tag=desktop-nightly-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      # The same verification the macOS job does, for the same reason: the app
      # trusts this manifest to fetch its runtime, so the digests it names are
      # checked against the bytes actually published before anything is built.
      - name: Download and verify the published runtime manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.release_tag }}
          TARGET: x86_64-pc-windows-msvc
          GUEST_TARGET: windows-x86_64
        run: |
          New-Item -ItemType Directory -Force desktop/runtime/download | Out-Null
          gh release download "$env:TAG" `
            --pattern lemma-local.json `
            --pattern "lemma-host-pack-$env:TARGET.zip" `
            --pattern "lemma-guest-runtime-$env:GUEST_TARGET.zip" `
            --dir desktop/runtime/download `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download the nightly runtime for $env:TAG" }
          @'
          import hashlib, json, os
          from pathlib import Path
          root = Path("desktop/runtime/download")
          manifest = json.loads((root / "lemma-local.json").read_text())
          for kind, key, name in (
              ("host_packs", os.environ["TARGET"], "lemma-host-pack-{}.zip"),
              ("guest_runtimes", os.environ["GUEST_TARGET"], "lemma-guest-runtime-{}.zip"),
          ):
              archive = root / name.format(key)
              expected = manifest[kind][key]
              if hashlib.sha256(archive.read_bytes()).hexdigest() != expected["sha256"]:
                  raise SystemExit(f"{archive.name} digest mismatch")
              if archive.stat().st_size != expected["size"]:
                  raise SystemExit(f"{archive.name} size mismatch")
              if not expected["url"].endswith(f"/{archive.name}"):
                  raise SystemExit(f"{archive.name} URL does not name the asset")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Published runtime did not match its manifest" }
          Copy-Item desktop/runtime/download/lemma-local.json desktop/runtime/lemma-local.json -Force

      - name: Bake splash concepts
        run: node desktop/scripts/extract-concepts.mjs

      - name: Verify baked splash concepts are committed
        run: git diff --exit-code desktop/ui/concepts.gen.json

      - name: Build Windows sidecars
        shell: pwsh
        run: desktop/scripts/build-sidecar.ps1

      - name: Read the pinned Tauri CLI
        shell: pwsh
        run: |
          $v = (Get-Content desktop/scripts/tauri-cli-version.txt).Trim()
          "TAURI_CLI=@tauri-apps/cli@$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build online NSIS installer
        working-directory: desktop
        shell: pwsh
        env:
          SHA: ${{ github.sha }}
        run: |
          npx -y $env:TAURI_CLI build --config tauri.online.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Online NSIS build failed" }
          New-Item -ItemType Directory -Force target/release/release-artifacts | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis/Lemma_*_x64-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one online NSIS installer" }
          $short = $env:SHA.Substring(0, 8)
          Move-Item $installers[0].FullName `
            "target/release/release-artifacts/Lemma-nightly-${short}_x64-setup.exe"

      # The same ceiling the release build holds the online payload to. A
      # nightly that quietly shipped the whole runtime inside the installer
      # would not be testing the thing this is meant to test.
      - name: Enforce small online application payload
        shell: pwsh
        run: |
          $paths = @(
            "desktop/target/release/lemma-desktop.exe",
            "desktop/binaries/lemma-locald-x86_64-pc-windows-msvc.exe",
            "desktop/binaries/lemma-runtime-x86_64-pc-windows-msvc.exe",
            "desktop/runtime/lemma-local.json"
          )
          $bytes = ($paths | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Online payload is missing: $_" }
            (Get-Item $_).Length
          } | Measure-Object -Sum).Sum
          if ($bytes -gt 25MB) {
            throw "Expanded online application payload is $bytes bytes; limit is 25 MiB"
          }

      # Kept as a workflow artifact, never attached to the prerelease. Same
      # rule release-desktop.yml follows and for the same reason: an installer
      # sitting on a release page is an offer to support the platform, and
      # Windows is not supported yet. Whoever is testing it downloads it from
      # the run, which is exactly the audience it is for.
      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemma-desktop-windows-nightly-${{ github.sha }}
          path: desktop/target/release/release-artifacts/Lemma-nightly-*_x64-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Say where it is
        shell: pwsh
        env:
          SHA: ${{ github.sha }}
        run: |
          $short = $env:SHA.Substring(0, 8)
          @(
            "### Lemma Desktop nightly (Windows) -- experimental",
            "",
            "Not attached to the release: Windows is not a supported platform yet.",
            "Download ``lemma-desktop-windows-nightly-$env:SHA`` from this run's",
            "artifacts. Unsigned, so SmartScreen will interrupt the first launch."
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
