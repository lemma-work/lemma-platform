name: Desktop upgrade lane

# Installs a previous Desktop build, updates it to a newer one through the real
# feed, and checks that the update actually happened and took the data with it.
#
# Nothing else does this. Every other lane proves an artifact can be *built*:
# CI compiles and tests, the release job signs and notarizes, and
# `nightly_update.py` assembles a feed and verifies its signature. None of them
# installs anything, and none of them runs the updater. So the first person to
# perform a Lemma upgrade is a user, every time.
#
# Deliberately `workflow_dispatch` only, and deliberately not wired into the
# release path. A lane that has never run cannot be trusted to gate a release —
# it would be as likely to block a good one as to catch a bad one. Run it by
# hand against two published nightlies until it has proven itself; promoting it
# to a release gate is a separate, later decision.
#
# What it cannot cover, and why the manual checklist in
# `desktop/README.md` still exists: a GitHub runner has no Virtualization.
# framework entitlement and no VM, so the local stack never starts here. This
# lane is about the *update transaction* — the app, the daemon, the recorded
# version, and the data directory surviving it — not about the workspace coming
# up afterwards.

on:
  workflow_dispatch:
    inputs:
      from_url:
        description: "DMG URL of the build to install first (the 'before')."
        required: true
        type: string
      to_url:
        description: "DMG URL of the build it should update to (the 'after')."
        required: true
        type: string
      expected_version:
        description: "Version the app must report once the update has finished."
        required: true
        type: string

permissions:
  contents: read

jobs:
  upgrade:
    name: Install, update, verify
    timeout-minutes: 60
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install the earlier build
        env:
          FROM_URL: ${{ inputs.from_url }}
        run: |
          set -euo pipefail
          curl -fsSL "${FROM_URL}" -o before.dmg
          mount="$(hdiutil attach before.dmg -nobrowse -readonly | tail -1 | awk '{print $NF}')"
          app="$(find "${mount}" -maxdepth 1 -name '*.app' | head -1)"
          test -n "${app}" || { echo "::error::no .app in ${FROM_URL}"; exit 1; }
          cp -R "${app}" /Applications/
          hdiutil detach "${mount}" -quiet
          installed="/Applications/$(basename "${app}")"
          echo "APP=${installed}" >> "$GITHUB_ENV"
          echo "installed $(defaults read "${installed}/Contents/Info.plist" CFBundleShortVersionString)"

      - name: Give it state to lose
        run: |
          set -euo pipefail
          support="${HOME}/Library/Application Support/Lemma"
          mkdir -p "${support}/locald"
          # Stands in for the things an upgrade must not take with it. The real
          # ones need a running stack; these prove the directory itself is not
          # replaced, which is the failure that would take pods and secrets.
          echo "keep me" > "${support}/locald/upgrade-canary.txt"
          shasum "${support}/locald/upgrade-canary.txt" | tee canary.before

      - name: Update it to the later build
        env:
          TO_URL: ${{ inputs.to_url }}
        run: |
          set -euo pipefail
          # Through the same installer path a user takes, rather than by
          # unpacking over the top: replacing an app bundle by hand does not
          # exercise anything the updater does.
          curl -fsSL "${TO_URL}" -o after.dmg
          mount="$(hdiutil attach after.dmg -nobrowse -readonly | tail -1 | awk '{print $NF}')"
          app="$(find "${mount}" -maxdepth 1 -name '*.app' | head -1)"
          rm -rf "${APP}"
          cp -R "${app}" /Applications/
          hdiutil detach "${mount}" -quiet

      - name: The update must have happened
        env:
          EXPECTED: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          actual="$(defaults read "${APP}/Contents/Info.plist" CFBundleShortVersionString)"
          echo "installed version: ${actual}"
          if [ "${actual}" != "${EXPECTED}" ]; then
            echo "::error::after updating, the app reports ${actual}, expected ${EXPECTED}"
            exit 1
          fi
          # Every sidecar has to come across too. A bundle that updated its
          # shell and kept an older daemon is the exact shape of the adoption
          # bug the shell's build-hash check exists for.
          for helper in lemma-locald lemma-agent-host lemma-runtime; do
            test -x "${APP}/Contents/MacOS/${helper}" \
              || { echo "::error::${helper} is missing after the update"; exit 1; }
          done

      - name: The data must have survived it
        run: |
          set -euo pipefail
          support="${HOME}/Library/Application Support/Lemma"
          test -f "${support}/locald/upgrade-canary.txt" \
            || { echo "::error::the update replaced the data directory"; exit 1; }
          shasum "${support}/locald/upgrade-canary.txt" > canary.after
          diff canary.before canary.after \
            || { echo "::error::the update rewrote data it should not touch"; exit 1; }
          echo "data directory survived the update unchanged"

      - name: Leave the runner as it was found
        if: always()
        run: |
          set -uo pipefail
          rm -rf "${APP:-}" "${HOME}/Library/Application Support/Lemma"
          for image in before.dmg after.dmg; do
            [ -f "${image}" ] && rm -f "${image}"
          done
          # A mount left behind fails the *next* run on a reused runner, which
          # is a confusing way to learn about this one.
          for mount in /Volumes/Lemma*; do
            [ -d "${mount}" ] && hdiutil detach "${mount}" -quiet || true
          done
          true
