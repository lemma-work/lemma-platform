name: Contributor License Agreement

# Asks the author of every pull request to sign CLA.md once, by commenting
# the sentence it names, and records each signature in the `cla-signatures`
# branch (signatures/cla.json). A pull request whose authors have all signed
# gets a passing "CLAAssistant" status; one that has not gets a comment
# saying how to sign. The people who work on Lemma, and bots, are on the
# allowlist: their work is already ours to license.
#
# `pull_request_target`, so a fork's pull request gets a token that can
# comment and set a status. Safe here: nothing checks out or runs the pull
# request's code; the action reads only its authors and the comments.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
          && (github.event.comment.body == 'recheck'
              || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/lemma-work/lemma-platform/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: deepak-jha-kgp,anukuljha,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be reviewed, please read
            [the Contributor License Agreement](https://github.com/lemma-work/lemma-platform/blob/main/CLA.md)
            and sign it by commenting the sentence below. You only do this once.
          custom-allsigned-prcomment: Everyone on this pull request has signed the CLA. Thank you.
          lock-pullrequest-aftermerge: false
