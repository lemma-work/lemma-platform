name: Contributor License Agreement

# Asks everyone with a commit on a pull request to sign CLA.md once, by
# commenting the exact sentence below, and keeps the signatures in
# signatures/cla.json on the `cla-signatures` branch (a branch of its own,
# made on the first signature). Sets a "CLA" status on the pull request's
# head and keeps one comment on it saying who still has to sign. The people
# who work on Lemma, and bots, are on the allowlist.
#
# A script of our own rather than CLA Assistant Lite: that action's
# repository is archived, it read only the first 30 comments, and it took
# the sentence anywhere inside a comment. Here every page of comments is
# read, and only a comment that is the sentence, whole, signs.
#
# `pull_request_target`, so a fork's pull request gets a token that can
# comment, set a status and record a signature. Safe here: nothing checks
# out or runs the pull request's code; the script reads its commits'
# authors and its comments, and compares text.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: write

# One at a time across the repository: two signatures recorded at once would
# both write signatures/cla.json from the same starting point.
concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
          && (github.event.comment.body == 'recheck'
              || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const SENTENCE = 'I have read the CLA Document and I hereby sign the CLA';
            const DOC = 'https://github.com/lemma-work/lemma-platform/blob/main/CLA.md';
            const BRANCH = 'cla-signatures';
            const PATH = 'signatures/cla.json';
            const MARKER = '<!-- lemma-cla -->';
            const ALLOW = new Set(['deepak-jha-kgp', 'anukuljha', 'dependabot[bot]', 'github-actions[bot]']);
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.issue?.number;

            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            if (pr.state !== 'open') return;

            // Who has to sign: the author of every commit on the pull request.
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number, per_page: 100 });
            const authors = new Map();
            const unmatched = new Set();
            for (const commit of commits) {
              if (commit.author?.login) authors.set(commit.author.login, commit.author.id);
              else unmatched.add(commit.commit.author?.name || 'an unknown author');
            }

            // The record, on a branch of its own, made on first use.
            async function readRecord() {
              try {
                const found = (await github.rest.repos.getContent({ owner, repo, path: PATH, ref: BRANCH })).data;
                return { sha: found.sha, signatures: JSON.parse(Buffer.from(found.content, 'base64').toString('utf8')) };
              } catch (error) {
                if (error.status !== 404) throw error;
                return null;
              }
            }
            let record = await readRecord();
            if (!record) {
              const tree = await github.rest.git.createTree({ owner, repo, tree: [{ path: PATH, mode: '100644', type: 'blob', content: '[]\n' }] });
              const commit = await github.rest.git.createCommit({ owner, repo, message: 'Start the CLA signature record', tree: tree.data.sha, parents: [] });
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/' + BRANCH, sha: commit.data.sha });
              record = await readRecord();
            }
            const signed = new Set(record.signatures.map((one) => one.id));

            // Signatures on this pull request: every page of its comments, and
            // only a comment that is the sentence, whole, from someone who has
            // to sign.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const added = [];
            for (const comment of comments) {
              if ((comment.body || '').trim() !== SENTENCE) continue;
              const id = comment.user.id;
              if (authors.get(comment.user.login) !== id || signed.has(id)) continue;
              signed.add(id);
              added.push({ login: comment.user.login, id, signed_at: comment.created_at, pull_request: number, comment_id: comment.id });
            }
            if (added.length > 0) {
              const next = JSON.stringify([...record.signatures, ...added], null, 2) + '\n';
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: PATH, branch: BRANCH, sha: record.sha,
                message: 'Record CLA signatures from #' + number,
                content: Buffer.from(next, 'utf8').toString('base64'),
              });
            }

            const missing = [...authors].filter(([login, id]) => !ALLOW.has(login) && !signed.has(id)).map(([login]) => login);
            const done = missing.length === 0 && unmatched.size === 0;
            const waiting = [...missing.map((login) => '@' + login), ...unmatched];
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: 'CLA', target_url: DOC,
              state: done ? 'success' : 'failure',
              description: (done ? 'Everyone on this pull request has signed the CLA' : 'Still to sign: ' + waiting.join(', ').replace(/@/g, '')).slice(0, 140),
            });

            // One comment on the pull request, kept up to date.
            const lines = done
              ? ['Everyone on this pull request has signed the [Contributor License Agreement](' + DOC + '). Thank you.']
              : [
                  'Thanks for the pull request. Before it can be merged, please read [the Contributor License Agreement](' + DOC + ') and sign it by commenting exactly:',
                  '',
                  '> ' + SENTENCE,
                  '',
                  'You only do this once. Still to sign: ' + waiting.join(', ') + '.',
                  ...(unmatched.size > 0 ? ['', 'Some commits are by an author GitHub cannot match to an account. Make the commit email one on your GitHub account and push again.'] : []),
                ];
            const body = MARKER + '\n' + lines.join('\n');
            const mine = comments.find((comment) => comment.user.type === 'Bot' && (comment.body || '').startsWith(MARKER));
            if (mine) {
              if (mine.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else if (!done) {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
