name: Release Lemma Desktop

# Builds the signed online installer for macOS and Windows. The application
# contains only the native control plane and a release manifest; first launch
# downloads digest-pinned host and guest runtimes with visible progress.
#
# macOS is the only platform this publishes. Windows is still experimental and
# has not been tested end to end, so its installer is built, signed and kept as
# a workflow artifact for whoever is testing it -- but it is never attached to
# the release, because attaching it is what makes it an offer of support.
# Building it every release is deliberate: it is how the Windows paths keep
# compiling while the support work continues.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 0.6.0 or v0.6.0"
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: release-desktop-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  build-dmg:
    timeout-minutes: 120
    # Only version tags. `release: published` also fires for prereleases, and
    # the nightly Desktop builds publish one -- without this they would start an
    # official release build for a tag that has no version in it.
    if: startsWith(github.event.release.tag_name || format('v{0}', inputs.version), 'v')
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require fresh backend protected E2E
        uses: ./.github/actions/require-backend-protected-e2e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.sha }}

      - name: Import Developer ID certificate
        id: apple-signing
        uses: ./.github/actions/setup-apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Require notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_ID}" || -z "${APPLE_PASSWORD}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "::error::APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID are required for notarized macOS releases."
            exit 1
          fi

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ ! "${version}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver release tag: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Before the rewrite below, not only after it.
      #
      # The rewrite sets the desktop files to the tag, and the check that
      # follows it then compares every component against that tag -- so a tree
      # whose desktop version had drifted from the rest was silently corrected
      # and the *other* components were blamed. Asking first separates "this
      # commit is internally inconsistent" from "the tag does not match it",
      # which are different problems with different fixes.
      - name: Check the tree already agrees with itself
        run: python3 scripts/check_version_consistency.py

      - name: Set version in tauri.conf.json and Cargo.toml
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          version = os.environ["VERSION"]

          # tauri.conf.json — Tauri reads the bundle version from here.
          conf = pathlib.Path("desktop/tauri.conf.json")
          data = json.loads(conf.read_text())
          data["version"] = version
          conf.write_text(json.dumps(data, indent=2) + "\n")

          # desktop/Cargo.toml — [workspace.package] version, which every crate
          # in the desktop workspace inherits. Anchored to that table on
          # purpose: this manifest is also a [package] and also carries
          # [workspace.dependencies], so a bare ^version = would be a coin flip
          # over which one it rewrote.
          cargo = pathlib.Path("desktop/Cargo.toml")
          text, count = re.subn(
              r'(?ms)(^\[workspace\.package\].*?^version = ")[^"]+(")',
              lambda m: m.group(1) + version + m.group(2),
              cargo.read_text(),
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not set [workspace.package] version in desktop/Cargo.toml")
          cargo.write_text(text)

          # The committed placeholder runtime manifest. The app refuses a
          # runtime whose version disagrees with its own, and check_version_
          # consistency.py reads this file, so it moves with the tag.
          manifest = pathlib.Path("desktop/runtime/lemma-local.json")
          payload = json.loads(manifest.read_text())
          payload["version"] = version
          for group in ("host_packs", "guest_runtimes"):
              for entry in payload.get(group, {}).values():
                  entry["runtime_version"] = version
          manifest.write_text(json.dumps(payload, indent=2) + "\n")
          PY

      # Every Lemma-owned component must name the tag before anything is
      # published — the same gate release-lemma-python.yml and
      # release-lemma-typescript.yml already run. Desktop and the native crates
      # were the components it did not cover.
      - name: Check component versions agree with the tag
        run: python3 scripts/check_version_consistency.py --expect "${{ steps.version.outputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The Agent Host's ACP integration tests spawn a scripted Python agent over
      # stdio, and panic outright when there is no interpreter to spawn.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      # The same gate CI's "Desktop workspace" job applies, applied here because
      # CI's path filter skips that job whenever the release commit did not touch
      # desktop/** -- a backend-only release commit is the common case -- and CI
      # is green anyway, because "CI passed" treats a skipped suite as passing.
      # rustfmt compiles nothing, so it runs before the cache is warm; clippy and
      # the tests wait for the sidecars below, because tauri-build resolves the
      # externalBin sidecars at build-script time.
      - name: Check formatting
        working-directory: desktop
        run: cargo fmt --all --check

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          prefix-key: desktop-native
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Download and verify native runtime artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: aarch64-apple-darwin
          GUEST_TARGET: macos-aarch64
        run: |
          mkdir -p desktop/runtime/download
          for attempt in {1..60}; do
            if gh release download "v${VERSION}" \
              --pattern lemma-local.json \
              --pattern "lemma-host-pack-${TARGET}.zip" \
              --pattern "lemma-guest-runtime-${GUEST_TARGET}.zip" \
              --dir desktop/runtime/download \
              --clobber; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              # Which workflow, and what it is doing. These artifacts are
              # published by release-local-images.yml against the same tag, and
              # "not published within 30 minutes" on its own does not say
              # whether that workflow failed, never started, or is simply slow
              # -- three different things to do next.
              echo "::error::The native host pack for v${VERSION} was not \
              published within 30 minutes. release-local-images.yml is what \
              publishes it; its runs for this tag:" >&2
              gh run list --workflow=release-local-images.yml --limit 5 \
                --json displayTitle,status,conclusion,url \
                --jq '.[] | "  \(.status) \(.conclusion // "") \(.displayTitle) \(.url)"' >&2 \
                || echo "  (could not list runs)" >&2
              exit 1
            fi
            sleep 30
          done
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("desktop/runtime/download")
          manifest = json.loads((root / "lemma-local.json").read_text())
          target = os.environ["TARGET"]
          guest_target = os.environ["GUEST_TARGET"]
          archive = root / f"lemma-host-pack-{target}.zip"
          expected = manifest["host_packs"][target]
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected["sha256"] or archive.stat().st_size != expected["size"]:
              raise SystemExit("native host pack digest/size mismatch")
          guest = root / f"lemma-guest-runtime-{guest_target}.zip"
          expected_guest = manifest["guest_runtimes"][guest_target]
          actual_guest = hashlib.sha256(guest.read_bytes()).hexdigest()
          if actual_guest != expected_guest["sha256"] or guest.stat().st_size != expected_guest["size"]:
              raise SystemExit("managed guest runtime digest/size mismatch")
          PY
          cp desktop/runtime/download/lemma-local.json desktop/runtime/lemma-local.json

      - name: Bake splash concepts
        run: node desktop/scripts/extract-concepts.mjs

      - name: Verify baked splash concepts are committed
        run: git diff --exit-code desktop/ui/concepts.gen.json

      - name: Build native local sidecars
        # The telemetry key is compiled into locald here. Absent, install
        # telemetry stays off -- which is the behaviour every local build gets
        # and a safe default, but it means a release built without the secret
        # reports nothing about installs that fail on a new macOS version.
        env:
          LEMMA_TELEMETRY_KEY: ${{ secrets.LEMMA_TELEMETRY_KEY }}
        run: desktop/scripts/build-sidecar.sh

      - name: Lint
        working-directory: desktop
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --workspace --locked

      - name: Test native VM service transport
        run: swift test --package-path desktop/local-runtime/macos-vz

      - name: Settings behavior tests
        working-directory: desktop/ui-tests
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install chromium
          npm test
          npm run test:browser

      - name: Sign virtualization helper with its entitlement
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-signing.outputs.signing-identity }}
        run: |
          set -euo pipefail
          helper="desktop/binaries/lemma-vz-aarch64-apple-darwin"
          codesign --force --timestamp --options runtime \
            --entitlements desktop/local-runtime/macos-vz/lemma-vz.entitlements.plist \
            --sign "${APPLE_SIGNING_IDENTITY}" \
            "${helper}"
          codesign --verify --strict --verbose=2 "${helper}"
          codesign -d --entitlements :- "${helper}" 2>&1 \
            | grep -F "com.apple.security.virtualization"

      - name: Read the pinned Tauri CLI
        run: |
          echo "TAURI_CLI=@tauri-apps/cli@$(tr -d '[:space:]' < desktop/scripts/tauri-cli-version.txt)" >> "$GITHUB_ENV"

      - name: Require an updater signing key, and the public half to check it
        shell: bash
        env:
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_UPDATER_PRIVATE_KEY}" ]]; then
            echo "::error::TAURI_UPDATER_PRIVATE_KEY is required. Without it this \
          release ships an app that cannot be updated in place, and every user \
          who installs it is stranded on it." >&2
            exit 1
          fi
          # Both halves, because they fail at opposite ends and only one of them
          # was ever checked. The private key signs the artifact here; the public
          # key is what the *installed* app verifies with, and it is committed in
          # tauri.conf.json. An empty pubkey is not permissive -- `verify_signature`
          # decodes it and errors -- so a release built without it produces an app
          # whose every update attempt fails at the last step.
          pubkey="$(python3 -c "import json,sys; \
          print(json.load(open('desktop/tauri.conf.json'))['plugins']['updater']['pubkey'])")"
          if [[ -z "${pubkey}" ]]; then
            echo "::error::desktop/tauri.conf.json has an empty updater pubkey. \
          Generate the keypair with 'tauri signer generate', commit the public \
          half here, and store the private half as TAURI_UPDATER_PRIVATE_KEY." >&2
            exit 1
          fi

      - name: Verify credential access across signed helper updates
        shell: bash
        env:
          LEMMA_SIGNING_TEST_IDENTITY: ${{ steps.apple-signing.outputs.signing-identity }}
          LEMMA_SIGNING_TEST_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${LEMMA_SIGNING_TEST_IDENTITY}"
          test -n "${LEMMA_SIGNING_TEST_TEAM}"
          python3 -m unittest discover -s desktop/scripts -p test_check_macos_signing.py

      - name: Build online DMG
        working-directory: desktop
        # The updater overlay is merged only for update-capable builds. CI's
        # build checks and `make desktop-dmg` have no updater signing key and
        # would fail if the base config demanded one.
        run: |
          set -euo pipefail
          npx -y "$TAURI_CLI" build \
            --config tauri.online.conf.json \
            --config tauri.updater.conf.json
          # Emptied, not just created. This lives under `desktop/target`, which
          # `Swatinem/rust-cache` restores, so a file left by an earlier run of
          # an earlier commit could still be here -- and both the upload globs
          # below and the evidence manifest take whatever they find. A stale
          # DMG would be published as this release's, and recorded as such.
          rm -rf target/release/release-artifacts
          mkdir -p target/release/release-artifacts
          dmg=(target/release/bundle/dmg/Lemma_*_aarch64.dmg)
          [[ "${#dmg[@]}" == 1 ]]
          mv "${dmg[0]}" \
            "target/release/release-artifacts/Lemma_${VERSION}_aarch64-online.dmg"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-signing.outputs.signing-identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
          LEMMA_RELEASE_CHANNEL: stable
          LEMMA_BUILD_SHA: ${{ github.sha }}


      # Tauri notarizes and staples the .app, then builds the DMG from it and
      # only *signs* the DMG -- it never submits the DMG itself. An unstapled
      # DMG still passes Gatekeeper while Apple is reachable, because the app
      # inside carries its own ticket, but it fails closed on a machine that is
      # offline or behind a filtering proxy. Submitting the disk image too costs
      # seconds (everything inside it is already notarized) and makes the
      # download self-contained.
      - name: Notarize and staple the disk image
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg="$(ls desktop/target/release/release-artifacts/Lemma_*_aarch64-online.dmg)"
          xcrun notarytool submit "${dmg}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${dmg}"

      - name: Verify Developer ID signatures and notarization staples
        shell: bash
        # Every check here used to be a bare `test`/`codesign` line under
        # `set -e`: silent on success, and silent on failure too -- a run that
        # failed gave no indication of which assertion tripped, on a bundle
        # that had already been built, signed and notarized. `check` below
        # prints a result for every assertion, runs all of them instead of
        # stopping at the first failure (so one run reports every problem, not
        # just the first), and raises a `::error::` annotation GitHub surfaces
        # on the job itself. A step that fails must say why.
        run: |
          set -uo pipefail
          app="desktop/target/release/bundle/macos/Lemma.app"
          locald="${app}/Contents/MacOS/lemma-locald"
          runtime_bridge="${app}/Contents/MacOS/lemma-runtime"
          vz="${app}/Contents/Resources/lemma-vz"
          dmg="desktop/target/release/release-artifacts/Lemma_${VERSION}_aarch64-online.dmg"

          failed=0
          check() {
            local description="$1"
            shift
            if "$@" >/tmp/check-output 2>&1; then
              echo "ok: ${description}"
            else
              echo "::error::${description} -- failed: $*"
              sed 's/^/    /' /tmp/check-output
              failed=1
            fi
          }
          check_grep() {
            local description="$1" pattern="$2"
            shift 2
            local output
            if output="$("$@" 2>&1)" && grep -qF "${pattern}" <<<"${output}"; then
              echo "ok: ${description}"
            else
              echo "::error::${description} -- expected to find '${pattern}' in: $*"
              sed 's/^/    /' <<<"${output}"
              failed=1
            fi
          }
          # The inverse of check_grep, for a privilege that must not be there.
          # A command that fails is still a failure: an entitlements dump that
          # errors proves nothing, and "no match" would otherwise read as a
          # pass.
          check_absent() {
            local description="$1" pattern="$2"
            shift 2
            local output
            if ! output="$("$@" 2>&1)"; then
              echo "::error::${description} -- could not be checked: $*"
              sed 's/^/    /' <<<"${output}"
              failed=1
            elif grep -qF "${pattern}" <<<"${output}"; then
              echo "::error::${description} -- found '${pattern}' in: $*"
              sed 's/^/    /' <<<"${output}"
              failed=1
            else
              echo "ok: ${description}"
            fi
          }
          # Exact whole-line match, for values (like an identifier) where a
          # substring match would also accept "work.lemma.locald.staging".
          check_grep_exact() {
            local description="$1" pattern="$2"
            shift 2
            local output
            if output="$("$@" 2>&1)" && grep -qFx "${pattern}" <<<"${output}"; then
              echo "ok: ${description}"
            else
              echo "::error::${description} -- expected a line exactly matching '${pattern}' in: $*"
              sed 's/^/    /' <<<"${output}"
              failed=1
            fi
          }

          echo "--- Contents/MacOS ---"
          ls -la "${app}/Contents/MacOS/" || true
          echo "--- Contents/Resources ---"
          ls -la "${app}/Contents/Resources/" || true

          check "locald is executable" test -x "${locald}"
          check "runtime bridge is executable" test -x "${runtime_bridge}"
          check "vz helper is executable" test -x "${vz}"
          check "vz is not also an externalBin copy in Contents/MacOS" test ! -e "${app}/Contents/MacOS/lemma-vz"
          check "no legacy lemma-supervisor binary" test ! -e "${app}/Contents/MacOS/lemma-supervisor"
          check "no legacy bundled uv binary" test ! -e "${app}/Contents/MacOS/uv"

          check "online application payload" python3 desktop/scripts/check_online_payload.py --macos-app "${app}"

          check "app bundle codesign verifies" codesign --verify --deep --strict --verbose=2 "${app}"
          check "app and helpers preserve the release team and identifiers" \
            python3 desktop/scripts/check_macos_signing.py "${app}" --team-id "${APPLE_TEAM_ID}"
          check "locald codesign verifies" codesign --verify --strict --verbose=2 "${locald}"
          check "runtime bridge codesign verifies" codesign --verify --strict --verbose=2 "${runtime_bridge}"
          check "vz codesign verifies" codesign --verify --strict --verbose=2 "${vz}"

          check_grep "app is signed with a Developer ID Application identity" \
            "Authority=Developer ID Application:" codesign -dvvv "${app}"
          # The daemon's keychain access is keyed to this identifier, and Tauri
          # re-signs sidecars without one of its own -- so this asserts the
          # embedded Info.plist survived bundling. If it ever does not, the app
          # still ships and still works, and every user is asked to re-authorise
          # access to their own secrets on the first launch of each release.
          check_grep_exact "locald kept its embedded Info.plist identifier" \
            "Identifier=work.lemma.locald" codesign -dvvv "${locald}"
          check_grep "vz helper has the virtualization entitlement" \
            "com.apple.security.virtualization" codesign -d --entitlements :- "${vz}"
          # And nothing else does. Tauri applies one entitlements file to the
          # app and to every externalBin it signs, so the app's file used to
          # hand this to four processes -- including the one that hosts a
          # WebView -- for a capability only lemma-vz can use. lemma-vz keeps
          # it because it ships as a resource, which Tauri does not re-sign.
          check_absent "the app and its sidecars do not carry it" \
            "com.apple.security.virtualization" \
            codesign -d --entitlements :- "${app}"
          for signed_with_the_app in "${locald}" "${runtime_bridge}" \
              "${app}/Contents/MacOS/lemma-agent-host"; do
            check_absent "$(basename "${signed_with_the_app}") does not carry it" \
              "com.apple.security.virtualization" \
              codesign -d --entitlements :- "${signed_with_the_app}"
          done

          check "app passes stapler validation" xcrun stapler validate "${app}"
          check "dmg passes stapler validation" xcrun stapler validate "${dmg}"

          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::Desktop bundle verification failed -- see the errors above"
            exit 1
          fi
          echo "All Desktop bundle verification checks passed."
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify native credentials with the packaged release daemon
        env:
          LEMMA_NATIVE_CREDENTIAL_TEST_BINARY: desktop/target/release/bundle/macos/Lemma.app/Contents/MacOS/lemma-locald
          LEMMA_SIGNING_TEST_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 -m unittest discover -s desktop/scripts -p test_native_credentials.py

      # Tauri notarizes and staples the .app, then tars it. That ordering is
      # believed, not documented -- and an update payload that is not notarized
      # installs an app Gatekeeper then refuses, on a machine that was working
      # before it updated. Asserted rather than assumed.
      - name: Verify the updater payload is notarized
        shell: bash
        run: |
          set -euo pipefail
          tarball="desktop/target/release/bundle/macos/Lemma.app.tar.gz"
          test -f "${tarball}"
          workdir="$(mktemp -d)"
          tar -xzf "${tarball}" -C "${workdir}"
          app="${workdir}/Lemma.app"
          codesign --verify --deep --strict --verbose=2 "${app}"
          xcrun stapler validate "${app}"
          spctl -a -t exec -vv "${app}"

      - name: Publish the update feed
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          # A prerelease must never become the feed every stable install
          # follows. GitHub's `latest` alias already excludes prereleases, so
          # this is the second of two independent guards.
          if [[ "${PRERELEASE}" == "true" ]]; then
            echo "Prerelease: the DMG is attached, the update feed is not."
            exit 0
          fi
          artifacts="desktop/target/release/release-artifacts"
          tarball="desktop/target/release/bundle/macos/Lemma.app.tar.gz"
          cp "${tarball}" "${artifacts}/Lemma_${VERSION}_aarch64.app.tar.gz"
          cp "${tarball}.sig" "${artifacts}/Lemma_${VERSION}_aarch64.app.tar.gz.sig"
          # The two halves are checked for presence long before this point, and
          # never for being halves of the same pair. A rotated private key, or a
          # tauri.conf.json restored from an older branch, publishes a release
          # that is signed, notarized and complete, and whose every update the
          # installed base rejects at the last step.
          python3 desktop/scripts/check_updater_key.py \
            --signature-file "${artifacts}/Lemma_${VERSION}_aarch64.app.tar.gz.sig"
          python3 - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone

          version = os.environ["VERSION"]
          repository = os.environ["REPOSITORY"]
          artifacts = pathlib.Path("desktop/target/release/release-artifacts")
          # The signature is the *contents* of the .sig file. A path or a URL
          # here produces a feed nothing can verify, and the failure only shows
          # up on a user's machine.
          signature = (artifacts / f"Lemma_{version}_aarch64.app.tar.gz.sig").read_text().strip()

          # Carried alongside the standard fields so the app can warn about a
          # data-incompatible upgrade *before* downloading half a gigabyte. The
          # updater ignores unknown top-level keys.
          manifest = json.loads(pathlib.Path("desktop/runtime/lemma-local.json").read_text())
          host = manifest["host_packs"]["aarch64-apple-darwin"]
          guest = manifest["guest_runtimes"]["macos-aarch64"]
          postgres = manifest.get("infra", {}).get("postgres", "")
          major = None
          if "-pg" in postgres:
              digits = postgres.split("-pg")[1].split("@")[0].split(".")[0]
              major = int(digits) if digits.isdigit() else None

          feed = {
              "version": version,
              "pub_date": datetime.now(timezone.utc).isoformat(),
              "notes": f"https://github.com/{repository}/releases/tag/v{version}",
              "platforms": {
                  "darwin-aarch64": {
                      "url": (
                          f"https://github.com/{repository}/releases/download/"
                          f"v{version}/Lemma_{version}_aarch64.app.tar.gz"
                      ),
                      "signature": signature,
                  }
              },
              "lemma": {
                  "postgres_major": major,
                  "runtime_download_bytes": host["size"] + guest["size"],
              },
          }
          (artifacts / "latest.json").write_text(json.dumps(feed, indent=2) + "\n")
          PY
          echo "Update feed:"
          cat "${artifacts}/latest.json"

      # Written after everything is built, signed, notarized and verified, and
      # before anything is published -- so it describes what is actually about
      # to be attached, and `--verify` re-reads it against those exact files.
      #
      # It answers what the release page cannot: whether the DMG on somebody's
      # laptop is the DMG we published, which release a given file belongs to,
      # and which identity and updater key this build carries. A user reporting
      # a bug could not tell us what they installed, and neither could we.
      - name: Record what this release publishes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifacts="desktop/target/release/release-artifacts"
          # The same inputs, so `--verify` compares the manifest with this
          # release rather than with its own claims. Hashes alone prove the
          # files match the manifest; they say nothing about whether the
          # manifest describes the release being published.
          evidence=(
            --version "${VERSION}"
            --commit "${GITHUB_SHA}"
            --repository "${GITHUB_REPOSITORY}"
          )
          python3 desktop/scripts/build_release_evidence.py "${artifacts}" \
            "${evidence[@]}" \
            --app "desktop/target/release/bundle/macos/Lemma.app"
          python3 desktop/scripts/build_release_evidence.py "${artifacts}" \
            "${evidence[@]}" --verify

      - name: Upload online DMG to release
        uses: softprops/action-gh-release@v3
        with:
          # Name the tag rather than letting the action infer it. On
          # `release: published` it reads the tag off the event payload, but on
          # `workflow_dispatch` there is no release in the payload and it falls
          # back to `github.ref` — `refs/heads/main` for a dispatch, which is
          # not a tag, so the upload failed with "GitHub Releases requires a
          # tag" *after* the DMG had been built, signed, notarized and
          # verified. Dispatch is how a release is repaired when the publish
          # event does not fire (a release created by GITHUB_TOKEN does not
          # trigger workflows), so that path has to be able to attach.
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            desktop/target/release/release-artifacts/Lemma_*_aarch64-*.dmg
            desktop/target/release/release-artifacts/Lemma_*_aarch64.app.tar.gz
            desktop/target/release/release-artifacts/Lemma_*_aarch64.app.tar.gz.sig
            desktop/target/release/release-artifacts/latest.json
            desktop/target/release/release-artifacts/release-evidence.json

      # The feed is only real once it is fetchable at the URL every installed
      # app polls. A malformed or unreachable one is silent: installs simply
      # never update, and nobody finds out until a fix needs to reach them.
      - name: Verify the published update feed
        if: github.event.release.prerelease != true
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          feed="https://github.com/${REPOSITORY}/releases/latest/download/latest.json"
          # GitHub takes a moment to re-point `latest` after a publish.
          for attempt in {1..10}; do
            if body="$(curl -fsSL "${feed}")"; then
              break
            fi
            if [[ "${attempt}" == 10 ]]; then
              echo "::error::The update feed is not reachable at ${feed}" >&2
              exit 1
            fi
            sleep 15
          done
          printf '%s' "${body}" | python3 -c '
          import json, os, sys, urllib.request
          feed = json.load(sys.stdin)
          version = os.environ["VERSION"]
          feed_version = feed["version"]
          if feed_version != version:
              raise SystemExit(f"feed names {feed_version}, expected {version}")
          entry = feed["platforms"]["darwin-aarch64"]
          if not entry["signature"].strip():
              raise SystemExit("the feed carries an empty signature")
          request = urllib.request.Request(entry["url"], method="HEAD")
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise SystemExit(f"update payload is not downloadable: {response.status}")
          print("update feed verified:", feed["version"])
          '

      # GitHub re-points `latest` the moment a non-prerelease is published, and
      # this workflow runs *after* that -- so between the publish and the step
      # above, `releases/latest/download/latest.json` resolves to a release that
      # does not have one yet. Every installed app polls exactly that URL, so a
      # release that fails anywhere in between (notarization, the runtime-asset
      # wait, signing) leaves the whole stable channel unable to check for
      # updates, and the previous good feed unreachable behind it.
      #
      # Marking the release a prerelease hands `latest` back to the last release
      # that does have a feed. It is reversible in one click once the release is
      # repaired, and it is the only action here that restores the invariant
      # without republishing anything.
      - name: Hand `latest` back to the previous release if this one has no feed
        if: failure() && github.event.release.prerelease != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          # No -e: this runs because something already failed, and its own
          # failure must not replace that one in the log.
          set -uo pipefail
          if gh release view "${TAG}" --json assets \
              --jq '.assets[].name' 2>/dev/null | grep -qx 'latest.json'; then
            echo "${TAG} already carries a feed; leaving it as the latest release."
            exit 0
          fi
          echo "::warning title=Demoting a release with no update feed::" \
               "${TAG} failed before publishing latest.json. Marking it a" \
               "prerelease so installed apps keep seeing the previous feed."
          gh release edit "${TAG}" --prerelease \
            || echo "::error title=Could not demote ${TAG}::" \
                    "The stable update feed may be unreachable until this is fixed by hand."

      - name: Remove temporary signing keychain
        if: always() && steps.apple-signing.outcome == 'success'
        run: security delete-keychain "${{ steps.apple-signing.outputs.keychain-path }}"

  build-windows:
    timeout-minutes: 120
    # Only version tags. `release: published` also fires for prereleases, and
    # the nightly Desktop builds publish one -- without this they would start an
    # official release build for a tag that has no version in it.
    if: startsWith(github.event.release.tag_name || format('v{0}', inputs.version), 'v')
    runs-on: windows-latest
    # Same posture as release-local-images.yml: this installer is built and kept
    # for whoever is testing it and is never attached to a release, so a missing
    # certificate must not fail the run. Signing happens when the secrets exist
    # and is skipped, loudly, when they do not. `secrets` cannot be read from a
    # step `if`, so availability resolves once here.
    env:
      WINDOWS_SIGNING_AVAILABLE: >-
        ${{ secrets.WINDOWS_CERTIFICATE != ''
        && secrets.WINDOWS_CERTIFICATE_PASSWORD != ''
        && secrets.WINDOWS_TIMESTAMP_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require fresh backend protected E2E
        uses: ./.github/actions/require-backend-protected-e2e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.sha }}

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ ! "${version}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver release tag: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set version in Tauri and Cargo manifests
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          import json, os, pathlib, re
          version = os.environ["VERSION"]

          # tauri.conf.json — Tauri reads the bundle version from here.
          conf = pathlib.Path("desktop/tauri.conf.json")
          data = json.loads(conf.read_text())
          data["version"] = version
          conf.write_text(json.dumps(data, indent=2) + "\n")

          # desktop/Cargo.toml — [workspace.package] version, which every crate
          # in the desktop workspace inherits. Anchored to that table on
          # purpose: this manifest is also a [package] and also carries
          # [workspace.dependencies], so a bare ^version = would be a coin flip
          # over which one it rewrote.
          cargo = pathlib.Path("desktop/Cargo.toml")
          text, count = re.subn(
              r'(?ms)(^\[workspace\.package\].*?^version = ")[^"]+(")',
              lambda m: m.group(1) + version + m.group(2),
              cargo.read_text(),
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not set [workspace.package] version in desktop/Cargo.toml")
          cargo.write_text(text)

          # The committed placeholder runtime manifest. The app refuses a
          # runtime whose version disagrees with its own, and check_version_
          # consistency.py reads this file, so it moves with the tag.
          manifest = pathlib.Path("desktop/runtime/lemma-local.json")
          payload = json.loads(manifest.read_text())
          payload["version"] = version
          for group in ("host_packs", "guest_runtimes"):
              for entry in payload.get(group, {}).values():
                  entry["runtime_version"] = version
          manifest.write_text(json.dumps(payload, indent=2) + "\n")

      # Every Lemma-owned component must name the tag before anything is
      # published — the same gate release-lemma-python.yml and
      # release-lemma-typescript.yml already run. Desktop and the native crates
      # were the components it did not cover.
      - name: Check component versions agree with the tag
        run: python3 scripts/check_version_consistency.py --expect "${{ steps.version.outputs.version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Report unsigned Windows build
        if: env.WINDOWS_SIGNING_AVAILABLE != 'true'
        shell: bash
        run: |
          echo "::warning title=Windows Desktop build is unsigned::\
          WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD and \
          WINDOWS_TIMESTAMP_URL are not all configured. This installer is \
          built unsigned and is not attached to the release. macOS is \
          unaffected."

      - name: Import Windows code-signing certificate
        if: env.WINDOWS_SIGNING_AVAILABLE == 'true'
        id: windows-signing
        uses: ./.github/actions/setup-windows-signing
        with:
          certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          certificate-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          timestamp-url: ${{ secrets.WINDOWS_TIMESTAMP_URL }}

      - name: Configure Tauri Authenticode signing
        if: env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: python
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          import json, os, pathlib

          for name in ("tauri.online.conf.json", "tauri.dist.conf.json"):
              path = pathlib.Path("desktop") / name
              config = json.loads(path.read_text())
              windows = config.setdefault("bundle", {}).setdefault("windows", {})
              windows.update({
                  "certificateThumbprint": os.environ["CERTIFICATE_THUMBPRINT"],
                  "digestAlgorithm": "sha256",
                  "timestampUrl": os.environ["WINDOWS_TIMESTAMP_URL"],
                  "tsp": True,
              })
              path.write_text(json.dumps(config, indent=2) + "\n")

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          prefix-key: desktop-native
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Download and verify native runtime artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: x86_64-pc-windows-msvc
          GUEST_TARGET: windows-x86_64
        run: |
          New-Item -ItemType Directory -Force desktop/runtime/download | Out-Null
          $downloaded = $false
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            gh release download "v$env:VERSION" `
              --pattern lemma-local.json `
              --pattern "lemma-host-pack-$env:TARGET.zip" `
              --pattern "lemma-guest-runtime-$env:GUEST_TARGET.zip" `
              --dir desktop/runtime/download `
              --clobber
            if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
            Start-Sleep -Seconds 30
          }
          if (-not $downloaded) { throw "Native host pack was not published within 30 minutes" }
          @'
          import hashlib, json, os
          from pathlib import Path
          root = Path("desktop/runtime/download")
          manifest = json.loads((root / "lemma-local.json").read_text())
          target = os.environ["TARGET"]
          guest_target = os.environ["GUEST_TARGET"]
          archive = root / f"lemma-host-pack-{target}.zip"
          expected = manifest["host_packs"][target]
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected["sha256"] or archive.stat().st_size != expected["size"]:
              raise SystemExit("native host pack digest/size mismatch")
          guest = root / f"lemma-guest-runtime-{guest_target}.zip"
          expected_guest = manifest["guest_runtimes"][guest_target]
          actual_guest = hashlib.sha256(guest.read_bytes()).hexdigest()
          if actual_guest != expected_guest["sha256"] or guest.stat().st_size != expected_guest["size"]:
              raise SystemExit("managed guest runtime digest/size mismatch")
          '@ | python -
          Copy-Item desktop/runtime/download/lemma-local.json desktop/runtime/lemma-local.json -Force

      - name: Bake splash concepts
        run: node desktop/scripts/extract-concepts.mjs

      - name: Verify baked splash concepts are committed
        run: git diff --exit-code desktop/ui/concepts.gen.json

      - name: Build Windows sidecars
        shell: pwsh
        run: desktop/scripts/build-sidecar.ps1

      - name: Lint Windows desktop
        working-directory: desktop
        run: cargo clippy --workspace --exclude lemma-guestd --locked --all-targets -- -D warnings

      - name: Test Windows desktop
        working-directory: desktop
        run: cargo test --workspace --exclude lemma-guestd --locked

      - name: Settings behavior tests
        working-directory: desktop/ui-tests
        shell: bash
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install chromium
          npm test
          npm run test:browser

      - name: Sign native runtime bridge
        if: env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            -ErrorAction Stop |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "Windows SDK signtool.exe was not found" }
          $runtimeExecutables = @("desktop/binaries/lemma-runtime-x86_64-pc-windows-msvc.exe")
          foreach ($path in $runtimeExecutables) {
            if (-not (Test-Path $path)) { throw "Native runtime executable is missing: $path" }
            & $signTool.FullName sign `
              /sha1 $env:CERTIFICATE_THUMBPRINT `
              /fd SHA256 `
              /tr $env:WINDOWS_TIMESTAMP_URL `
              /td SHA256 `
              $path
            if ($LASTEXITCODE -ne 0) { throw "Could not sign native runtime executable: $path" }
          }

      - name: Read the pinned Tauri CLI
        shell: pwsh
        run: |
          $v = (Get-Content desktop/scripts/tauri-cli-version.txt).Trim()
          "TAURI_CLI=@tauri-apps/cli@$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build online NSIS installer
        working-directory: desktop
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx -y $env:TAURI_CLI build --config tauri.online.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Online NSIS build failed" }
          New-Item -ItemType Directory -Force target/release/release-artifacts | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis/Lemma_*_x64-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one online NSIS installer" }
          Move-Item $installers[0].FullName `
            "target/release/release-artifacts/Lemma_${env:VERSION}_x64-online-setup.exe"

      - name: Verify Authenticode signatures
        if: env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
        run: |
          # Whose signature, not merely that there is one. `Status -eq "Valid"`
          # says the chain checks out against the machine's trust store, which
          # every certificate a GitHub runner already trusts also satisfies --
          # so a binary signed by anyone at all passed this step. The
          # thumbprint is the same one the signing step passed to signtool, so
          # a mismatch means something other than our certificate signed a
          # file we are about to ship.
          $expected = $env:CERTIFICATE_THUMBPRINT
          if ([string]::IsNullOrWhiteSpace($expected)) {
            throw "Signing is available but no publisher thumbprint was published to verify against"
          }
          $paths = @(
            "desktop/target/release/lemma-desktop.exe",
            "desktop/binaries/lemma-locald-x86_64-pc-windows-msvc.exe",
            # The Agent Host runs the user's coding agents with their
            # credentials and was the one shipped executable nothing here
            # checked. It is bundled by the same `externalBin` list as the
            # other two, so an unsigned one is a build problem, not a missing
            # step -- which is exactly what this is for.
            "desktop/binaries/lemma-agent-host-x86_64-pc-windows-msvc.exe",
            "desktop/binaries/lemma-runtime-x86_64-pc-windows-msvc.exe"
          )
          $installers = Get-ChildItem `
            "desktop/target/release/release-artifacts/Lemma_*_x64-*-setup.exe" `
            -ErrorAction Stop
          if (@($installers).Count -ne 1) { throw "Expected one online installer" }
          $paths += $installers.FullName
          foreach ($path in $paths) {
            if (-not (Test-Path $path)) { throw "Signed release binary is missing: $path" }
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $path`: $($signature.StatusMessage)"
            }
            $signer = $signature.SignerCertificate.Thumbprint
            if ($signer -ne $expected) {
              throw "Unexpected Authenticode signer for $path`: $signer, expected $expected"
            }
          }

      - name: Enforce small online application payload
        shell: pwsh
        run: |
          python desktop/scripts/check_online_payload.py --windows-root desktop

      # Deliberately an artifact, not a release asset. See the note at the top
      # of this file: Windows is experimental and is not published yet.
      - name: Keep the Windows installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: lemma-desktop-windows-${{ steps.version.outputs.version }}
          path: desktop/target/release/release-artifacts/Lemma_*_x64-*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Remove Windows code-signing certificate
        if: always() && steps.windows-signing.outcome == 'success'
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_THUMBPRINT)) {
            Remove-Item `
              "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" `
              -Force `
              -ErrorAction SilentlyContinue
          }
