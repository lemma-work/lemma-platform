name: Windows Agent Host smoke

# Validates that the lemma CLI works on a real Windows kernel — the `uv tool
# install` path plus the `lemma agent-host` command surface. This exercises the
# Windows-specific code that cannot be run on the Linux/macOS dev machines:
# console encoding, path handling, and the Agent Host service paths (schtasks).
#
# Triggers:
#   * push to main           — post-merge gate (only when CLI files change)
#   * PR labelled `windows-ci`— opt-in per-PR run (add the label to test a branch)
#   * manual workflow_dispatch
on:
  push:
    branches: [main]
    paths:
      - 'lemma-cli/**'
      - 'lemma-skills/**'
      - '.github/workflows/windows-agent-host.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-agent-host-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-agent-host:
    name: Windows Agent Host CLI
    # Always on push/dispatch; on PRs only when the `windows-ci` label is present.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'windows-ci')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install lemma-cli (uv tool — the real user install path)
        run: uv tool install --force ./lemma-cli

      - name: Put lemma on PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value (uv tool dir --bin)

      - name: Smoke — version / servers / auth status
        run: |
          $ErrorActionPreference = "Stop"
          lemma --version
          if ($LASTEXITCODE -ne 0) { throw "lemma --version exited $LASTEXITCODE" }
          lemma servers list
          if ($LASTEXITCODE -ne 0) { throw "lemma servers list exited $LASTEXITCODE" }
          # auth status exits 1 when logged out — that is expected; it just must
          # not crash with a Windows-incompatibility error.
          lemma auth status
          if ($LASTEXITCODE -notin 0, 1) { throw "lemma auth status exited $LASTEXITCODE" }
          Write-Host "smoke commands ok"
          exit 0

      - name: Agent Host command surface
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Pairing needs a signed-in user and running a host needs an installed
          # harness, so CI asserts the command surface resolves rather than
          # driving a real host.
          lemma agent-host --help
          if ($LASTEXITCODE -ne 0) { throw "agent-host --help exited $LASTEXITCODE" }
          $help = (lemma agent-host --help | Out-String)
          foreach ($cmd in @("connect", "harnesses", "status", "start", "stop", "doctor")) {
            if ($help -notmatch $cmd) { throw "agent-host is missing the '$cmd' command" }
          }
          Write-Host "agent-host command surface OK"
