name: Release Agent Host

# Builds and publishes the native `lemma-agent-host` binaries that
# `lemma agent-host` downloads on first use.
#
# The asset contract is defined by lemma-cli/lemma_cli/agent_host/bootstrap.py
# and MUST NOT drift from it:
#
#   base url : https://github.com/lemma-work/lemma-platform/releases/download/v{lemma_cli.__version__}
#   asset    : lemma-agent-host-<rust target triple>[.exe on windows]   (bare binary, not an archive)
#   checksum : <asset name>.sha256, first whitespace field is a 64-char sha256 hex digest
#   size cap : 128 MiB (_MAX_BINARY_BYTES); checksum file cap 4 KiB (_MAX_CHECKSUM_BYTES)
#
# The triples come from bootstrap._target_triple(): {aarch64,x86_64}-apple-darwin,
# {aarch64,x86_64}-unknown-linux-gnu, and x86_64-pc-windows-msvc. Every triple that
# function can return is built here — otherwise those users get a bare 404 instead of
# the "not released for this platform" message.
#
# The build jobs deliberately upload the raw `cargo` output under a per-target
# artifact name and let `publish` do all of the renaming and hashing, so the asset
# naming contract lives in exactly one place in this file.
#
# Triggers:
#   * release: published — real releases get their assets automatically
#   * workflow_dispatch  — build any version by hand, download the artifacts from the
#                          run, and (by default) attach them to an existing release so
#                          the real `lemma agent-host install` download path can be
#                          exercised end to end. Dispatch never creates a release.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 0.6.2 or v0.6.2"
        required: true
        type: string
      attach_to_release:
        description: "Attach the binaries to the existing v<version> release (never creates one)"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release-agent-host-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  # The highest glibc symbol version the published Linux binaries may require.
  # Enforced against the built ELF below, not just asserted in prose.
  MAX_GLIBC: "2.34"

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if [[ ! "${version}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver release tag: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Warn when the checked-out CLI version differs
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          import os
          import pathlib
          import re

          # bootstrap._release_base_url() derives the tag from lemma_cli.__version__,
          # so the assets must land on v<that version>. Release Lemma Terminal CLI
          # rewrites __version__ from the tag at publish time, so a stale committed
          # value is normal on a branch — warn, do not fail.
          text = pathlib.Path("lemma-cli/lemma_cli/__init__.py").read_text()
          match = re.search(r'(?m)^__version__ = "([^"]+)"$', text)
          if match is None:
              raise SystemExit("Could not read __version__ from lemma-cli/lemma_cli/__init__.py")
          committed = match.group(1)
          requested = os.environ["VERSION"]
          if committed != requested:
              print(
                  f"::warning::lemma-cli __version__ is {committed} but this run publishes "
                  f"{requested}; only a CLI built as {requested} will look for these assets."
              )

  build-native:
    name: Build Agent Host (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon is the primary developer target and builds clean in release.
          - target: aarch64-apple-darwin
            runner: macos-14
            ext: ""
            smoke: true
          # Intel macOS: cross-compiled from the arm64 runner. The Apple SDK ships
          # both slices so this is a first-class target, and it avoids depending on
          # an Intel macOS runner label. Rosetta is not installed on the arm runners,
          # so the built binary cannot be smoke-run here.
          - target: x86_64-apple-darwin
            runner: macos-14
            ext: ""
            smoke: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            ext: ".exe"
            smoke: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-host/target
          key: agent-host-cargo-${{ matrix.target }}-${{ hashFiles('agent-host/Cargo.lock') }}
          restore-keys: agent-host-cargo-${{ matrix.target }}-

      - name: Build release binary
        working-directory: agent-host
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Smoke test the binary
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          "agent-host/target/${{ matrix.target }}/release/lemma-agent-host${{ matrix.ext }}" --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-host-${{ matrix.target }}
          path: agent-host/target/${{ matrix.target }}/release/lemma-agent-host${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Agent Host (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    # Built inside AlmaLinux 9 rather than directly on the ubuntu-24.04 runner image.
    #
    # agent-host links reqwest/native-tls, so the published binary loads the user's
    # libssl.so.3 and libcrypto.so.3 at run time. Every distribution that ships
    # OpenSSL 3 also ships glibc >= 2.34 (EL9 is the oldest, at exactly 2.34), so
    # glibc 2.34 is the lowest floor a dynamically OpenSSL-linked build can usefully
    # reach: an older box (EL8, Debian 11, Ubuntu 20.04) only has libssl.so.1.1 and
    # could not load this binary whichever glibc it was built against. AlmaLinux 9
    # hits that floor exactly, with a stock gcc toolchain, no cross-compilation
    # tooling, and no change to the TLS stack.
    #
    # Building on ubuntu-24.04 instead would raise the floor to glibc 2.39 and break
    # Ubuntu 22.04 LTS, Debian 12, and RHEL 9 with a "GLIBC_2.39 not found" loader
    # error on first run.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            container: almalinux:9
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: almalinux:9
    steps:
      # Runs before checkout on purpose: the image is minimal and the checkout and
      # cache actions want git and tar.
      - name: Install build toolchain
        run: |
          set -eux
          dnf install --assumeyes --setopt=install_weak_deps=False \
            gcc openssl-devel pkgconf-pkg-config git tar gzip binutils findutils

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-host/target
          key: agent-host-cargo-${{ matrix.target }}-${{ hashFiles('agent-host/Cargo.lock') }}
          restore-keys: agent-host-cargo-${{ matrix.target }}-

      - name: Build release binary
        working-directory: agent-host
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Smoke test the binary
        run: |
          set -euo pipefail
          "agent-host/target/${{ matrix.target }}/release/lemma-agent-host" --version

      - name: Enforce the glibc floor
        run: |
          set -euo pipefail
          binary="agent-host/target/${{ matrix.target }}/release/lemma-agent-host"
          echo "Shared libraries this binary needs at run time:"
          objdump -p "${binary}" | grep NEEDED
          required="$(
            objdump -T "${binary}" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' \
              | sed 's/^GLIBC_//' \
              | sort -V \
              | tail -1
          )"
          if [[ -z "${required}" ]]; then
            echo "::error::Found no versioned glibc symbols; the floor check is not working." >&2
            exit 1
          fi
          echo "Highest glibc symbol version required: ${required} (ceiling ${MAX_GLIBC})"
          highest="$(printf '%s\n%s\n' "${required}" "${MAX_GLIBC}" | sort -V | tail -1)"
          if [[ "${highest}" != "${MAX_GLIBC}" ]]; then
            echo "::error::Binary requires glibc ${required}, above the ${MAX_GLIBC} ceiling." >&2
            exit 1
          fi
          # A build that started linking OpenSSL 1.1 would silently lose every
          # OpenSSL 3 distribution, so pin that expectation here too.
          objdump -p "${binary}" | grep -q 'NEEDED.*libssl\.so\.3'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-host-${{ matrix.target }}
          path: agent-host/target/${{ matrix.target }}/release/lemma-agent-host
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Agent Host assets
    needs: [resolve, build-native, build-linux]
    runs-on: ubuntu-latest
    # Only this job writes to the repository; resolve/build inherit read-only.
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require fresh backend protected E2E
        # Only on a real published release. A manual dispatch is a deliberate
        # operator action used to build or backfill assets for a version, and the
        # Agent Host binary carries no backend code, so the gate would otherwise
        # make the manual path unusable from a branch.
        if: github.event_name == 'release'
        uses: ./.github/actions/require-backend-protected-e2e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.sha }}

      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: agent-host-*
          path: raw

      - name: Name, hash, and verify the release assets
        shell: python
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import hashlib
          import os
          import pathlib
          import shutil

          # Keep this in lockstep with bootstrap.install_agent_host(): the asset is a
          # bare binary named lemma-agent-host-<triple>[.exe], its checksum sidecar is
          # <asset>.sha256 whose first whitespace field is the sha256 hex digest, and
          # the installer refuses anything over _MAX_BINARY_BYTES.
          MAX_BINARY_BYTES = 128 * 1024 * 1024

          # Every triple bootstrap._target_triple() can return.
          targets = {
              "aarch64-apple-darwin": "",
              "x86_64-apple-darwin": "",
              "aarch64-unknown-linux-gnu": "",
              "x86_64-unknown-linux-gnu": "",
              "x86_64-pc-windows-msvc": ".exe",
          }

          distribution = pathlib.Path("dist")
          distribution.mkdir(exist_ok=True)
          summary = ["| asset | bytes | sha256 |", "| --- | ---: | --- |"]
          missing = []

          for target, extension in sorted(targets.items()):
              built = (
                  pathlib.Path("raw")
                  / f"agent-host-{target}"
                  / f"lemma-agent-host{extension}"
              )
              if not built.is_file():
                  missing.append(str(built))
                  continue
              asset = distribution / f"lemma-agent-host-{target}{extension}"
              shutil.copy2(built, asset)
              payload = asset.read_bytes()
              if len(payload) > MAX_BINARY_BYTES:
                  raise SystemExit(
                      f"{asset.name} is {len(payload)} bytes; the CLI installer refuses "
                      f"anything over {MAX_BINARY_BYTES} bytes"
                  )
              digest = hashlib.sha256(payload).hexdigest()
              # coreutils format: the installer reads the first whitespace field.
              (distribution / f"{asset.name}.sha256").write_text(f"{digest}  {asset.name}\n")
              summary.append(f"| `{asset.name}` | {len(payload)} | `{digest}` |")

          if missing:
              raise SystemExit(f"missing platform builds: {missing}")

          tag = os.environ["TAG"]
          repository = os.environ["REPOSITORY"]
          summary.append("")
          summary.append(
              f"Download base: `https://github.com/{repository}/releases/download/{tag}/`"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("\n".join(summary) + "\n")

      - name: Check that the target release exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release ${TAG} exists; assets stay as workflow artifacts."
          fi

      - name: Attach binaries to the release
        if: >-
          steps.release.outputs.exists == 'true' &&
          (github.event_name == 'release' || inputs.attach_to_release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: |
            dist/lemma-agent-host-*
          # This workflow only ever adds assets to a release someone else created;
          # it must never rewrite the release body.
          generate_release_notes: false

      - name: Upload the combined asset set
        uses: actions/upload-artifact@v7
        with:
          # Deliberately outside the `agent-host-*` pattern the download step
          # above globs, so a re-run of this job cannot ingest its own output.
          name: lemma-agent-host-${{ needs.resolve.outputs.tag }}
          path: dist/lemma-agent-host-*
          if-no-files-found: error
          retention-days: 14
