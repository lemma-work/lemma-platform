name: Release Lemma Python SDK

on:
  # The tag, not the release. A release created by a workflow runs as the
  # default GITHUB_TOKEN, and GitHub will not start a new workflow run from an
  # event that token raised -- so `release: published` fires only when a person
  # cuts the release by hand. v0.7.1 was cut by a person and this ran; v0.7.2
  # was cut by release-local-images.yml and this never ran at all, which is why
  # PyPI sat a release behind for ten days with nothing saying so.
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 1.2.3 or v1.2.3"
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: release-lemma-python-${{ github.event.release.tag_name || inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lemma-python

    steps:
      # Build the tag, not whatever the default branch happens to be. Without a
      # ref a workflow_dispatch checks out main and the version input only
      # rewrites the version string, so a dispatch run after an unrelated merge
      # would publish a different tree under this release's name -- and a
      # package version cannot be re-cut once it is on an index.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.version || github.ref }}

      # The same two steps open every package release (see docs/versioning.md,
      # "Publishing"): name the version, and stop here -- successfully -- when
      # the registry already has it, so re-running a release is a no-op rather
      # than a failure or a second upload.
      - name: Resolve the release version
        id: release
        working-directory: .
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
        run: python3 scripts/release_registry.py version "$RELEASE_VERSION"

      - name: Check whether lemma-sdk is already on PyPI
        id: registry
        working-directory: .
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/release_registry.py published pypi lemma-sdk "$VERSION"

      # The protected backend suite is not a gate on this artifact. It exercises
      # the real Docker runtime, the document processors and the Rust agent
      # host; none of the three is in the wheel published here, and the job
      # already builds and tests exactly what it uploads. The desktop release
      # keeps the gate, which is what it was written for.

      - name: Setup Python
        if: steps.registry.outputs.published == 'false'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The run that publishes the artifact is the run that tests it. CI's path
      # filter skips "Python SDK + CLI tests" whenever the release commit did not
      # touch these packages -- a backend-only release commit is the common case
      # -- and CI is green anyway, because "CI passed" treats a skipped suite as
      # passing. So a CI run for this SHA proves nothing about this wheel.
      # Before the version rewrite below: `uv lock --check` reads pyproject.toml.
      - name: Verify Python SDK and CLI
        if: steps.registry.outputs.published == 'false'
        uses: ./.github/actions/verify-python-sdk

      # Every Lemma-owned component must name the release version. Branches no
      # longer bump versions one by one — that forced a number nobody had
      # released to climb per-PR and conflict on every schema-touching branch —
      # so this is the one place consistency is enforced, and it blocks the
      # publish rather than merely warning about it.
      - name: Check version consistency across components
        if: steps.registry.outputs.published == 'false'
        working-directory: .
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python scripts/check_version_consistency.py --expect "$VERSION"

      - name: Set package version from release tag
        if: steps.registry.outputs.published == 'false'
        shell: python
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          text = re.sub(r'(?m)^version = "[^"]+"$', f'version = "{version}"', text, count=1)
          path.write_text(text)

      - name: Install build tools
        if: steps.registry.outputs.published == 'false'
        run: python -m pip install --upgrade build twine

      - name: Build package
        if: steps.registry.outputs.published == 'false'
        run: python -m build

      - name: Check distribution
        if: steps.registry.outputs.published == 'false'
        run: python -m twine check dist/*

      - name: Publish package
        if: steps.registry.outputs.published == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing dist/*

      # An upload that returned 200 is not a version anybody can install until
      # the index serves it. Fail here, on this run, rather than leave the
      # release tracker to discover it.
      - name: Confirm lemma-sdk is installable from PyPI
        if: steps.registry.outputs.published == 'false'
        working-directory: .
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/release_registry.py wait pypi lemma-sdk "$VERSION" --timeout-seconds 600
