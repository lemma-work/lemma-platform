name: Release Lemma Python SDK

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 1.2.3 or v1.2.3"
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: release-lemma-python-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lemma-python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require fresh backend protected E2E
        uses: ./.github/actions/require-backend-protected-e2e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The run that publishes the artifact is the run that tests it. CI's path
      # filter skips "Python SDK + CLI tests" whenever the release commit did not
      # touch these packages -- a backend-only release commit is the common case
      # -- and CI is green anyway, because "CI passed" treats a skipped suite as
      # passing. So a CI run for this SHA proves nothing about this wheel.
      # Before the version rewrite below: `uv lock --check` reads pyproject.toml.
      - name: Verify Python SDK and CLI
        uses: ./.github/actions/verify-python-sdk

      # Every Lemma-owned component must name the release version. Branches no
      # longer bump versions one by one — that forced a number nobody had
      # released to climb per-PR and conflict on every schema-touching branch —
      # so this is the one place consistency is enforced, and it blocks the
      # publish rather than merely warning about it.
      - name: Check version consistency across components
        working-directory: .
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: python scripts/check_version_consistency.py --expect "$RELEASE_VERSION"

      - name: Set package version from release tag
        shell: python
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid semver release tag: {os.environ['RELEASE_VERSION']}")

          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          text = re.sub(r'(?m)^version = "[^"]+"$', f'version = "{version}"', text, count=1)
          path.write_text(text)

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: python -m twine check dist/*

      - name: Publish package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing dist/*
