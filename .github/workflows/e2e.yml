name: Backend E2E

# The fast backend end-to-end suite. This is a REAL e2e run — Postgres, Redis,
# SuperTokens, the streaq workers, and the fake provider servers all run for real
# (from testcontainers on the runner). Only the two nondeterministic/expensive
# externals are stubbed: the LLM (a deterministic FunctionModel) and the sandbox
# workspace (an in-process fake) — so it needs NO model API keys and NO Docker
# workspace image. Slow, live-provider and local-CLI tests live in "Backend
# protected E2E" instead.
#
# Indexing tests used to be in that list. They are not any more: the `indexing`
# shard below runs them on every pull request, against the real Kreuzberg
# extraction container but still with no model key and no Docker sandbox. They
# are also still selected by the protected lane, which runs them again in real
# mode — a second configuration, not a second copy.
#
# The `sandbox` shard is the exception: it runs the function and workspace
# journeys against the REAL Docker sandbox (dropping "not workspace" from its
# marker filter). Function execution and workspace execution are the things
# under test there, and neither has an in-process fake that proves the runtime
# contract.
#
# Shard layout is NOT hand-written here. `.github/e2e-shards.json` is generated
# by `scripts/plan_e2e_shards.py` from the JUnit XML a green run already
# uploads, so the shards are balanced against measured time rather than
# against a guess. It used to be a guess, and the guess drifted: the slowest
# shard ran 467s while the fastest ran 172s, so most of the fan-out sat idle.
# To rebalance after the suite shifts:
#
#     python scripts/plan_e2e_shards.py --run-id <a green run>
#
# Trigger model: everything here runs directly on the PR push that touches the
# backend or anything vendored into it. No workflow_run cascade: the backend
# unit lane lives in this file too (it moved from ci.yml), so unit and e2e
# coverage are combined by the `coverage` job inside the same run, against the
# same checkout. It used to be a separate workflow_run consumer that polled up
# to 20 minutes for the other run's artifact, combined a merge-commit unit run
# with head-commit e2e runs, and was red on 512 of its 1000 runs -- mostly for
# having nothing to combine.
#
# Required check: main's protect-main ruleset requires "Backend E2E passed" --
# the aggregator at the bottom of this file, not the individual job names. It
# covers the unit lane, every e2e shard and the coverage floor. That
# indirection is load-bearing: it lets the shard layout be regenerated, and it
# lets the whole workflow be skipped on a PR that cannot affect it, without
# either of those silently dropping a required check.

on:
  workflow_dispatch:
  # Main warms the image and model caches and runs the unit lane; the e2e
  # shards are gated to pull_request/dispatch. A run can only restore caches from its own
  # branch or from the default branch, and this workflow never ran on main --
  # so no PR could ever inherit a warm sandbox-image cache, and every branch
  # paid a cold build. Warming it here is what makes the cache actually cache.
  push:
    branches: [main]
  pull_request:
    # opened/synchronize/reopened: the direct trigger every normal PR push
    # takes. labeled: surface-live-smoke's own on-demand "surface-live" label.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  # No longer scoped by event_name: that existed only because a workflow_run
  # cascade queued from main's copy of this file raced the direct trigger.
  # With workflow_run gone there is one run per branch to cancel.
  group: e2e-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      shards: ${{ steps.shards.outputs.matrix }}
      needs_sandbox_images: ${{ steps.shards.outputs.needs_sandbox_images }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'lemma-backend/**'
              # Vendored into the sandbox images and imported by the e2e
              # fixtures, so a change here can turn the suite red without
              # touching lemma-backend. These mirror _SANDBOX_BUILD_INPUTS in
              # app/modules/test_support/e2e/runtime.py.
              - 'lemma-pod-bundle/**'
              - 'lemma-python/**'
              - 'lemma-cli/**'
              - 'lemma-typescript/**'
              - 'lemma-skills/**'
              - '.github/workflows/e2e.yml'
              - '.github/e2e-shards.json'
      - name: Load the shard matrix
        id: shards
        run: |
          echo "matrix=$(jq -c '.shards' .github/e2e-shards.json)" >> "$GITHUB_OUTPUT"
          echo "needs_sandbox_images=$(jq -r 'any(.shards[]; .needs_sandbox_images) | tostring' .github/e2e-shards.json)" >> "$GITHUB_OUTPUT"

  # Built once per run, here, instead of once per shard. Three shards declare
  # `needs_sandbox_images`, they run in parallel, and on a cold cache all three
  # missed it together and built the identical image independently: measured at
  # 79s + 81s + 77s in run 32855094744 and 75s + 77s + 114s in 32851884561,
  # then three `docker save`s racing to write one cache key. Roughly four
  # minutes of runner time per run to produce one artifact three times.
  sandbox-images:
    name: build sandbox images
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' &&
      needs.changes.outputs.needs_sandbox_images == 'true' &&
      (github.event_name != 'pull_request' ||
       contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      key: ${{ steps.key.outputs.value }}
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Resolve the cache key
        id: key
        run: echo "value=e2e-sandbox-images-${{ hashFiles(
              'lemma-backend/sandbox-images/**',
              'lemma-backend/sandbox_runtime/**',
              'lemma-backend/Makefile',
              'lemma-python/**',
              'lemma-pod-bundle/**',
              'lemma-cli/**',
              'lemma-typescript/**',
              'lemma-skills/**'
            ) }}" >> "$GITHUB_OUTPUT"
      # `lookup-only`, so a warm cache costs a HEAD request rather than pulling
      # a multi-gigabyte tar down just to prove it exists. The shards download
      # it; this job only decides whether it has to be created.
      - name: Is the image already cached?
        id: probe
        uses: actions/cache/restore@v6
        with:
          path: /tmp/e2e-sandbox-images.tar
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      - name: Build sandbox images
        if: steps.probe.outputs.cache-hit != 'true'
        run: make sandbox-images
      - name: Save sandbox images to cache
        if: steps.probe.outputs.cache-hit != 'true'
        run: |
          docker save -o /tmp/e2e-sandbox-images.tar \
            $(make print-sandbox-images | awk '{print $2}')
      - name: Upload the image cache
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/e2e-sandbox-images.tar
          key: ${{ steps.key.outputs.value }}

  # Third-party service images (Postgres, Redis, SuperTokens, Kreuzberg),
  # pulled once per run here and handed to the shards through the cache,
  # instead of every shard cold-pulling ~1.2 GB and eight of them racing to save
  # the same key. Runs on pushes to main too: a PR can restore a cache from its
  # own branch or from main, and this used to be saved only in PR scope, so
  # every new PR paid the cold pull -- and a registry hiccup on that pull
  # failed all eight shards at once.
  #
  # The image list is read out of `test_utils.py` rather than restated here.
  # It used to be restated, and a fixture image missing from this list was
  # silently pulled at test time instead.
  service-images:
    name: pull service images
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' &&
      (github.event_name != 'pull_request' ||
       contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Resolve the image list and cache key
        id: key
        run: |
          images="$(grep -oE '^[A-Z_]+_IMAGE = "[^"]+"' lemma-backend/app/core/test_utils.py | cut -d'"' -f2 | sort | tr '\n' ' ')"
          test -n "$images" || { echo "::error::no *_IMAGE pins found in test_utils.py"; exit 1; }
          echo "Images: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "value=e2e-service-images-$(echo "$images" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Is the image set already cached?
        id: probe
        uses: actions/cache/restore@v6
        with:
          path: /tmp/e2e-service-images.tar
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      # In parallel, each with its own retry, so one slow or flaky registry
      # costs a retry rather than the run.
      - name: Pull service images
        if: steps.probe.outputs.cache-hit != 'true'
        run: |
          pull() {
            for attempt in 1 2 3; do
              docker pull --quiet "$1" && return 0
              echo "::warning::pull of $1 failed (attempt $attempt)"
              sleep $((attempt * 10))
            done
            echo "::error::could not pull $1"
            return 1
          }
          pids=()
          for image in ${{ steps.key.outputs.images }}; do
            pull "$image" & pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      - name: Save service images
        if: steps.probe.outputs.cache-hit != 'true'
        run: docker save -o /tmp/e2e-service-images.tar ${{ steps.key.outputs.images }}
      - name: Upload the image cache
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/e2e-service-images.tar
          key: ${{ steps.key.outputs.value }}
      # e2e forces embedding_provider=local (e2e_base.py), which is FastEmbed
      # downloading BAAI/bge-base-en-v1.5 -- a few hundred megabytes -- the
      # first time anything embeds. Warmed here, once, and on main, for the
      # same reason as the images: a cache saved only by a PR shard was never
      # visible to the next PR.
      - name: Is the embedding model already cached?
        id: fastembed-probe
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/lemma/fastembed
          key: fastembed-${{ hashFiles('lemma-backend/app/core/config.py') }}
          lookup-only: true
      - uses: astral-sh/setup-uv@v7
        if: steps.fastembed-probe.outputs.cache-hit != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: lemma-backend/uv.lock
      - name: Download the embedding model
        if: steps.fastembed-probe.outputs.cache-hit != 'true'
        working-directory: lemma-backend
        run: >-
          uv run python -c "from app.core.embeddings.local_embedder import
          FastEmbedLocalEmbedder; FastEmbedLocalEmbedder()._load_model()"
      - name: Upload the embedding model cache
        if: steps.fastembed-probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/lemma/fastembed
          key: fastembed-${{ hashFiles('lemma-backend/app/core/config.py') }}

  backend-unit:
    name: lemma-backend unit
    timeout-minutes: 30
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' &&
      (github.event_name != 'pull_request' ||
       contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lemma-backend
    services:
      redis:
        # The same tag `test_utils.py` pins and the e2e workflow caches.
        # This said `redis:7`, a second, different image (192MB against
        # 42MB) pulled fresh for this job alone.
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # This lane runs `$(UNIT_MARKERS)`, which includes the integration tests,
      # and those skip themselves when no database answers. Without this service 57
      # of them did -- the whole workspace integration suite: the sandbox state
      # machine, the repository, and every one of the sweeper's decisions about
      # what it may destroy. They passed locally and were absent here, which is
      # how a sweep that deleted live user workspaces reached production with 24
      # tests written about it.
      #
      # The two that need a Docker daemon or a cargo-built bridge are marked
      # `local_host` and deselected instead: a database this lane can be given,
      # and those it cannot, so here they could only ever skip.
      postgres:
        image: pgvector/pgvector:0.8.3-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lemma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lemma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The same commit the e2e shards check out, so the `coverage` job
      # combines line numbers from one tree rather than two.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: lemma-backend/uv.lock
      - name: Sync deps
        run: uv sync --extra local
      - name: Unit tests with coverage
        run: make coverage-backend-unit
        env:
          REDIS_URL: redis://localhost:6379
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lemma
      # Collection-time checks cannot see a test that starts and then skips
      # itself from a fixture. 72 of this lane's tests do exactly that when
      # Postgres is unreachable, and this job's own comment records what the
      # same suite silently skipping 57 tests once cost.
      - name: No suite skipped itself at runtime
        if: always()
        run: >-
          python3 ../scripts/check_test_run.py --lane unit
          coverage-backend/junit-unit.xml

      - name: Add backend coverage to job summary
        if: always()
        run: |
          if [ -f coverage-backend/comment.md ]; then
            cat coverage-backend/comment.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload backend unit coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-coverage
          include-hidden-files: true
          path: |
            lemma-backend/.coverage.backend
            lemma-backend/coverage-backend/comment.md
            lemma-backend/coverage-backend/summary.json
            lemma-backend/coverage-backend/coverage.json
            lemma-backend/coverage-backend/coverage.xml
            # `make coverage-backend-unit` has always written this and nothing
            # has ever collected it, so the unit lane's slow tail is invisible
            # -- 195 seconds with no way to see whether that is a broad spread
            # or three slow tests, which is the difference between needing
            # per-worker database isolation for xdist and needing to split
            # three tests. The e2e shards upload theirs and get a slowest-tests
            # summary out of it; this is the same line.
            lemma-backend/coverage-backend/junit-*.xml
          if-no-files-found: ignore
  backend-e2e:
    name: lemma-backend e2e (${{ matrix.shard.name }})
    needs: [changes, sandbox-images, service-images]
    # Manual dispatch, or directly on every PR push that can affect the
    # backend. Independent of "CI"'s outcome and of any label.
    #
    # `!cancelled()` rather than the default, because `sandbox-images` is
    # skipped when no shard in the matrix declares one, and a skipped
    # dependency would otherwise skip every shard with it. A *failed* build is
    # still fatal -- there would be no image to load.
    if: >-
      !cancelled() &&
      needs.sandbox-images.result != 'failure' &&
      needs.service-images.result == 'success' &&
      needs.changes.outputs.backend == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)))
    runs-on: ubuntu-latest
    # The slowest shard measured 467s before rebalancing. Twenty-five minutes
    # is generous headroom and still catches a hang, which the old 6-hour
    # default did not.
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      # Run every shard even if one fails, so one red shard doesn't mask others.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Scoped deliberately. The default glob is `**/uv.lock`, and this
          # repo has nine of them, so a lock bump in an unrelated component
          # busted every shard's cache at once.
          cache-dependency-glob: lemma-backend/uv.lock
      - name: Sync deps
        # `local` pulls in xberg: the datastore shard's real-wheel journey
        # (test_desktop_local_journey_converts_and_indexes_with_the_real_xberg_wheel)
        # needs it installed, same as the unit-test CI job (ci.yml).
        run: uv sync --extra local
      # Pulled once for the whole run by `service-images`, which either found
      # this key or created it -- so a miss here is a broken assumption, not
      # something to paper over by pulling in every shard again.
      - name: Restore service images
        uses: actions/cache/restore@v6
        with:
          path: /tmp/e2e-service-images.tar
          key: ${{ needs.service-images.outputs.key }}
          fail-on-cache-miss: true
      - name: Load service images
        run: docker load -i /tmp/e2e-service-images.tar
      - name: Restore the local embedding model
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/lemma/fastembed
          key: fastembed-${{ hashFiles('lemma-backend/app/core/config.py') }}
          restore-keys: fastembed-
      # Only the sandbox shards need the real workspace + function-runner
      # images, and by here they always exist: `sandbox-images` built them once
      # for the whole run, or found them already cached. Content-addressed by
      # the same inputs app/modules/test_support/e2e/runtime.py fingerprints
      # (_SANDBOX_BUILD_INPUTS). `make sandbox-images` tags with
      # SANDBOX_TAG=dev rather than that fingerprint, so the tags are resolved
      # and handed to the fixtures explicitly via
      # WORKSPACE_E2E_IMAGE/FUNCTION_E2E_IMAGE -- the same two-step approach
      # sandbox-function-benchmark.yml already uses.
      - name: Restore sandbox images
        if: matrix.shard.needs_sandbox_images
        uses: actions/cache/restore@v6
        with:
          path: /tmp/e2e-sandbox-images.tar
          key: ${{ needs.sandbox-images.outputs.key }}
          # The `sandbox-images` job either found this key or created it, so a
          # miss here is a broken assumption rather than something to paper
          # over by building -- which is the duplication this split removed.
          fail-on-cache-miss: true
      - name: Load sandbox images
        if: matrix.shard.needs_sandbox_images
        run: docker load -i /tmp/e2e-sandbox-images.tar
      - name: Resolve sandbox image tags
        if: matrix.shard.needs_sandbox_images
        run: |
          make print-sandbox-images | while read -r kind image; do
            case "$kind" in
              workspace:) echo "WORKSPACE_E2E_IMAGE=$image" >> "$GITHUB_ENV" ;;
              function:)  echo "FUNCTION_E2E_IMAGE=$image"  >> "$GITHUB_ENV" ;;
            esac
          done
      # Shards run in parallel, so wall-clock is the slowest shard, not their
      # sum. Both args and worker count come from the generated layout.
      - name: E2E tests (deterministic LLM + in-process sandbox, real services)
        run: >-
          make coverage-backend-e2e-shard
          E2E_ARGS="${{ matrix.shard.args }}"
          E2E_WORKERS=${{ matrix.shard.workers }}
          E2E_SHARD_MARKERS="${{ matrix.shard.markers }}"
          COVERAGE_PHASE=e2e-${{ matrix.shard.name }}
      # The slow tail is where this suite's wall-clock lives -- half of it sits
      # in a tenth of the tests -- so keep it visible rather than buried in a
      # log nobody opens.
      - name: Report the slowest tests in this shard
        if: always()
        run: |
          python3 ../scripts/e2e_durations.py \
            coverage-backend/junit-e2e-${{ matrix.shard.name }}.xml \
            >> "$GITHUB_STEP_SUMMARY" || true
      # A long test is fine. A long test in front of the merge button is a
      # decision, and this makes someone make it: over the budget, a test
      # either moves to the scheduled lane with @pytest.mark.slow, gets a
      # cheap wiring half split out of it, or goes on the baseline with a
      # reason. Anything already marked slow never reaches this -- it is
      # filtered out before pytest writes the JUnit.
      - name: Enforce the PR-lane test duration budget
        if: always()
        run: |
          python3 ../scripts/e2e_durations.py \
            coverage-backend/junit-e2e-${{ matrix.shard.name }}.xml --check
      # `junit-*.phases.json` is the per-phase breakdown written beside each
      # JUnit. Kept because the JUnit alone cannot answer the question the
      # budget step above raises -- whether a test is slow, or merely went
      # first and paid for the session fixtures -- and reconstructing that by
      # hand is what investigating a budget failure costs otherwise.
      - name: Upload backend e2e coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-e2e-${{ matrix.shard.name }}-coverage
          include-hidden-files: true
          path: |
            lemma-backend/.coverage.backend
            lemma-backend/coverage-backend/comment.md
            lemma-backend/coverage-backend/summary.json
            lemma-backend/coverage-backend/coverage.json
            lemma-backend/coverage-backend/coverage.xml
            lemma-backend/coverage-backend/junit-*.xml
            lemma-backend/coverage-backend/junit-*.phases.json
          if-no-files-found: ignore

  # One number, one floor. Unit + every e2e shard, combined in this run from
  # the same checkout, must stay at or above `lemma-backend/coverage-floor.txt`
  # **as it is on main** -- so a pull request cannot lower its own bar; lowering
  # it is a reviewed change that applies from the next PR on. A PR may lose a
  # little coverage and still pass: the floor sits ~2 points under the measured
  # total (89.9% when it was set), which absorbs the ~0.4-point run-to-run
  # spread of coverage measured across xdist workers.
  #
  # Per-module floors and a changed-lines threshold used to be enforced here
  # too. They were red on more than half of all runs, which is a gate nobody
  # reads; the module table is still in the PR comment for anyone who wants it.
  coverage:
    name: backend coverage
    needs: [changes, backend-unit, backend-e2e]
    # Only when both producers ran and passed. A skipped e2e matrix (a PR that
    # cannot affect the backend) skips this too, and the aggregator reads that
    # as success; a failed producer is already failing the aggregator itself.
    if: >-
      !cancelled() &&
      needs.backend-unit.result == 'success' &&
      needs.backend-e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The one PR comment below. Fork PRs get a read-only token and the step
      # skips them.
      pull-requests: write
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: lemma-backend/uv.lock
      - name: Sync dependencies
        run: uv sync
      - name: Download unit and e2e coverage
        uses: actions/download-artifact@v8
        with:
          pattern: backend-*-coverage
          path: lemma-backend/coverage-artifacts
      - name: Combine coverage
        shell: bash
        run: |
          mkdir -p coverage-backend
          combine() {  # combine <output data file> <find root>
            local dir; dir="$(mktemp -d)"; local index=0
            while IFS= read -r file; do
              # coverage.py discovers parallel inputs by suffixing the data
              # file's basename, so the copies must keep that basename.
              cp "$file" "$dir/$(basename "$1").$index"; index=$((index + 1))
            done < <(find $2 -type f -name '.coverage.backend*')
            if [ "$index" -eq 0 ]; then
              echo "::error::no coverage data under $2"; return 1
            fi
            COVERAGE_FILE="$1" uv run coverage combine "$dir"
          }
          combine "$PWD/.coverage.unit" coverage-artifacts/backend-unit-coverage
          combine "$PWD/.coverage.e2e" "coverage-artifacts/backend-e2e-*-coverage"
          combine "$PWD/.coverage.backend" coverage-artifacts
          COVERAGE_FILE="$PWD/.coverage.unit" uv run coverage json -o coverage-backend/unit.json
          COVERAGE_FILE="$PWD/.coverage.e2e" uv run coverage json -o coverage-backend/e2e-union.json
          COVERAGE_FILE="$PWD/.coverage.backend" uv run coverage json -o coverage-backend/coverage.json
      - name: Build the coverage report
        run: >-
          uv run python scripts/backend_coverage_report.py
          --unit-coverage-json coverage-backend/unit.json
          --e2e-coverage-json coverage-backend/e2e-union.json
          --combined-coverage-json coverage-backend/coverage.json
          --unit-junit-glob 'coverage-artifacts/backend-unit-coverage/**/junit-*.xml'
          --e2e-junit-glob 'coverage-artifacts/backend-e2e-*/**/junit-*.xml'
          --markdown-out coverage-backend/overall.md
          --summary-json-out coverage-backend/overall-summary.json
      - name: Add the coverage report to the job summary
        run: cat coverage-backend/overall.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish one authoritative PR coverage comment
        if: github.event_name == 'pull_request' && hashFiles('lemma-backend/coverage-backend/overall.md') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lemma-backend-coverage:overall -->';
            const body = fs.readFileSync(
              'lemma-backend/coverage-backend/overall.md',
              'utf8',
            );
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No PR is associated with this workflow run.');
              return;
            }
            const {owner, repo} = context.repo;
            const {data: pull} = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number,
            });
            if (pull.head.repo.full_name !== `${owner}/${repo}`) {
              core.info(`Skipping coverage comment for fork PR ${pull.head.repo.full_name}.`);
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const obsoleteComments = comments.filter((comment) =>
              comment.user?.type === 'Bot' &&
              /<!-- lemma-backend-coverage:(?!overall)[^>]+ -->/.test(comment.body || '')
            );
            for (const comment of obsoleteComments) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }
      - name: Total coverage is at or above main's floor
        run: |
          if git fetch --quiet --depth=1 origin main \
             && floor="$(git show FETCH_HEAD:lemma-backend/coverage-floor.txt 2>/dev/null)"; then
            source="main"
          else
            floor="$(cat coverage-floor.txt)"; source="this branch (main has no floor file)"
          fi
          floor="$(echo "$floor" | tr -d '[:space:]')"
          total="$(jq '.totals.percent_covered' coverage-backend/coverage.json)"
          printf 'Combined backend coverage: %.2f%% (floor %s%%, from %s)\n' "$total" "$floor" "$source" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v f="$floor" 'BEGIN { exit !(t < f) }'; then
            echo "::error::Combined backend coverage $(printf '%.2f' "$total")% is below the ${floor}% floor. Add tests for the code this PR adds or changes."
            exit 1
          fi
      - name: Upload the combined coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-aggregate-coverage
          path: |
            lemma-backend/coverage-backend/coverage.json
            lemma-backend/coverage-backend/unit.json
            lemma-backend/coverage-backend/e2e-union.json
            lemma-backend/coverage-backend/overall.md
            lemma-backend/coverage-backend/overall-summary.json
          if-no-files-found: ignore

  e2e-passed:
    name: Backend E2E passed
    # The single required context for this workflow. `needs` the matrix job
    # rather than a list of shard names, so a regenerated shard layout cannot
    # leave a shard unwatched -- the failure mode ci.yml's own aggregator hit
    # once, where a job missing from `needs` kept the check green while it
    # failed.
    timeout-minutes: 10
    # `!cancelled()`, not `always()`. `always()` runs this job even when the
    # *run* was cancelled -- which `cancel-in-progress` above does to every
    # superseded push -- and it then reported failure for a run that was
    # simply replaced by a newer one. 13 of 84 observed Backend E2E runs were
    # cancelled, and every one of them read as a failure. Nothing was ever
    # blocked, because GitHub judges the newest run; what it cost was the
    # ability to read the run list and tell whether CI is actually flaky.
    #
    # The step below still refuses a cancelled *shard*, which is a different
    # thing: `fail-fast: false` means the matrix never cancels its own
    # siblings, so a cancelled shard with a live run means somebody stopped one
    # job, and a required check must not go green on a run that did not finish.
    #
    # Skipped entirely on a push to main: that event exists to warm the image
    # caches (and run the unit lane), `backend-e2e` does not run there, and a required
    # check reporting green for a run that tested nothing is worse than no
    # check at all.
    if: ${{ !cancelled() && github.event_name != 'push' }}
    needs: [changes, sandbox-images, service-images, backend-unit, backend-e2e, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any shard failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::The backend unit lane, an e2e shard or the coverage floor failed or was cancelled."
          exit 1
      # A skipped matrix is the correct answer for a PR that cannot affect the
      # backend, so it reports success. Without this, path-filtering a required
      # check leaves it permanently pending and nothing can merge.
      - run: echo "Backend e2e passed (or was skipped as unaffected)."

  surface-live-smoke:
    name: agent surfaces live smoke
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'surface-live')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: lemma-backend/uv.lock
      - name: Sync deps
        run: uv sync
      - name: Live provider smoke tests
        run: uv run pytest app/modules/agent_surfaces/tests/e2e/test_surface_live_smoke_e2e.py -m surface_live -o timeout=120
        env:
          LEMMA_RUN_SURFACE_LIVE_E2E: "1"
