name: Backend E2E

# The fast backend end-to-end suite. This is a REAL e2e run — Postgres, Redis,
# SuperTokens, the streaq workers, and the fake provider servers all run for real
# (from testcontainers on the runner). Only the two nondeterministic/expensive
# externals are stubbed: the LLM (a deterministic FunctionModel) and the sandbox
# workspace (an in-process fake) — so it needs NO model API keys and NO Docker
# workspace image. Slow, live-provider, local-CLI, and real-indexing tests live
# in "Backend protected E2E" instead.
#
# The `sandbox` shard is the exception: it runs the function and workspace
# journeys against the REAL Docker sandbox (dropping "not workspace" from its
# marker filter). Function execution and workspace execution are the things
# under test there, and neither has an in-process fake that proves the runtime
# contract.
#
# Shard layout is NOT hand-written here. `.github/e2e-shards.json` is generated
# by `scripts/plan_e2e_shards.py` from the JUnit XML a green run already
# uploads, so the shards are balanced against measured time rather than
# against a guess. It used to be a guess, and the guess drifted: the slowest
# shard ran 467s while the fastest ran 172s, so most of the fan-out sat idle.
# To rebalance after the suite shifts:
#
#     python scripts/plan_e2e_shards.py --run-id <a green run>
#
# Trigger model: backend-e2e runs directly on every PR push that touches the
# backend or anything vendored into it. There is no workflow_run cascade any
# more — coverage aggregation moved to `backend-coverage.yml`, which is the
# only thing that ever needed one, and keeping it here put a 256-second job
# that gates nothing on the critical path of every PR.
#
# Required check: main's protect-main ruleset requires "lemma-backend unit"
# plus "Backend E2E passed" — the aggregator at the bottom of this file, not
# the individual shard names. That indirection is load-bearing: it lets the
# shard layout be regenerated, and it lets the whole workflow be skipped on a
# PR that cannot affect it, without either of those silently dropping a
# required check. It also means the sandbox shard finally gates a merge; under
# the old literal-name list the workspace journeys ran but blocked nothing.

on:
  workflow_dispatch:
  # Main builds the sandbox images and nothing else (every other job here is
  # gated to pull_request/dispatch). A run can only restore caches from its own
  # branch or from the default branch, and this workflow never ran on main --
  # so no PR could ever inherit a warm sandbox-image cache, and every branch
  # paid a cold build. Warming it here is what makes the cache actually cache.
  push:
    branches: [main]
  pull_request:
    # opened/synchronize/reopened: the direct trigger every normal PR push
    # takes. labeled: surface-live-smoke's own on-demand "surface-live" label.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  # No longer scoped by event_name: that existed only because a workflow_run
  # cascade queued from main's copy of this file raced the direct trigger.
  # With workflow_run gone there is one run per branch to cancel.
  group: e2e-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      shards: ${{ steps.shards.outputs.matrix }}
      needs_sandbox_images: ${{ steps.shards.outputs.needs_sandbox_images }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'lemma-backend/**'
              # Vendored into the sandbox images and imported by the e2e
              # fixtures, so a change here can turn the suite red without
              # touching lemma-backend. These mirror _SANDBOX_BUILD_INPUTS in
              # app/modules/test_support/e2e/runtime.py.
              - 'lemma-pod-bundle/**'
              - 'lemma-python/**'
              - 'lemma-cli/**'
              - 'lemma-typescript/**'
              - 'lemma-skills/**'
              - '.github/workflows/e2e.yml'
              - '.github/e2e-shards.json'
      - name: Load the shard matrix
        id: shards
        run: |
          echo "matrix=$(jq -c '.shards' .github/e2e-shards.json)" >> "$GITHUB_OUTPUT"
          echo "needs_sandbox_images=$(jq -r 'any(.shards[]; .needs_sandbox_images) | tostring' .github/e2e-shards.json)" >> "$GITHUB_OUTPUT"

  # Built once per run, here, instead of once per shard. Three shards declare
  # `needs_sandbox_images`, they run in parallel, and on a cold cache all three
  # missed it together and built the identical image independently: measured at
  # 79s + 81s + 77s in run 32855094744 and 75s + 77s + 114s in 32851884561,
  # then three `docker save`s racing to write one cache key. Roughly four
  # minutes of runner time per run to produce one artifact three times.
  sandbox-images:
    name: build sandbox images
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' &&
      needs.changes.outputs.needs_sandbox_images == 'true' &&
      (github.event_name != 'pull_request' ||
       contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      key: ${{ steps.key.outputs.value }}
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Resolve the cache key
        id: key
        run: echo "value=e2e-sandbox-images-${{ hashFiles(
              'lemma-backend/sandbox-images/**',
              'lemma-backend/sandbox_runtime/**',
              'lemma-python/**',
              'lemma-pod-bundle/**',
              'lemma-cli/**',
              'lemma-typescript/**',
              'lemma-skills/**'
            ) }}" >> "$GITHUB_OUTPUT"
      # `lookup-only`, so a warm cache costs a HEAD request rather than pulling
      # a multi-gigabyte tar down just to prove it exists. The shards download
      # it; this job only decides whether it has to be created.
      - name: Is the image already cached?
        id: probe
        uses: actions/cache/restore@v6
        with:
          path: /tmp/e2e-sandbox-images.tar
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      - name: Build sandbox images
        if: steps.probe.outputs.cache-hit != 'true'
        run: make sandbox-images
      - name: Save sandbox images to cache
        if: steps.probe.outputs.cache-hit != 'true'
        run: |
          docker save -o /tmp/e2e-sandbox-images.tar \
            $(make print-sandbox-images | awk '{print $2}')
      - name: Upload the image cache
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/e2e-sandbox-images.tar
          key: ${{ steps.key.outputs.value }}

  backend-e2e:
    name: lemma-backend e2e (${{ matrix.shard.name }})
    needs: [changes, sandbox-images]
    # Manual dispatch, or directly on every PR push that can affect the
    # backend. Independent of "CI"'s outcome and of any label.
    #
    # `!cancelled()` rather than the default, because `sandbox-images` is
    # skipped when no shard in the matrix declares one, and a skipped
    # dependency would otherwise skip every shard with it. A *failed* build is
    # still fatal -- there would be no image to load.
    if: >-
      !cancelled() &&
      needs.sandbox-images.result != 'failure' &&
      needs.changes.outputs.backend == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)))
    runs-on: ubuntu-latest
    # The slowest shard measured 467s before rebalancing. Twenty-five minutes
    # is generous headroom and still catches a hang, which the old 6-hour
    # default did not.
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      # Run every shard even if one fails, so one red shard doesn't mask others.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Scoped deliberately. The default glob is `**/uv.lock`, and this
          # repo has nine of them, so a lock bump in an unrelated component
          # busted every shard's cache at once.
          cache-dependency-glob: lemma-backend/uv.lock
      - name: Sync deps
        # `local` pulls in xberg: the datastore shard's real-wheel journey
        # (test_desktop_local_journey_converts_and_indexes_with_the_real_xberg_wheel)
        # needs it installed, same as the unit-test CI job (ci.yml).
        run: uv sync --extra local
      # Every image `test_utils.py` pins, because GH-hosted runners are fresh
      # VMs with nothing pre-pulled and each shard would otherwise cold-pull
      # the lot on every run. Keyed on the file that pins the versions, so a
      # version bump there is the only thing that busts it.
      #
      # Kreuzberg (594MB) and MinIO (228MB) were missing from this list while
      # being started by the datastore, schedule and core e2e fixtures, so
      # those shards paid an uncached pull every run -- `kreuzberg_url` alone
      # measured 35s of session setup. They are cached here with the rest
      # rather than per-shard: `e2e-shards.json` is generated, so gating on a
      # shard name would either hand-edit a generated file or hard-code names
      # the generator is free to change.
      - name: Cache e2e container images
        id: cache-e2e-images
        uses: actions/cache@v6
        with:
          path: /tmp/e2e-docker-images.tar
          key: e2e-docker-images-${{ hashFiles('lemma-backend/app/core/test_utils.py') }}
      - name: Load cached e2e container images
        if: steps.cache-e2e-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/e2e-docker-images.tar
      - name: Pull e2e container images
        if: steps.cache-e2e-images.outputs.cache-hit != 'true'
        run: |
          docker pull docker.io/pgvector/pgvector:0.8.3-pg18
          docker pull redis:7.4-alpine
          docker pull docker.io/supertokens/supertokens-postgresql:11.4.5
          docker pull ghcr.io/kreuzberg-dev/kreuzberg-core:4.10.2
          docker pull quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
      - name: Save e2e container images to cache
        if: steps.cache-e2e-images.outputs.cache-hit != 'true'
        run: |
          docker save -o /tmp/e2e-docker-images.tar \
            docker.io/pgvector/pgvector:0.8.3-pg18 \
            redis:7.4-alpine \
            docker.io/supertokens/supertokens-postgresql:11.4.5 \
            ghcr.io/kreuzberg-dev/kreuzberg-core:4.10.2 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
      # e2e forces embedding_provider=local (e2e_base.py), which is FastEmbed
      # downloading BAAI/bge-base-en-v1.5 -- a few hundred megabytes -- into
      # ~/.cache/lemma/fastembed the first time anything embeds. On a fresh
      # runner that download lands inside whichever test embeds first, which is
      # how test_kreuzberg_upload_runs_outbox_worker_projection_search_and_dedup
      # came to be the single slowest test in the suite at 130 seconds. The
      # model is pinned in config.py, so that is what the key follows.
      - name: Cache the local embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/lemma/fastembed
          key: fastembed-${{ hashFiles('lemma-backend/app/core/config.py') }}
          restore-keys: fastembed-
      # Only the sandbox shards need the real workspace + function-runner
      # images, and by here they always exist: `sandbox-images` built them once
      # for the whole run, or found them already cached. Content-addressed by
      # the same inputs app/modules/test_support/e2e/runtime.py fingerprints
      # (_SANDBOX_BUILD_INPUTS). `make sandbox-images` tags with
      # SANDBOX_TAG=dev rather than that fingerprint, so the tags are resolved
      # and handed to the fixtures explicitly via
      # WORKSPACE_E2E_IMAGE/FUNCTION_E2E_IMAGE -- the same two-step approach
      # sandbox-function-benchmark.yml already uses.
      - name: Restore sandbox images
        if: matrix.shard.needs_sandbox_images
        uses: actions/cache/restore@v6
        with:
          path: /tmp/e2e-sandbox-images.tar
          key: ${{ needs.sandbox-images.outputs.key }}
          # The `sandbox-images` job either found this key or created it, so a
          # miss here is a broken assumption rather than something to paper
          # over by building -- which is the duplication this split removed.
          fail-on-cache-miss: true
      - name: Load sandbox images
        if: matrix.shard.needs_sandbox_images
        run: docker load -i /tmp/e2e-sandbox-images.tar
      - name: Resolve sandbox image tags
        if: matrix.shard.needs_sandbox_images
        run: |
          make print-sandbox-images | while read -r kind image; do
            case "$kind" in
              workspace:) echo "WORKSPACE_E2E_IMAGE=$image" >> "$GITHUB_ENV" ;;
              function:)  echo "FUNCTION_E2E_IMAGE=$image"  >> "$GITHUB_ENV" ;;
            esac
          done
      # Shards run in parallel, so wall-clock is the slowest shard, not their
      # sum. Both args and worker count come from the generated layout.
      - name: E2E tests (deterministic LLM + in-process sandbox, real services)
        run: >-
          make coverage-backend-e2e-shard
          E2E_ARGS="${{ matrix.shard.args }}"
          E2E_WORKERS=${{ matrix.shard.workers }}
          E2E_SHARD_MARKERS="${{ matrix.shard.markers }}"
          COVERAGE_PHASE=e2e-${{ matrix.shard.name }}
      # The slow tail is where this suite's wall-clock lives -- half of it sits
      # in a tenth of the tests -- so keep it visible rather than buried in a
      # log nobody opens.
      - name: Report the slowest tests in this shard
        if: always()
        run: |
          python3 ../scripts/e2e_durations.py \
            coverage-backend/junit-e2e-${{ matrix.shard.name }}.xml \
            >> "$GITHUB_STEP_SUMMARY" || true
      # A long test is fine. A long test in front of the merge button is a
      # decision, and this makes someone make it: over the budget, a test
      # either moves to the scheduled lane with @pytest.mark.slow, gets a
      # cheap wiring half split out of it, or goes on the baseline with a
      # reason. Anything already marked slow never reaches this -- it is
      # filtered out before pytest writes the JUnit.
      - name: Enforce the PR-lane test duration budget
        if: always()
        run: |
          python3 ../scripts/e2e_durations.py \
            coverage-backend/junit-e2e-${{ matrix.shard.name }}.xml --check
      - name: Record the commit this coverage was measured on
        if: always()
        run: |
          mkdir -p coverage-backend
          echo "$GITHUB_SHA" > coverage-backend/measured-sha.txt
      # `junit-*.phases.json` is the per-phase breakdown written beside each
      # JUnit. Kept because the JUnit alone cannot answer the question the
      # budget step above raises -- whether a test is slow, or merely went
      # first and paid for the session fixtures -- and reconstructing that by
      # hand is what investigating a budget failure costs otherwise.
      - name: Upload backend e2e coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-e2e-${{ matrix.shard.name }}-coverage
          include-hidden-files: true
          path: |
            lemma-backend/.coverage.backend
            lemma-backend/coverage-backend/measured-sha.txt
            lemma-backend/coverage-backend/comment.md
            lemma-backend/coverage-backend/summary.json
            lemma-backend/coverage-backend/coverage.json
            lemma-backend/coverage-backend/coverage.xml
            lemma-backend/coverage-backend/junit-*.xml
            lemma-backend/coverage-backend/junit-*.phases.json
          if-no-files-found: ignore

  e2e-passed:
    name: Backend E2E passed
    # The single required context for this workflow. `needs` the matrix job
    # rather than a list of shard names, so a regenerated shard layout cannot
    # leave a shard unwatched -- the failure mode ci.yml's own aggregator hit
    # once, where a job missing from `needs` kept the check green while it
    # failed.
    timeout-minutes: 10
    # `!cancelled()`, not `always()`. `always()` runs this job even when the
    # *run* was cancelled -- which `cancel-in-progress` above does to every
    # superseded push -- and it then reported failure for a run that was
    # simply replaced by a newer one. 13 of 84 observed Backend E2E runs were
    # cancelled, and every one of them read as a failure. Nothing was ever
    # blocked, because GitHub judges the newest run; what it cost was the
    # ability to read the run list and tell whether CI is actually flaky.
    #
    # The step below still refuses a cancelled *shard*, which is a different
    # thing: `fail-fast: false` means the matrix never cancels its own
    # siblings, so a cancelled shard with a live run means somebody stopped one
    # job, and a required check must not go green on a run that did not finish.
    #
    # Skipped entirely on a push to main: that event exists only to warm the
    # sandbox-image cache, `backend-e2e` does not run there, and a required
    # check reporting green for a run that tested nothing is worse than no
    # check at all.
    if: ${{ !cancelled() && github.event_name != 'push' }}
    needs: [changes, sandbox-images, backend-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any shard failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more backend e2e shards failed or were cancelled."
          exit 1
      # A skipped matrix is the correct answer for a PR that cannot affect the
      # backend, so it reports success. Without this, path-filtering a required
      # check leaves it permanently pending and nothing can merge.
      - run: echo "Backend e2e passed (or was skipped as unaffected)."

  surface-live-smoke:
    name: agent surfaces live smoke
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'surface-live')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: lemma-backend/uv.lock
      - name: Sync deps
        run: uv sync
      - name: Live provider smoke tests
        run: uv run pytest app/modules/agent_surfaces/tests/e2e/test_surface_live_smoke_e2e.py -m surface_live -o timeout=120
        env:
          LEMMA_RUN_SURFACE_LIVE_E2E: "1"
