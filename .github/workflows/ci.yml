name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
      typescript: ${{ steps.filter.outputs.typescript }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codegen: ${{ steps.filter.outputs.codegen }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_packaging: ${{ steps.filter.outputs.desktop_packaging }}
      repo_tooling: ${{ steps.filter.outputs.repo_tooling }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'lemma-backend/**'
              - '.github/workflows/ci.yml'
            python_sdk:
              - 'lemma-python/**'
              - 'lemma-cli/**'
              - 'lemma-pod-bundle/**'
              - 'lemma-skills/**'
              - 'lemma-stack/**'
              - 'install.sh'
              - 'install.ps1'
              # The composite actions these jobs are made of. Without these
              # entries a change to what CI *checks* triggers nothing that runs
              # it, and the release workflows that share them find out first.
              - '.github/actions/verify-python-sdk/**'
              - '.github/actions/verify-cli-distributions/**'
              - '.github/workflows/ci.yml'
            typescript:
              - 'lemma-typescript/**'
              - '.github/actions/verify-typescript-sdk/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'lemma-frontend/**'
              - '.github/workflows/ci.yml'
            codegen:
              - 'lemma-python/lemma_sdk/openapi_spec.json'
              - 'lemma-python/lemma_sdk/openapi_client/**'
              - 'lemma-python/lemma_sdk/_spec_info.py'
              - 'lemma-python/scripts/generate_openapi_client.sh'
              - 'lemma-typescript/src/openapi_client/**'
              - 'lemma-typescript/src/react/generated/**'
              - 'lemma-typescript/scripts/generate_openapi_client.sh'
              - 'lemma-typescript/scripts/generate_l2.mjs'
              - 'lemma-typescript/scripts/patch_generated_imports.mjs'
              - '.github/workflows/ci.yml'
            desktop:
              # desktop/** is now every Rust crate the app ships: the shell,
              # locald, the Agent Host, and the runtime helpers, all one cargo
              # workspace. That is what stopped local-runtime/hostctl and the
              # Swift VZ helper being invisible to CI — they were always built
              # by the desktop job through build-sidecar.sh, and nothing ever
              # triggered it.
              - 'desktop/**'
              - 'lemma-stack/**'
              - 'lemma-frontend/lib/education/concepts.ts'
              - 'scripts/prepare_desktop_test_runtime.py'
              - 'scripts/build_local_guest_runtime.sh'
              - '.github/actions/setup-apple-signing/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-desktop.yml'
              - '.github/workflows/release-local-images.yml'
            # What can change how the app is *packaged*, as opposed to what it
            # does. Bundling is the expensive half of the Windows check -- 255s
            # of a 707s job, for an installer that is then thrown away -- and
            # nothing outside this list can alter its result. Ordinary Rust
            # changes still get compiled, linted and tested on Windows; they
            # just stop paying to watch NSIS produce the same installer again.
            desktop_packaging:
              - 'desktop/tauri*.conf.json'
              - 'desktop/Cargo.toml'
              - 'desktop/Cargo.lock'
              - 'desktop/icons/**'
              - 'desktop/capabilities/**'
              - 'desktop/permissions/**'
              - 'desktop/build.rs'
              - 'desktop/scripts/build-sidecar.ps1'
              - 'desktop/scripts/tauri-cli-version.txt'
              - 'desktop/runtime/lemma-local.json'
              - '.github/workflows/ci.yml'
            repo_tooling:
              - 'Makefile'
              - 'tests/**'
              - 'scripts/check_version_consistency.py'
              # tests/ imports these two as modules, so they are covered by a
              # job that took twenty seconds and did not run for them. Editing
              # prepare_desktop_test_runtime.py started the ninety-minute
              # desktop job and skipped the test that reads it.
              - 'scripts/build_local_host_pack.py'
              - 'scripts/prepare_desktop_test_runtime.py'
              # These tests assert on the env names the backend settings read,
              # so the drift they exist to catch lands in the settings module,
              # not only in the Makefile that writes it.
              - 'lemma-backend/app/modules/workspace/config.py'
              - '.github/workflows/ci.yml'
  backend-unit:
    name: lemma-backend unit
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    defaults:
      run:
        working-directory: lemma-backend
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --extra local
      - name: Unit tests with coverage
        run: make coverage-backend-unit
        env:
          REDIS_URL: redis://localhost:6379
      - name: Add backend coverage to job summary
        if: always()
        run: |
          if [ -f coverage-backend/comment.md ]; then
            cat coverage-backend/comment.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload backend unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          include-hidden-files: true
          path: |
            lemma-backend/.coverage.backend
            lemma-backend/coverage-backend/comment.md
            lemma-backend/coverage-backend/summary.json
            lemma-backend/coverage-backend/coverage.json
            lemma-backend/coverage-backend/coverage.xml
            lemma-backend/coverage-backend/html
          if-no-files-found: ignore
  backend-lint:
    name: lemma-backend quality gates
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --extra local
      - name: Ruff handwritten backend
        run: make lint
      - name: Async-safety lint
        run: make lint-async
      # The pool is sized on the promise that a connection is never held across
      # non-database work, and worker concurrency is sized on the promise that
      # blocking work is bounded. These two gates are what keep both true.
      - name: DB connection scope
        run: make lint-session-scope
      - name: I/O hygiene (bounded offloads, timed HTTP sessions)
        run: make lint-io-hygiene
      # Keeps the e2e suite's one canonical wait helper (waiters.eventually())
      # from eroding back into ~50 duplicated hand-rolled poll loops.
      - name: e2e wait patterns (no new hand-rolled poll loops)
        run: make lint-e2e-waits
      # The static gates above check the shapes they can see. This one runs the
      # flows and measures: a connection checked out with no statement running
      # is a hold, whatever the code looks like. Deliberately a small marked
      # subset rather than the whole e2e suite — this gates merges, so it has to
      # stay hermetic and fast. The full suite stays advisory in e2e.yml.
      - name: DB connection scope (runtime)
        run: make test-connection-scope
      - name: Critical domain type safety
        run: make typecheck-critical
      - name: Architecture, complexity, and broad-catch ratchet
        run: make architecture
      # The codegen-drift gate only proves the SDKs match the committed spec.
      # Nothing proved the committed spec matches the routes this app defines,
      # so a new endpoint could ship with both SDKs silently lacking it. This
      # compares the two, and belongs here rather than in codegen-drift because
      # it needs the backend's dependencies to import the app.
      - name: OpenAPI spec matches the routes the app defines
        run: uv run python scripts/dump_openapi_spec.py --check

  backend-migration:
    name: lemma-backend migration upgrade/downgrade
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lemma-backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.3-pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Verify consolidated reliability migration
        run: uv run python scripts/verify_reliability_migration.py
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migration_test

  python-sdk:
    name: Python SDK + CLI tests
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Shared with release-lemma-python.yml and release-lemma-terminal.yml, so
      # what a release verifies cannot drift from what a pull request does.
      - uses: ./.github/actions/verify-python-sdk

  cli-packaging:
    name: lemma-terminal wheel (clean checkout)
    # What users install is a built artifact, and its two most important
    # contents — the agent skills and lemma_pod_bundle — exist in it only
    # because setup.py copies them in. No test that reads the source tree can
    # see that fail, and a build in a tree that has built before cannot either:
    # the copies from the previous build are still lying there. Only a build
    # from a clean checkout tells the truth, which is what a fresh `actions/
    # checkout` gives us, and what `uv tool install` from git gives a user.
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build sdist + wheel the way the release does
        working-directory: lemma-cli
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # Shared with release-lemma-terminal.yml, which runs it on the exact
      # distributions it is about to upload.
      - uses: ./.github/actions/verify-cli-distributions
        with:
          dist-dir: lemma-cli/dist

  typescript-sdk:
    name: TypeScript SDK checks
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: lemma-typescript/package-lock.json
      # Shared with release-lemma-typescript.yml, so what a release verifies
      # cannot drift from what a pull request does.
      - uses: ./.github/actions/verify-typescript-sdk

  codegen-drift:
    name: Codegen drift gate
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.codegen == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: lemma-typescript/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Regenerate Python client from committed spec
        working-directory: lemma-python
        run: OPENAPI_FILE=lemma_sdk/openapi_spec.json bash scripts/generate_openapi_client.sh
      - name: Fail on Python drift
        run: |
          git diff --exit-code lemma-python/lemma_sdk/openapi_client lemma-python/lemma_sdk/_spec_info.py \
            || { echo "::error::Committed Python client is out of sync — run scripts/generate_openapi_client.sh and commit"; exit 1; }
      - name: Regenerate TypeScript client from committed spec
        working-directory: lemma-typescript
        run: OPENAPI_FILE=../lemma-python/lemma_sdk/openapi_spec.json bash scripts/generate_openapi_client.sh
      - name: Fail on TypeScript drift
        run: |
          git diff --exit-code lemma-typescript/src/openapi_client \
            || { echo "::error::Committed TypeScript client is out of sync — run scripts/generate_openapi_client.sh and commit"; exit 1; }
      - name: Regenerate L2 hooks from x-lemma metadata
        working-directory: lemma-typescript
        run: node scripts/generate_l2.mjs
      - name: Fail on L2 hook drift
        run: |
          git diff --exit-code lemma-typescript/src/react/generated \
            || { echo "::error::Generated L2 hooks are stale — run 'npm run generate:l2' and commit"; exit 1; }

  frontend-check:
    name: Frontend lint, design audit, test
    timeout-minutes: 30
    needs: changes
    # Also on an SDK change: the frontend typechecks against lemma-typescript,
    # so an SDK signature change breaks `npm run check` here while only
    # "Frontend build" was watching for it.
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            lemma-typescript/package-lock.json
            lemma-frontend/package-lock.json
      - name: Install TypeScript SDK dependencies
        working-directory: lemma-typescript
        run: npm ci
      - name: Install frontend dependencies
        working-directory: lemma-frontend
        run: npm ci
      - name: Lint, typecheck, design audit
        working-directory: lemma-frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: lemma-frontend
        run: npm test

  frontend-build:
    name: Frontend build (SDK integration)
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            lemma-typescript/package-lock.json
            lemma-frontend/package-lock.json
      - name: Install TypeScript SDK dependencies
        working-directory: lemma-typescript
        run: npm ci
      - name: Install frontend dependencies
        working-directory: lemma-frontend
        run: npm ci
      - name: Build frontend (builds the SDK via prebuild)
        working-directory: lemma-frontend
        run: npm run build
      # Reads the build above. Fails when the bytes a browser must fetch before
      # it can paint grow past scripts/bundle-budget-baseline.json.
      - name: Bundle budget
        working-directory: lemma-frontend
        run: npm run bundle:budget:ci
      - name: Verify generated SDK browser bundles are committed
        run: git diff --exit-code -- lemma-typescript/public/lemma-client.js lemma-typescript/public/lemma-ui.js

  # lemma-stack renders the environment the backend actually boots with, so its
  # tests are the only thing that catches a writer drifting from the settings
  # class that reads it. They need no Docker and finish in seconds; only
  # test_install_experience.py does, and it keeps its own job below.
  lemma-stack-unit:
    name: lemma-stack unit
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run lemma-stack unit tests
        working-directory: lemma-stack
        run: uv run python -m pytest tests/ --ignore=tests/test_install_experience.py -q

  # The dev-workflow tests assert on the env `make dev` hands the backend. They
  # had drifted badly enough to reference deleted targets, because nothing ran
  # them outside `make test-dev-workflow`.
  dev-workflow:
    name: Dev workflow
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.repo_tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run dev workflow tests
        run: python3 -m unittest tests.test_dev_workflow -v
      # tests/ has always been in this job's path filter, but only the dev
      # workflow file was ever run. The other two cover the scripts that build
      # the host pack and stage a bundled runtime -- both of which the desktop
      # installers now depend on.
      - name: Run repo tooling tests
        run: uv run --with pytest python -m pytest tests/ -q

  install-experience:
    name: Install experience (Linux Docker)
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run install experience tests
        working-directory: lemma-stack
        run: uv run python -m pytest tests/test_install_experience.py -v

  windows-cli:
    name: Windows CLI smoke test
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.python_sdk == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install lemma-cli from local checkout
        run: uv tool install --force ./lemma-cli
      - name: lemma --version
        run: |
          $ErrorActionPreference = "Stop"
          $lemmaBin = uv tool dir --bin
          $env:PATH = "$lemmaBin;$env:PATH"
          $ver = lemma --version 2>&1
          Write-Host $ver
          $ver | Select-String "lemma 0\." | Out-Null
          if (-not $?) { Write-Error "lemma --version failed"; exit 1 }
      - name: lemma --help
        run: |
          $ErrorActionPreference = "Stop"
          $lemmaBin = uv tool dir --bin
          $env:PATH = "$lemmaBin;$env:PATH"
          $help = lemma --help 2>&1
          Write-Host $help
          $help | Select-String "Usage:" | Out-Null
          if (-not $?) { Write-Error "lemma --help failed"; exit 1 }
      - name: lemma doctor
        run: |
          $lemmaBin = uv tool dir --bin
          $env:PATH = "$lemmaBin;$env:PATH"
          lemma doctor 2>&1
          # doctor may exit 1 if no server; just verify it doesn't crash
      # Absorbed from windows-cli-smoke.yml, which ran a second Windows runner
      # on every push to main to assert these two and nothing else this job did
      # not already cover.
      - name: lemma servers list / auth status
        run: |
          $ErrorActionPreference = "Stop"
          $lemmaBin = uv tool dir --bin
          $env:PATH = "$lemmaBin;$env:PATH"
          lemma servers list
          if ($LASTEXITCODE -ne 0) { throw "lemma servers list exited $LASTEXITCODE" }
          # auth status exits 1 when logged out — that is expected; it just must
          # not crash with a Windows-incompatibility error.
          lemma auth status
          if ($LASTEXITCODE -notin 0, 1) { throw "lemma auth status exited $LASTEXITCODE" }
          # `auth status` leaves $LASTEXITCODE at 1 when logged out, and pwsh
          # hands the step whatever it holds at the end. Say so explicitly.
          Write-Host "smoke commands ok"
          exit 0
      - name: Validate install.ps1
        shell: pwsh
        run: |
          # Static validation of the PowerShell install script
          $content = Get-Content install.ps1 -Raw
          if ($content -notmatch "uv tool install") { Write-Error "install.ps1 missing uv tool install"; exit 1 }
          if ($content -notmatch "lemma-stack") { Write-Error "install.ps1 missing lemma-stack"; exit 1 }
          if ($content -notmatch "ErrorActionPreference") { Write-Error "install.ps1 missing error handling"; exit 1 }
          Write-Host "install.ps1 validation passed"

  # One job for the whole desktop workspace. locald had its own because of the
  # runner OS - "macOS, not Linux, because that is a platform locald ships on;
  # most of managed_runtime.rs is behind macOS/Windows cfgs, so a Linux build
  # lints code that never ships while never linting the code that does" - and
  # folding it in here satisfies that rather than contradicting it, since this
  # job already runs on macos-14. The Agent Host followed: it is Desktop-only
  # now, so ubuntu was testing a platform it no longer ships on.
  desktop:
    name: Desktop workspace (fmt, clippy, tests, macOS build + codesign)
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The Agent Host's ACP integration tests spawn a scripted Python agent
      # over stdio, and panic outright when there is no interpreter to spawn.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      # rustfmt compiles nothing, so --all covers lemma-guestd too.
      # The Tauri CLI version is pinned in one file and read from it by the
      # Makefile, desktop.ps1, and four workflows. A reintroduced literal is a
      # version the next upgrade will miss.
      - name: Tauri CLI version is pinned in one place
        run: |
          if git grep -n "@tauri-apps/cli@[0-9]" -- ':!desktop/scripts/tauri-cli-version.txt'; then
            echo "::error::Read the pin from desktop/scripts/tauri-cli-version.txt instead."
            exit 1
          fi

      # rustfmt compiles nothing, so it can run before the cache is warm and
      # before the sidecars exist. --all covers lemma-guestd too.
      - name: Check formatting
        working-directory: desktop
        run: cargo fmt --all --check

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-ci-cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-ci-cargo-${{ runner.os }}-

      - name: Import Developer ID certificate
        id: apple-signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/setup-apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Select Developer ID signing
        if: steps.apple-signing.outcome == 'success'
        env:
          SIGNING_IDENTITY: ${{ steps.apple-signing.outputs.signing-identity }}
        run: |
          echo "APPLE_SIGNING_IDENTITY=${SIGNING_IDENTITY}" >> "${GITHUB_ENV}"
          echo "LEMMA_EXPECTED_SIGNING=developer-id" >> "${GITHUB_ENV}"

      - name: Select ad-hoc signing for untrusted builds
        if: steps.apple-signing.outcome == 'skipped'
        run: |
          echo "APPLE_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"
          echo "LEMMA_EXPECTED_SIGNING=adhoc" >> "${GITHUB_ENV}"

      - name: Bake splash concepts
        run: node desktop/scripts/extract-concepts.mjs

      - name: Verify baked splash concepts are committed
        run: git diff --exit-code desktop/ui/concepts.gen.json

      # tauri-build resolves the externalBin sidecars at build-script time and
      # fails when they are absent, so clippy and the tests need them just as
      # much as bundling does. Nothing that compiles lemma-desktop may run
      # before this step.
      - name: Build native local sidecars
        run: desktop/scripts/build-sidecar.sh

      - name: Lint
        working-directory: desktop
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --workspace --locked

      # desktop/runtime/lemma-local.json is committed as an online-shaped
      # placeholder: unresolvable URLs, zero digests, and `artifact_source:
      # ci-build-check` so the app refuses with a useful message instead of a
      # connection error. That is what this job builds against -- it proves the
      # app builds and codesigns, it does not produce an installer. The
      # installable test builds come from release-local-images.yml with
      # publish: false. `make version-check` keeps the placeholder's version
      # pinned to Desktop's.
      - name: Sign virtualization helper
        shell: bash
        run: |
          set -euo pipefail
          helper="desktop/binaries/lemma-vz-aarch64-apple-darwin"
          args=(
            --force
            --options runtime
            --entitlements desktop/entitlements.plist
            --sign "${APPLE_SIGNING_IDENTITY}"
          )
          if [[ "${APPLE_SIGNING_IDENTITY}" != "-" ]]; then
            args+=(--timestamp)
          fi
          codesign "${args[@]}" "${helper}"
          codesign --verify --strict --verbose=2 "${helper}"
          codesign -d --entitlements :- "${helper}" 2>&1 \
            | grep -F "com.apple.security.virtualization"

      - name: Read the pinned Tauri CLI
        run: |
          echo "TAURI_CLI=@tauri-apps/cli@$(tr -d '[:space:]' < desktop/scripts/tauri-cli-version.txt)" >> "$GITHUB_ENV"

      - name: Build and codesign online DMG
        working-directory: desktop
        run: npx -y "$TAURI_CLI" build --config tauri.online.conf.json

      - name: Verify application signature
        shell: bash
        run: |
          set -euo pipefail
          app="desktop/target/release/bundle/macos/Lemma.app"
          locald="${app}/Contents/MacOS/lemma-locald"
          runtime_bridge="${app}/Contents/MacOS/lemma-runtime"
          vz="${app}/Contents/Resources/lemma-vz"

          test -d "${app}"
          test -x "${locald}"
          test -x "${runtime_bridge}"
          test -x "${vz}"
          test -f "${app}/Contents/Resources/lemma-local.json"
          test ! -e "${app}/Contents/MacOS/lemma-supervisor"
          test ! -e "${app}/Contents/MacOS/uv"
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign --verify --strict --verbose=2 "${locald}"
          codesign --verify --strict --verbose=2 "${runtime_bridge}"
          codesign --verify --strict --verbose=2 "${vz}"
          codesign -d --entitlements :- "${vz}" 2>/dev/null \
            | grep -F "com.apple.security.virtualization"
          # The daemon's keychain access is keyed to this identifier, and Tauri
          # re-signs sidecars without one of its own -- so this asserts the
          # embedded Info.plist survived bundling. Ad-hoc builds re-prompt either
          # way, but a drop here would reach release signing unnoticed.
          codesign -dvvv "${locald}" 2>&1 | grep -Fx "Identifier=work.lemma.locald"

          signature_info="$(codesign -dvvv "${app}" 2>&1)"
          printf '%s\n' "${signature_info}"
          if [[ "${LEMMA_EXPECTED_SIGNING}" == "developer-id" ]]; then
            grep -F "Authority=Developer ID Application:" <<< "${signature_info}"
          else
            grep -F "Signature=adhoc" <<< "${signature_info}"
          fi

      - name: Upload macOS build-check DMG
        uses: actions/upload-artifact@v4
        with:
          name: lemma-desktop-macos-buildcheck-${{ github.sha }}
          path: desktop/target/release/bundle/dmg/Lemma_*_aarch64.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always() && steps.apple-signing.outcome == 'success'
        run: security delete-keychain "${{ steps.apple-signing.outputs.keychain-path }}"

  # guestd's vsock listener is behind a Linux cfg that only a Linux build ever
  # compiles, so the macOS workspace run says nothing about the code that
  # actually runs inside the guest. Before the workspace, a change under
  # local-runtime/guestd triggered the locald job, which never compiled it.
  desktop-guestd:
    name: Guest daemon (Linux)
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-guestd-cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-guestd-cargo-${{ runner.os }}-

      - name: Lint
        working-directory: desktop
        run: cargo clippy -p lemma-guestd --locked --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test -p lemma-guestd --locked

  # Windows is a platform Desktop ships on, and until now the Tauri/NSIS path
  # and every cfg(windows) branch in locald and the runtime manager were only
  # exercised at release - which is a bad time to find out. This is also the
  # only job that compiles the WSL runtime driver at all.
  desktop-windows:
    name: Windows desktop build check
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-win-cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-win-cargo-${{ runner.os }}-

      - name: Bake splash concepts
        run: node desktop/scripts/extract-concepts.mjs

      - name: Verify baked splash concepts are committed
        run: git diff --exit-code desktop/ui/concepts.gen.json

      # Before clippy and the tests, not after: tauri-build resolves the
      # externalBin sidecars at build-script time, so nothing that compiles
      # lemma-desktop can run until they exist.
      - name: Build Windows sidecars
        run: desktop/scripts/build-sidecar.ps1

      # lemma-guestd is the Linux guest daemon and reaches for std::os::unix
      # unconditionally, so it does not compile for Windows at all. The macOS
      # and Linux jobs cover it.
      - name: Lint the Windows code paths
        working-directory: desktop
        run: cargo clippy --workspace --exclude lemma-guestd --locked --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --workspace --exclude lemma-guestd --locked

      - name: Read the pinned Tauri CLI
        run: |
          $v = (Get-Content desktop/scripts/tauri-cli-version.txt).Trim()
          "TAURI_CLI=@tauri-apps/cli@$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Unsigned: the Authenticode path needs release secrets. This proves the
      # bundler runs and the payload stays within budget, not that the artifact
      # is installable.
      # Skipped on a pull request that cannot have changed the result. The
      # bundle is the single most expensive step in CI's Windows job and its
      # output is discarded, so it runs where a regression would actually be
      # caught by it: every push to main, and any branch that touches packaging.
      # A compile or test regression -- the thing this job exists to catch, and
      # the thing that has actually caught real bugs -- is still gated on every
      # pull request by the clippy and test steps above.
      - name: Build online NSIS installer
        if: >-
          github.event_name == 'push'
          || needs.changes.outputs.desktop_packaging == 'true'
        working-directory: desktop
        run: |
          npx -y $env:TAURI_CLI build --config tauri.online.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Online NSIS build failed" }

      # Measures what the step above produced, so it goes wherever that goes.
      - name: Enforce small online application payload
        if: >-
          github.event_name == 'push'
          || needs.changes.outputs.desktop_packaging == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $payload = @(
            "desktop/target/release/lemma-desktop.exe",
            "desktop/binaries/lemma-locald-x86_64-pc-windows-msvc.exe",
            "desktop/binaries/lemma-runtime-x86_64-pc-windows-msvc.exe",
            "desktop/runtime/lemma-local.json"
          )
          $bytes = ($payload | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Online payload is missing: $_" }
            (Get-Item $_).Length
          } | Measure-Object -Sum).Sum
          # The online application downloads its runtime on first launch, so the
          # installed payload is the shell plus the daemon and nothing else.
          if ($bytes -gt 25MB) {
            throw "Online application payload is $bytes bytes; the limit is 25 MiB"
          }
          Write-Host "online payload ok: $bytes bytes"

  ci:
    name: CI passed
    timeout-minutes: 10
    if: always()
    needs:
      - changes
      - backend-unit
      - backend-lint
      - backend-migration
      - python-sdk
      # Was missing: a wheel that ships without its skills or lemma_pod_bundle
      # failed this job and "CI passed" stayed green.
      - cli-packaging
      - typescript-sdk
      - codegen-drift
      - frontend-check
      - frontend-build
      - lemma-stack-unit
      - dev-workflow
      - install-experience
      - windows-cli
      - desktop
      - desktop-guestd
      - desktop-windows
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required suite failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more required CI suites failed or were cancelled."
          exit 1
      - run: echo "All required CI suites passed (or were skipped as unaffected)."
