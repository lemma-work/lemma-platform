name: Sandbox E2B conformance

# E2B is the production sandbox provider, but its conformance suite needs live
# credentials and published template builds, so it cannot run on every PR the
# way the Docker suite does. It runs on a schedule instead, and on demand, so
# the provider that actually serves users has a real gate rather than a suite
# that is skipped by default.
on:
  schedule:
    # 05:00 UTC daily, before EU/US working hours.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Real sandboxes are created against a shared account; never run two at once.
  group: sandbox-e2b-conformance
  cancel-in-progress: false

jobs:
  e2b-conformance:
    name: Real E2B provider contract
    timeout-minutes: 45
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: lemma-backend/uv.lock
      - name: Install with the E2B extra
        run: uv sync --extra local --extra e2b --locked
      - name: Verify E2B configuration is present
        # Fail loudly rather than letting the suite skip itself into a green
        # tick, which is exactly how this provider went unverified before.
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_WORKSPACE_TEMPLATE: ${{ vars.E2B_WORKSPACE_TEMPLATE }}
          E2B_WORKSPACE_BUILD_ID: ${{ vars.E2B_WORKSPACE_BUILD_ID }}
          E2B_FUNCTION_TEMPLATE: ${{ vars.E2B_FUNCTION_TEMPLATE }}
          E2B_FUNCTION_BUILD_ID: ${{ vars.E2B_FUNCTION_BUILD_ID }}
        run: |
          missing=""
          for name in E2B_API_KEY \
            E2B_WORKSPACE_TEMPLATE E2B_WORKSPACE_BUILD_ID \
            E2B_FUNCTION_TEMPLATE E2B_FUNCTION_BUILD_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required E2B configuration:$missing" >&2
            exit 1
          fi
      - name: Real E2B provider contract
        timeout-minutes: 30
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_WORKSPACE_TEMPLATE: ${{ vars.E2B_WORKSPACE_TEMPLATE }}
          E2B_WORKSPACE_BUILD_ID: ${{ vars.E2B_WORKSPACE_BUILD_ID }}
          E2B_FUNCTION_TEMPLATE: ${{ vars.E2B_FUNCTION_TEMPLATE }}
          E2B_FUNCTION_BUILD_ID: ${{ vars.E2B_FUNCTION_BUILD_ID }}
        run: >-
          uv run python -m pytest
          app/modules/workspace/tests/integration/test_e2b_provider_real.py
          sandbox_runtime/tests/test_e2b_templates.py
          sandbox_runtime/tests/test_e2b_template_build_config.py
          -m ""
          --junitxml=e2b-e2e.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-e2b-e2e
          path: lemma-backend/e2b-e2e.xml
          if-no-files-found: ignore
