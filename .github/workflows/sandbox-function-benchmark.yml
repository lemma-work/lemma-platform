name: Sandbox function benchmark

on:
  schedule:
    # Docker runs nightly. E2B runs weekly to retain live-provider signal while
    # bounding provider spend.
    - cron: "17 3 * * *"
    - cron: "43 3 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: Provider lane to run
        required: true
        default: both
        type: choice
        options:
          - both
          - docker
          - e2b

permissions:
  contents: read

concurrency:
  group: sandbox-function-benchmark-${{ github.event.schedule || inputs.provider || github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    if: >-
      github.event.schedule == '17 3 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.provider == 'docker' || inputs.provider == 'both'))
    name: Docker API/JOB table benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --locked
      - name: Build sandbox provider conformance images
        run: make sandbox-images
      - name: Resolve sandbox image tags
        run: |
          set -euo pipefail
          # From the Makefile, so a registry or tag change cannot silently
          # leave the benchmark pointing at an image that was never built.
          make print-sandbox-images | while read -r kind image; do
            case "$kind" in
              workspace:) echo "WORKSPACE_E2E_IMAGE=$image" >> "$GITHUB_ENV" ;;
              function:)  echo "FUNCTION_E2E_IMAGE=$image"  >> "$GITHUB_ENV" ;;
            esac
          done
      - name: Run Docker workspace and function provider conformance
        run: |
          uv run pytest -q \
            app/modules/workspace/tests/integration/test_docker_provider_real.py
      - name: Run Docker benchmark at concurrency 5
        env:
          FUNCTION_BENCH_CONCURRENCY: "5"
        run: make benchmark-functions-docker
      - name: Publish Docker benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-function-docker-${{ github.sha }}
          path: .benchmark-results/function-execution/docker/*.json
          if-no-files-found: error
          retention-days: 30

  e2b:
    if: >-
      github.event.schedule == '43 3 * * 1' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.provider == 'e2b' || inputs.provider == 'both'))
    name: E2B API/JOB table benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: backend-protected-e2e
    defaults:
      run:
        working-directory: lemma-backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --locked
      - name: Install pinned Cloudflare tunnel client
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-amd64.deb
          echo "88195157a136199a86977c122a22084dae6907480bbe3640222b7b55834afc3a  /tmp/cloudflared.deb" \
            | sha256sum --check
          sudo dpkg --install /tmp/cloudflared.deb
          cloudflared --version
      - name: Require protected E2B credential
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: test -n "$E2B_API_KEY"
      - name: Pin the immutable E2B templates
        env:
          WORKSPACE_TEMPLATE: ${{ vars.E2B_WORKSPACE_TEMPLATE }}
          WORKSPACE_BUILD_ID: ${{ vars.E2B_WORKSPACE_BUILD_ID }}
          FUNCTION_TEMPLATE: ${{ vars.E2B_FUNCTION_TEMPLATE }}
          FUNCTION_BUILD_ID: ${{ vars.E2B_FUNCTION_BUILD_ID }}
        run: |
          set -euo pipefail
          test -n "$WORKSPACE_TEMPLATE"
          test -n "$WORKSPACE_BUILD_ID"
          test -n "$FUNCTION_TEMPLATE"
          test -n "$FUNCTION_BUILD_ID"
          # `<template_id>:<build_id>`. The workspace settings take one template
          # string with no build field -- passing the id alone would benchmark
          # whatever build the mutable tag happens to point at.
          echo "E2B_WORKSPACE_TEMPLATE=$WORKSPACE_TEMPLATE:$WORKSPACE_BUILD_ID" >> "$GITHUB_ENV"
          echo "E2B_FUNCTION_TEMPLATE=$FUNCTION_TEMPLATE:$FUNCTION_BUILD_ID" >> "$GITHUB_ENV"
      - name: Run E2B workspace and function provider conformance
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          uv run pytest -q \
            app/modules/workspace/tests/integration/test_e2b_provider_real.py
      - name: Run E2B benchmark at concurrency 5
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          FUNCTION_BENCH_CONCURRENCY: "5"
          # The protected lane has no ngrok account dependency. Local acceptance
          # may select ngrok to distinguish tunnel failures from executor failures.
          FUNCTION_BENCH_TUNNEL: cloudflared
        run: make benchmark-functions-e2b
      - name: Publish E2B benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-function-e2b-${{ github.sha }}
          path: .benchmark-results/function-execution/e2b/*.json
          if-no-files-found: error
          retention-days: 30
