name: Announce a release

# Follows a release in Slack from the tag push to the last package, and says
# what is actually installable.
#
# It starts with the tag, alongside the workflows that publish, and posts as it
# goes: that the release started; each package as its registry begins serving
# that exact version, with a link; each release run that fails, with a link to
# the run; and a final summary that names, registry by registry, what has the
# version and what does NOT. A component that is missing is in the first line,
# and this job fails, so the release shows red in Actions as well as in Slack.
#
# The registries are the source of truth, not the runs. 0.7.2 "succeeded" by
# every signal this repository produced and shipped no packages at all, and
# 0.8.0's three package publishes failed on the tag push without a message,
# because the failure notifier does not announce tag pushes and this workflow
# then only woke when the image release finished -- which it did, green.
#
# Triggered by the tag push rather than `release: published` for the reason
# that caused the 0.7.2 hole: a release created by a workflow is authored by
# github-actions[bot], and GitHub will not start a new workflow run from an
# event the default GITHUB_TOKEN raised. A dispatch follows a repair: give it
# the version, re-run whichever publish failed, and it reports those runs too.
#
# Watched by notify-failure.yml, which announces this workflow's tag-push
# failures as well, so this one going quiet is itself reported.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to follow, for example 0.10.0 or v0.10.0"
        required: true
        type: string

permissions:
  contents: read
  # To read the release workflows' runs for the tag.
  actions: read

concurrency:
  group: release-announce-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  announce:
    name: Announce
    # The image release takes up to 90 minutes and dispatches the Desktop
    # release, which takes up to 120 more; the tracker gives up at 210.
    timeout-minutes: 225
    runs-on: ubuntu-latest
    steps:
      # The default branch's script for a dispatch, deliberately, rather than
      # the tag's: a dispatch for a release older than this workflow would
      # otherwise check out a tag without the script. On a tag push the two are
      # the same commit. Changelog entries accumulate and are never removed, so
      # the entry being announced is on the default branch either way.
      - uses: actions/checkout@v7
        with:
          # This job reads files and posts to Slack; it pushes nothing, so the
          # checkout token has no reason to stay on disk for later steps.
          persist-credentials: false

      - name: Resolve the release version
        id: release
        env:
          RAW: ${{ inputs.version || github.ref_name }}
        run: python3 scripts/release_registry.py version "$RAW"

      - name: Post progress, then say what is installable
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python3 scripts/report_release_to_slack.py "$VERSION"
          --track --require-complete --wait-seconds 12600
