name: Release Lemma Terminal CLI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 1.2.3 or v1.2.3"
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: release-lemma-terminal-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require fresh backend protected E2E
        uses: ./.github/actions/require-backend-protected-e2e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.sha }}

  build-agent-host:
    name: Agent Host (${{ matrix.target }})
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build native Agent Host
        run: cargo build --manifest-path agent-host/Cargo.toml --release --locked --target ${{ matrix.target }}

      - name: Package binary and checksum
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import hashlib
          import os
          import pathlib
          import shutil
          import subprocess

          target = os.environ["TARGET"]
          extension = ".exe" if os.name == "nt" else ""
          source = (
              pathlib.Path("agent-host")
              / "target"
              / target
              / "release"
              / f"lemma-agent-host{extension}"
          )
          output = pathlib.Path("dist") / f"lemma-agent-host-{target}{extension}"
          output.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, output)
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          output.with_name(f"{output.name}.sha256").write_text(
              f"{digest}  {output.name}\n",
              encoding="ascii",
          )
          subprocess.run([str(output.resolve()), "--help"], check=True)

      - name: Verify clean uv tool install provisions Agent Host
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          LEMMA_AGENT_HOST_RELEASE_BASE_URL: file://${{ github.workspace }}/dist
          LEMMA_AGENT_HOST_INSTALL_DIR: ${{ runner.temp }}/lemma-agent-host
        run: |
          set -euo pipefail
          python -m pip install uv
          uv tool install --force ./lemma-cli
          lemma agent-host install
          lemma agent-host install

      - name: Preserve Agent Host release assets
        uses: actions/upload-artifact@v4
        with:
          name: agent-host-${{ matrix.target }}
          path: dist/*

  publish:
    needs:
      - verify-release
      - build-agent-host
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set package version from release tag
        shell: python
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid semver release tag: {os.environ['RELEASE_VERSION']}")

          path = pathlib.Path("lemma-cli/lemma_cli/__init__.py")
          text = path.read_text()
          text, count = re.subn(
              r'(?m)^__version__ = "[^"]+"$', f'__version__ = "{version}"', text, count=1
          )
          if count != 1:
              raise SystemExit("Could not find __version__ in lemma-cli/lemma_cli/__init__.py")
          path.write_text(text)

          pyproject = pathlib.Path("lemma-cli/pyproject.toml")
          pp_text = pyproject.read_text()
          pp_text, pp_count = re.subn(
              r'(?m)^(\s*)"lemma-sdk>=[^"]+",',
              rf'\g<1>"lemma-sdk>={version}",',
              pp_text,
              count=1,
          )
          if pp_count != 1:
              raise SystemExit("Could not find the lemma-sdk pin in lemma-cli/pyproject.toml")
          pyproject.write_text(pp_text)

      - name: Vendor agent skills into the package
        run: |
          mkdir -p lemma-cli/lemma_cli/skills
          for d in lemma-skills/*/; do
            if [ -f "$d/SKILL.md" ]; then
              cp -r "$d" "lemma-cli/lemma_cli/skills/"
            fi
          done

      - name: Vendor the shared pod-bundle package into the wheel
        shell: python
        run: |
          import pathlib
          import re
          import shutil

          # lemma-terminal imports lemma_pod_bundle at runtime, but that package
          # is unpublished: locally/CI it resolves from the sibling monorepo
          # checkout via [tool.uv.sources]. PyPI users have no such checkout, and
          # setuptools ignores [tool.uv.sources], so the dependency would leak
          # into the wheel's Requires-Dist and every `pip install lemma-terminal`
          # would fail on the missing lemma-pod-bundle distribution. Vendor the
          # (stdlib-only) package into the wheel and drop the runtime dependency.
          src = pathlib.Path("lemma-pod-bundle/lemma_pod_bundle")
          dst = pathlib.Path("lemma-cli/lemma_pod_bundle")
          if not src.is_dir():
              raise SystemExit(f"Vendor source not found: {src}")
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src, dst)

          pyproject = pathlib.Path("lemma-cli/pyproject.toml")
          text = pyproject.read_text()

          # Drop the now-vendored dependency so it stays out of Requires-Dist.
          text, dep_count = re.subn(
              r'(?m)^\s*"lemma-pod-bundle>=[^"]+",\n', "", text, count=1
          )
          if dep_count != 1:
              raise SystemExit("Could not find the lemma-pod-bundle dependency to strip")

          # Ship the vendored package alongside lemma_cli in the wheel.
          text, inc_count = re.subn(
              r'(?m)^include = \["lemma_cli\*"\]$',
              'include = ["lemma_cli*", "lemma_pod_bundle*"]',
              text,
              count=1,
          )
          if inc_count != 1:
              raise SystemExit("Could not find the packages.find include list to extend")

          pyproject.write_text(text)

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        working-directory: lemma-cli
        run: python -m build

      - name: Verify skills are bundled
        working-directory: lemma-cli
        shell: bash
        run: |
          set -euo pipefail
          count=$(python -c "import zipfile,glob; w=glob.glob('dist/*.whl')[0]; print(sum(1 for n in zipfile.ZipFile(w).namelist() if n.endswith('SKILL.md')))")
          echo "SKILL.md files in wheel: $count"
          test "$count" -ge 1 || { echo 'No skills bundled in the wheel — aborting release.'; exit 1; }

      - name: Verify pod-bundle is vendored and not a PyPI dependency
        working-directory: lemma-cli
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(wheel)
          names = zf.namelist()

          if "lemma_pod_bundle/__init__.py" not in names:
              sys.exit("lemma_pod_bundle is not vendored into the wheel — aborting release.")

          meta = next(n for n in names if n.endswith(".dist-info/METADATA"))
          leaked = [
              line
              for line in zf.read(meta).decode().splitlines()
              if line.startswith("Requires-Dist:") and "lemma-pod-bundle" in line
          ]
          if leaked:
              sys.exit(f"lemma-pod-bundle still declared as a dependency {leaked} — aborting release.")

          print("pod-bundle vendored into the wheel, no PyPI dependency — ok")
          PY

      - name: Check distribution
        working-directory: lemma-cli
        run: python -m twine check dist/*

      - name: Download Agent Host release assets
        uses: actions/download-artifact@v4
        with:
          pattern: agent-host-*
          merge-multiple: true
          path: agent-host-dist

      - name: Publish Agent Host release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.version }}
          files: agent-host-dist/*

      - name: Publish package
        working-directory: lemma-cli
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing dist/*
