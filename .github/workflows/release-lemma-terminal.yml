name: Release Lemma Terminal CLI

on:
  # The tag, not the release. A release created by a workflow runs as the
  # default GITHUB_TOKEN, and GitHub will not start a new workflow run from an
  # event that token raised -- so `release: published` fires only when a person
  # cuts the release by hand. v0.7.1 was cut by a person and this ran; v0.7.2
  # was cut by release-local-images.yml and this never ran at all, which is why
  # PyPI sat a release behind for ten days with nothing saying so.
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 1.2.3 or v1.2.3"
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: release-lemma-terminal-${{ github.event.release.tag_name || inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # Build and verify, plus up to twenty minutes waiting for the SDK below.
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      # Build the tag, not whatever the default branch happens to be. Without a
      # ref a workflow_dispatch checks out main and the version input only
      # rewrites the version string, so a dispatch run after an unrelated merge
      # would publish a different tree under this release's name -- and a
      # package version cannot be re-cut once it is on an index.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.version || github.ref }}

      # The protected backend suite is not a gate on this artifact. It exercises
      # the real Docker runtime, the document processors and the Rust agent
      # host; none of the three is in the wheel published here, and the job
      # already builds and tests exactly what it uploads. The desktop release
      # keeps the gate, which is what it was written for.

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The run that publishes the artifact is the run that tests it. CI's path
      # filter skips "Python SDK + CLI tests" whenever the release commit did not
      # touch these packages -- a backend-only release commit is the common case
      # -- and CI is green anyway, because "CI passed" treats a skipped suite as
      # passing. So a CI run for this SHA proves nothing about this wheel.
      # Before the version rewrite below: `uv lock --check` reads pyproject.toml,
      # and the rewrite pins lemma-sdk to a version not yet on PyPI.
      - name: Verify Python SDK and CLI
        uses: ./.github/actions/verify-python-sdk

      # The same gate release-lemma-python runs. This workflow had none, so a
      # tag whose components disagreed published a CLI anyway -- pinned to an
      # SDK version the other workflow then refused to publish.
      - name: Check version consistency across components
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
        run: python scripts/check_version_consistency.py --expect "$RELEASE_VERSION"

      - name: Set package version from release tag
        shell: python
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
        run: |
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid semver release tag: {os.environ['RELEASE_VERSION']}")

          path = pathlib.Path("lemma-cli/lemma_cli/__init__.py")
          text = path.read_text()
          text, count = re.subn(
              r'(?m)^__version__ = "[^"]+"$', f'__version__ = "{version}"', text, count=1
          )
          if count != 1:
              raise SystemExit("Could not find __version__ in lemma-cli/lemma_cli/__init__.py")
          path.write_text(text)

          # Both halves of the specifier, or the rewrite silently drops the
          # ceiling and every published CLI floats onto whatever SDK comes next.
          # Before 1.0 the next minor is the break; after it, the next major.
          major, minor, *_ = version.split(".")
          ceiling = f"{major}.{int(minor) + 1}" if major == "0" else f"{int(major) + 1}"

          pyproject = pathlib.Path("lemma-cli/pyproject.toml")
          pp_text = pyproject.read_text()
          pp_text, pp_count = re.subn(
              r'(?m)^(\s*)"lemma-sdk>=[^"]+",',
              rf'\g<1>"lemma-sdk>={version},<{ceiling}",',
              pp_text,
              count=1,
          )
          if pp_count != 1:
              raise SystemExit("Could not find the lemma-sdk pin in lemma-cli/pyproject.toml")
          pyproject.write_text(pp_text)

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        working-directory: lemma-cli
        run: python -m build

      # Skills, lemma_pod_bundle, and no unpublished distribution in
      # Requires-Dist, then an import from a venv with no checkout in sight —
      # the same checks CI runs on every pull request that touches the CLI, so a
      # release is never the first build anyone verified.
      - name: Verify the distributions carry what PyPI cannot supply
        uses: ./.github/actions/verify-cli-distributions
        with:
          dist-dir: lemma-cli/dist

      - name: Check distribution
        working-directory: lemma-cli
        run: python -m twine check dist/*

      # The CLI pins lemma-sdk>=X,<next-minor, and release-lemma-python publishes
      # that SDK in parallel with this run. Uploading first would put a CLI on
      # PyPI that nobody can install until the SDK lands -- or ever, if the SDK
      # publish fails, and a version cannot be re-cut once it is on an index. So
      # the CLI waits for its own SDK, and publishes nothing if it never comes.
      - name: Wait for the matching lemma-sdk on PyPI
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version || github.ref_name }}
        shell: python
        run: |
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          url = f"https://pypi.org/pypi/lemma-sdk/{version}/json"
          deadline = time.monotonic() + 20 * 60
          while True:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      if response.status == 200:
                          print(f"lemma-sdk {version} is on PyPI")
                          break
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      print(f"PyPI answered {exc.code}; retrying")
              except urllib.error.URLError as exc:
                  print(f"PyPI unreachable ({exc.reason}); retrying")
              if time.monotonic() > deadline:
                  raise SystemExit(
                      f"lemma-sdk {version} did not reach PyPI within 20 minutes; "
                      "not publishing a CLI that cannot be installed. Publish the "
                      "SDK (release-lemma-python.yml), then re-run this workflow."
                  )
              time.sleep(20)

      - name: Publish package
        working-directory: lemma-cli
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing dist/*
