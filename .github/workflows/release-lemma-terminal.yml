name: Release Lemma Terminal CLI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 1.2.3 or v1.2.3"
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: release-lemma-terminal-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require fresh backend protected E2E
        uses: ./.github/actions/require-backend-protected-e2e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The run that publishes the artifact is the run that tests it. CI's path
      # filter skips "Python SDK + CLI tests" whenever the release commit did not
      # touch these packages -- a backend-only release commit is the common case
      # -- and CI is green anyway, because "CI passed" treats a skipped suite as
      # passing. So a CI run for this SHA proves nothing about this wheel.
      # Before the version rewrite below: `uv lock --check` reads pyproject.toml,
      # and the rewrite pins lemma-sdk to a version not yet on PyPI.
      - name: Verify Python SDK and CLI
        uses: ./.github/actions/verify-python-sdk

      - name: Set package version from release tag
        shell: python
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid semver release tag: {os.environ['RELEASE_VERSION']}")

          path = pathlib.Path("lemma-cli/lemma_cli/__init__.py")
          text = path.read_text()
          text, count = re.subn(
              r'(?m)^__version__ = "[^"]+"$', f'__version__ = "{version}"', text, count=1
          )
          if count != 1:
              raise SystemExit("Could not find __version__ in lemma-cli/lemma_cli/__init__.py")
          path.write_text(text)

          # Both halves of the specifier, or the rewrite silently drops the
          # ceiling and every published CLI floats onto whatever SDK comes next.
          # Before 1.0 the next minor is the break; after it, the next major.
          major, minor, *_ = version.split(".")
          ceiling = f"{major}.{int(minor) + 1}" if major == "0" else f"{int(major) + 1}"

          pyproject = pathlib.Path("lemma-cli/pyproject.toml")
          pp_text = pyproject.read_text()
          pp_text, pp_count = re.subn(
              r'(?m)^(\s*)"lemma-sdk>=[^"]+",',
              rf'\g<1>"lemma-sdk>={version},<{ceiling}",',
              pp_text,
              count=1,
          )
          if pp_count != 1:
              raise SystemExit("Could not find the lemma-sdk pin in lemma-cli/pyproject.toml")
          pyproject.write_text(pp_text)

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        working-directory: lemma-cli
        run: python -m build

      # Skills, lemma_pod_bundle, and no unpublished distribution in
      # Requires-Dist, then an import from a venv with no checkout in sight —
      # the same checks CI runs on every pull request that touches the CLI, so a
      # release is never the first build anyone verified.
      - name: Verify the distributions carry what PyPI cannot supply
        uses: ./.github/actions/verify-cli-distributions
        with:
          dist-dir: lemma-cli/dist

      - name: Check distribution
        working-directory: lemma-cli
        run: python -m twine check dist/*

      - name: Publish package
        working-directory: lemma-cli
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing dist/*
