version: 2

# Version updates are intentionally low-frequency and grouped into one PR per
# ecosystem. Security updates remain immediate, but are grouped per ecosystem
# instead of opening one PR per vulnerable dependency.
#
# Routine updates leave major versions out for npm, uv and cargo. With them in,
# no routine group PR got through CI: the npm group in October went TypeScript
# 5→7, @types/node 24→26 and jsdom 24→30 in one PR, and three unrelated
# migrations cannot be reviewed as a lockfile bump. A major is a deliberate
# change someone makes on purpose, the way CONTRIBUTING describes bumping Rust.
#
# The limit is 2, not 1, and that is the whole point of it. Every ecosystem
# declares two groups -- routine and security -- and the limit counts open PRs
# for the ecosystem, not per group. At 1, an open routine PR held the only slot
# and the security group had nowhere to go, which is how 28 alerts accumulated
# under a config that reads as correct.
updates:
  # Every directory with a `uv.lock` is listed across the two uv entries below,
  # which together are the list `lint-lockfiles` gates on. A directory
  # Dependabot does not read is a directory a security advisory has no way to
  # reach, which is the failure the note above about the open-PR limit
  # describes.
  #
  # The split is about path dependencies. `lemma-python`, `lemma-pod-bundle` and
  # `lemma-cli` are installed by path into `lemma-backend`, both sandbox image
  # templates and each other, and uv records a path dependency's own
  # pyproject.toml specifiers inside every dependant's lock. Dependabot updates
  # each directory on its own, against the others as they are on main -- so
  # when one group PR edits `lemma-python/pyproject.toml` (the `ruff<0.18` cap
  # in September, a dev pin no image installs), every lock it wrote for the
  # dependants is stale before it is pushed. `lint-lockfiles` fails, and so
  # does every `uv sync --locked`, including the template Dockerfiles. Listing
  # the dependants here does not help: Dependabot owns their locks but resolves
  # them against the wrong sibling.
  #
  # So the three providers are lockfile-only: their own locks move, their
  # pyproject.toml never does, and no dependant's recorded metadata can change
  # under it. Raising a provider's floor or cap is a hand edit followed by
  # `uv lock` in every directory `lint-lockfiles` names.
  - package-ecosystem: uv
    directories:
      - /lemma-backend
      - /lemma-backend/sandbox-images/templates/function-python
      - /lemma-backend/sandbox-images/templates/workspace-python
      - /lemma-stack
      - /tests/scenarios
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      python-routine-updates:
        applies-to: version-updates
        patterns: ["*"]
      python-security-updates:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directories:
      - /lemma-cli
      - /lemma-pod-bundle
      - /lemma-python
    schedule:
      interval: monthly
      time: "04:05"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    versioning-strategy: lockfile-only
    groups:
      python-provider-routine-updates:
        applies-to: version-updates
        patterns: ["*"]
      python-provider-security-updates:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories:
      - /lemma-typescript
      - /lemma-frontend
      # The desktop UI tests have their own lock. It carried no advisory when it
      # was added here, which is the only time a directory is cheap to add.
      - /desktop/ui-tests
    schedule:
      interval: monthly
      time: "04:15"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      # React refuses to render unless `react` and `react-dom` are the exact
      # same version, and Dependabot bumps each on its own: the October routine
      # PR moved react to 19.3.1 and left react-dom at 19.3.0, and every
      # frontend test died on "Incompatible React versions". A group of their
      # own is listed first, so the pair is matched before the catch-all and
      # moves in one update.
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      javascript-routine-updates:
        applies-to: version-updates
        patterns: ["*"]
      javascript-security-updates:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      github-actions-updates:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]
    # `dtolnay/rust-toolchain`'s tag is not the action's version, it is the Rust
    # version the action installs -- so Dependabot reads the newest Rust release
    # tag on the action repository and proposes it as an upgrade. It proposed
    # 1.100.0, which is not a Rust release at all, and every desktop job in the
    # group PR died with "could not download nonexistent rust version". Worse,
    # a tag that *does* exist would be just as wrong: rust-toolchain.toml pins
    # the channel, the two must agree, and Dependabot only ever moves one of
    # them. Bumping Rust here is the deliberate two-file change CONTRIBUTING
    # describes, not something to receive monthly.
    ignore:
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: docker
    directories:
      - /lemma-backend
      - /lemma-frontend
      # The desktop guest image. `FROM ubuntu:24.04`, and nothing was watching
      # it: the backend image has Trivy in security.yml as a second line, and
      # this one has no scanner of its own at all.
      - /desktop/local-runtime/guest-image
    schedule:
      interval: monthly
      time: "04:45"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      docker-updates:
        applies-to: version-updates
        patterns: ["*"]
      docker-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  # `desktop` is a cargo workspace and was covered by no entry, so a Rust
  # advisory had nothing to open a PR against -- the `glib` alert sat with no
  # possible fix. The lockfile is at the workspace root.
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      rust-routine-updates:
        applies-to: version-updates
        patterns: ["*"]
      rust-security-updates:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
